d line = capsule; it should lift as you inject.</text></g></svg><figcaption>Diagram 1 · Glenohumeral joint, posterior view</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Lateral decubitus, side up, arm across the chest. Stand behind; machine in front.</li>\n<li>MSK preset, depth 4–6 cm, focus at the joint line.</li>\n<li>Show and name the structures; do the rotation test.</li>\n<li>Insert in-plane from the lateral end of the probe. The path is steep; heel the probe in, or use a curvilinear probe, to see the needle.</li>\n<li>Advance with the tip in view through deltoid and infraspinatus toward the gap between head and labrum.</li>\n<li>Stop just past the capsule, without touching labrum or cartilage.</li>\n<li>Inject a small volume: the posterior capsule should lift and fluid flow medially into the joint. If it resists, turn the bevel 90° or withdraw slightly.</li>\n<li>State the drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip in the posterior joint space, between the posterior labrum and the humeral head, just deep to the capsule.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Injecting into infraspinatus (spread stays in the muscle; capsule does not lift).</li>\n<li>Tip into the cartilage or labrum (high resistance).</li>\n<li>Mistaking the dark cartilage for fluid.</li>\n<li>Going too medial toward the spinoglenoid notch and suprascapular vessels.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Lateral or sitting, arm across chest, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Probe and preset suitable; depth and focus set</label></li>\n<li><label><input type='checkbox' data-i='2'> Deltoid, infraspinatus, humeral head, glenoid, labrum and capsule named</label></li>\n<li><label><input type='checkbox' data-i='3'> Dynamic rotation test shown</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane from lateral; entry and angle appropriate</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip between labrum and head, just deep to the capsule</label></li>\n<li><label><input type='checkbox' data-i='7'> Capsular distension shown; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which arm position opens the posterior joint? <details class='ans'><summary>Answer</summary>Arm across the chest, hand on the opposite shoulder (adduction and internal rotation).</details></li>\n<li>Which muscle lies directly over the posterior capsule? <details class='ans'><summary>Answer</summary>Infraspinatus.</details></li>\n<li>What is the accuracy of ultrasound-guided vs blind glenohumeral injection? <details class='ans'><summary>Answer</summary>87–100% with ultrasound; 27–100% blind.</details></li>\n<li>What should you not mistake for joint fluid? <details class='ans'><summary>Answer</summary>The dark hyaline cartilage over the humeral head.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 19 (McDonald &amp; Peng, Shoulder).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 26.</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 2.</li>\n<li>Peng PWH, Cheng P. Ultrasound-guided interventional procedures in pain medicine, Part III: shoulder. Reg Anesth Pain Med 2011;36:592–605.</li>\n<li>Rutten MJCM et al. Glenohumeral joint injection: a comparative study of ultrasound and fluoroscopically guided techniques before MR arthrography. Eur Radiol 2009;19:722–30.</li>\n<li>Wu WT et al. Effectiveness of glenohumeral joint dilatation for treatment of frozen shoulder: a systematic review and meta-analysis of randomized controlled trials. Sci Rep 2017;7:10507.</li>\n</ul>", "checks": 8}, "P13": {"title": "P13 Hip joint injection (anterior approach)", "html": "<p>Region: MSK joints · Station time: 15 minutes · Partner viva case: 12.1 hip osteoarthritis.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Supine, leg neutral or slightly internally rotated; stand on the affected side</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Curvilinear 2–6 MHz (linear 5–16 MHz if slim)</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G, 3.5–5 inch (90–125 mm) depending on size</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Short axis of the femoral shaft, slide up to the flat greater trochanter, then rotate along the femoral neck</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane from the distal-lateral end of the probe, entry about 2 cm away for a shallow path</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>On bone at the femoral head–neck junction, inside the anterior synovial recess under the capsule</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Saline hydrolocation or colour Doppler: fluid lifts the capsule off the neck and runs cephalad</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>4–8 mL local anaesthetic + 1 mL steroid (40 mg methylprednisolone or triamcinolone)</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Hip osteoarthritis, synovitis and labral pathology cause groin and anterior thigh pain. An intra-articular injection with local anaesthetic tells you whether the pain is from the joint (as opposed to spine, trochanteric or iliopsoas sources) and gives relief with steroid, hyaluronic acid or orthobiologics.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Ball-and-socket joint: femoral head in the acetabulum, deepened by the labrum.</li>\n<li>The capsule attaches along the intertrochanteric line in front; the iliofemoral ligament reinforces it.</li>\n<li>The anterior synovial recess lies over the femoral neck, under the capsule; this is the safest pocket to enter.</li>\n<li>Medial to the joint: femoral nerve, artery and vein (NAV, lateral to medial). Lateral: the LFCN and sartorius.</li>\n<li>The ascending branch of the lateral circumflex femoral artery runs between iliopsoas and rectus femoris, often in the needle path.</li>\n<li>Sensory supply: femoral, obturator and accessory obturator nerves (anteriorly), relevant for later hip denervation.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Probe across the upper third of the thigh: femoral shaft in short axis (bright dome).</li>\n<li>Slide up without changing the angle until the bone flattens: the anterior surface of the greater trochanter.</li>\n<li>Rotate the probe to lie along the femoral neck (oblique-sagittal) and slide toward the head.</li>\n<li>Name: acetabulum and labrum, femoral head (round, with dark cartilage), head–neck junction, femoral neck, capsule and iliofemoral ligament, anterior recess, iliopsoas over the head.</li>\n<li>Effusion: an anterior recess thicker than about 7 mm, or more than 2 mm thicker than the other side, suggests effusion or synovitis.</li>\n<li>Colour Doppler: femoral vessels medially; the ascending branch of the lateral circumflex femoral artery along the path.</li>\n</ol>\n<p>Diagram 1 below shows the long-axis view of the neck with the needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 428' role='img' aria-label='Hip joint injection: tip on the femoral head-neck junction under the capsule' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Hip: tip on the head–neck junction, inside the anterior recess</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic long-axis view along the femoral neck, supine. Screen left = cranial (acetabulum), right = caudal.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='150' y1='86' x2='640' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M160 112 L560 112 L560 176 Q380 186 160 180 Z' fill='var(--mus)' fill-opacity='0.16' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M170 214 L250 226' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M170 218 L250 230 L250 340 L170 340 Z' fill='var(--line)' fill-opacity='0.6'/><polygon points='250,224 280,214 262,240' fill='var(--muted)' fill-opacity='0.4'/></g><g><path d='M262 262 Q300 212 370 218 Q410 222 430 244 L620 278' fill='none' stroke='var(--muted)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M262 266 Q300 216 370 222 Q410 226 430 248 L620 282 L620 350 L262 350 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><path d='M252 204 Q330 192 420 208 Q520 226 620 250' fill='none' stroke='var(--muted)' stroke-width='2.5'/></g><g><path d='M432 230 Q520 240 600 260' fill='none' stroke='var(--ink)' stroke-width='1.5' stroke-dasharray='4 3'/></g><g><line x1='700' y1='110' x2='438' y2='240' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='560' y='104' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='434.0,233.0 431.6,238.8 425.4,239.2 430.2,243.2 428.7,249.3 434.0,246.0 439.3,249.3 437.8,243.2 442.6,239.2 436.4,238.8' fill='var(--accent)' stroke='var(--accent)'/><text x='300' y='300' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: head–neck junction</text></g><line x1='380' y1='288' x2='428' y2='250' stroke='var(--muted)' stroke-width='1'/><text x='300' y='150' font-size='12' text-anchor='middle' fill='var(--muted)'>Iliopsoas</text><text x='210' y='362' font-size='12' text-anchor='middle' fill='var(--muted)'>Acetabulum</text><line x1='272' y1='222' x2='250' y2='196' stroke='var(--muted)' stroke-width='1'/><text x='246' y='192' font-size='12' text-anchor='end' fill='var(--muted)'>Labrum</text><text x='330' y='254' font-size='12' text-anchor='middle' fill='var(--muted)'>Femoral head</text><text x='540' y='318' font-size='12' text-anchor='middle' fill='var(--muted)'>Femoral neck</text><text x='604' y='236' font-size='12' text-anchor='start' fill='var(--muted)'>Capsule</text><line x1='650' y1='296' x2='592' y2='260' stroke='var(--muted)' stroke-width='1'/><text x='712' y='312' font-size='12' text-anchor='end' fill='var(--muted)'>Anterior recess</text><text x='24' y='392' font-size='12' text-anchor='start' fill='var(--muted)'>Doppler first. Saline should lift the capsule off the neck.</text></g></svg><figcaption>Diagram 1 · Hip joint, long-axis view along the femoral neck</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Supine; stand on the affected side, machine opposite at eye level.</li>\n<li>Abdominal or MSK-deep preset, depth 6–8 cm, focus on the head–neck junction.</li>\n<li>Short axis of the shaft, up to the trochanter, rotate along the neck. Name the structures.</li>\n<li>Doppler over the path; tilt the probe cephalad if a vessel is in the way.</li>\n<li>Insert in-plane from the distal-lateral end of the probe, 2 cm away, at a shallow angle.</li>\n<li>Advance under vision through iliopsoas and the capsule until the tip touches bone at the head–neck junction.</li>\n<li>Inject 1–2 mL saline: the capsule should lift off the neck and fluid run toward the head. If not, rotate the bevel or withdraw 1–2 mm.</li>\n<li>State the drugs and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip on bone at the junction of femoral head and neck, inside the anterior synovial recess, under the capsule. Not on the labrum or the head cartilage.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Needle through the femoral vessels or nerve (approach too medial, no Doppler).</li>\n<li>Injecting outside the capsule into iliopsoas: spread stays superficial, capsule does not lift.</li>\n<li>Tip on the head cartilage or labrum.</li>\n<li>Steep path with the needle lost in a deep target.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Supine, operator on the affected side, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Curvilinear probe, depth and focus set for a deep target</label></li>\n<li><label><input type='checkbox' data-i='2'> Shaft → trochanter → femoral neck sequence shown</label></li>\n<li><label><input type='checkbox' data-i='3'> Head, neck, capsule, recess, acetabulum and iliopsoas named</label></li>\n<li><label><input type='checkbox' data-i='4'> Doppler for femoral vessels and lateral circumflex branch</label></li>\n<li><label><input type='checkbox' data-i='5'> In-plane from distal-lateral, entry 2 cm off the probe; tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Bone contact at the head–neck junction</label></li>\n<li><label><input type='checkbox' data-i='7'> Capsular lift on hydrolocation shown; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Where is the needle target for an ultrasound-guided hip injection? <details class='ans'><summary>Answer</summary>The anterior femoral head–neck junction, in the anterior recess under the capsule.</details></li>\n<li>Which vessel commonly crosses the anterior needle path? <details class='ans'><summary>Answer</summary>The ascending branch of the lateral circumflex femoral artery.</details></li>\n<li>How do you confirm intra-articular spread? <details class='ans'><summary>Answer</summary>Capsule lifts off the neck with saline hydrolocation or colour Doppler, spreading cephalad.</details></li>\n<li>Which nerves supply the anterior hip capsule? <details class='ans'><summary>Answer</summary>Femoral, obturator and accessory obturator nerves.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 22 (Stogicza, Hip).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 28.</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 5.</li>\n<li>Jacobson JA. <em>Fundamentals of Musculoskeletal Ultrasound</em>, 3rd ed. Elsevier 2017, hip chapter.</li>\n<li>Peng PWH. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part IV: hip. Reg Anesth Pain Med 2013;38:264–73.</li>\n<li>Balog TP et al. Accuracy of ultrasound-guided intra-articular hip injections performed in the orthopedic clinic. Orthopedics 2017;40:96–100.</li>\n</ul>", "checks": 8}, "P16": {"title": "P16 Long head of biceps tendon sheath injection", "html": "<p>Region: MSK soft tissue · Station time: 15 minutes · Partner viva case: 6.3 bicipital tendinopathy.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Sitting, elbow flexed 90°, forearm supinated, hand resting on the thigh</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 5–13 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>25 G 1.5 inch</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Short axis over the bicipital groove, then long axis to confirm</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Short axis, in-plane (lateral to medial or medial to lateral) or out-of-plane</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Inside the tendon sheath, beside (medial to) the tendon, deep to the transverse humeral ligament, never in the tendon</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Injectate forms a dark halo around the tendon</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>2–4 mL local anaesthetic with 20–40 mg methylprednisolone</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Long head of biceps tenosynovitis and tendinopathy cause anterior shoulder pain, worse with lifting and resisted elbow flexion or forearm supination. Pathology is rarely isolated: check the cuff and glenohumeral joint first, because joint effusion tracks down the sheath.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>The tendon arises from the supraglenoid tubercle, runs through the rotator interval and leaves the joint in the bicipital groove between the greater and lesser tuberosities.</li>\n<li>The transverse humeral ligament roofs the groove.</li>\n<li>The tendon sheath is an extension of the glenohumeral joint synovium, so joint fluid can appear in it.</li>\n<li>The ascending branch of the anterior circumflex humeral artery runs lateral to the tendon in the groove.</li>\n<li>Subscapularis inserts on the lesser tuberosity, medial to the groove; tendon dislocation is usually medial.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Short axis over the groove: the bright oval tendon between the greater (lateral) and lesser (medial) tuberosities, the transverse humeral ligament on top.</li>\n<li>Tilt the probe until the tendon is bright; a dark tendon is often anisotropy, not pathology.</li>\n<li>Look for sheath fluid, a thickened or split tendon, and subluxation (externally rotate the arm while watching).</li>\n<li>Long axis: fibrillar tendon running down the groove.</li>\n<li>Colour or power Doppler: the anterior circumflex humeral artery branch lateral to the tendon, and hyperaemia.</li>\n<li>Compare with the other side.</li>\n</ol>\n<p>Diagram 1 below shows the short-axis view with the needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 388' role='img' aria-label='Biceps tendon sheath injection: tip in the sheath beside the tendon' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Biceps sheath: tip beside the tendon, under the transverse ligament</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic short-axis view over the bicipital groove, sitting. Left = medial, right = lateral.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='130' y1='86' x2='630' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M140 98 L630 98 L630 156 Q400 162 140 158 Z' fill='var(--mus)' fill-opacity='0.12' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M150 236 Q220 176 290 210 Q360 256 430 210 Q500 160 620 226' fill='none' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M150 240 Q220 180 290 214 Q360 260 430 214 Q500 164 620 230 L620 310 L150 310 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><ellipse cx='360' cy='212' rx='40' ry='26' fill='none' stroke='var(--muted)' stroke-width='1' stroke-dasharray='3 3'/></g><g><ellipse cx='362' cy='214' rx='24' ry='16' fill='var(--muted)' fill-opacity='0.35' stroke='var(--muted)' stroke-width='1.5'/></g><g><path d='M296 184 Q360 176 426 184' fill='none' stroke='var(--muted)' stroke-width='3'/></g><g><circle cx='404' cy='214' r='6' fill='var(--bad)' fill-opacity='0.2' stroke='var(--bad)' stroke-width='1.5'/></g><g><line x1='100' y1='108' x2='326' y2='208' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='24' y='100' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='330.0,201.0 327.6,206.8 321.4,207.2 326.2,211.2 324.7,217.3 330.0,214.0 335.3,217.3 333.8,211.2 338.6,207.2 332.4,206.8' fill='var(--accent)' stroke='var(--accent)'/><text x='200' y='334' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: in the sheath, medial to the tendon</text></g><line x1='250' y1='322' x2='328' y2='222' stroke='var(--muted)' stroke-width='1'/><text x='470' y='132' font-size='12' text-anchor='middle' fill='var(--muted)'>Deltoid</text><line x1='380' y1='180' x2='430' y2='166' stroke='var(--muted)' stroke-width='1'/><text x='434' y='170' font-size='12' text-anchor='start' fill='var(--muted)'>Transverse humeral ligament</text><text x='362' y='300' font-size='12' text-anchor='middle' fill='var(--ink)'>Biceps tendon in the groove</text><line x1='410' y1='220' x2='470' y2='246' stroke='var(--muted)' stroke-width='1'/><text x='474' y='252' font-size='11.5' text-anchor='start' fill='var(--muted)'>Ant. circumflex humeral a. branch</text><text x='224' y='266' font-size='12' text-anchor='middle' fill='var(--muted)'>Lesser tuberosity</text><text x='540' y='290' font-size='12' text-anchor='middle' fill='var(--muted)'>Greater tuberosity</text></g></svg><figcaption>Diagram 1 · Biceps tendon, short-axis view over the bicipital groove</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Sitting, arm by the side, elbow 90°, palm up on the thigh. Machine opposite.</li>\n<li>MSK preset, depth 2–3 cm, focus at the groove.</li>\n<li>Short-axis view; name tuberosities, groove, ligament and tendon. Doppler for the artery.</li>\n<li>Insert in-plane, here from the medial end of the probe (away from the artery), 1–2 cm off the edge.</li>\n<li>Advance with the tip in view until it lies under the transverse humeral ligament, beside the tendon.</li>\n<li>Inject: a dark halo should surround the tendon. If the tendon swells or resistance is high, stop and pull back into the sheath.</li>\n<li>State the drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip inside the biceps tendon sheath, deep to the transverse humeral ligament, beside the tendon (medial side), not in the tendon.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Intratendinous injection (risk of rupture): tendon swells, resistance is high.</li>\n<li>Puncture of the anterior circumflex humeral artery branch (no Doppler, approach through it).</li>\n<li>Calling anisotropy a tear.</li>\n<li>Injecting superficial to the ligament.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Sitting, elbow 90°, palm up, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Linear probe, MSK preset, shallow depth</label></li>\n<li><label><input type='checkbox' data-i='2'> Greater and lesser tuberosities, groove, ligament and tendon named</label></li>\n<li><label><input type='checkbox' data-i='3'> Anisotropy corrected by tilting; long-axis view shown</label></li>\n<li><label><input type='checkbox' data-i='4'> Doppler for the anterior circumflex humeral artery</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip in the sheath beside the tendon, under the ligament</label></li>\n<li><label><input type='checkbox' data-i='7'> Halo around the tendon shown; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which artery lies next to the long head of biceps in the groove? <details class='ans'><summary>Answer</summary>The ascending branch of the anterior circumflex humeral artery (lateral to the tendon).</details></li>\n<li>Why can fluid in the biceps sheath reflect joint disease? <details class='ans'><summary>Answer</summary>The sheath is continuous with the glenohumeral synovium.</details></li>\n<li>How does guided compare with blind sheath injection? <details class='ans'><summary>Answer</summary>In an RCT all ultrasound-guided injections were accurate vs about two-thirds blind (Hashiuchi 2011).</details></li>\n<li>A dark tendon on short axis: tear or artefact? <details class='ans'><summary>Answer</summary>Tilt the probe first; anisotropy makes a normal tendon look dark.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 19 (McDonald &amp; Peng, Shoulder).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 2.</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 26.</li>\n<li>Jacobson JA. <em>Fundamentals of Musculoskeletal Ultrasound</em>, 3rd ed. Elsevier 2017, shoulder chapter.</li>\n<li>Hashiuchi T et al. Accuracy of the biceps tendon sheath injection: ultrasound-guided or unguided injection? A randomized controlled trial. J Shoulder Elbow Surg 2011;20:1069–73.</li>\n</ul>", "checks": 8}, "P17": {"title": "P17 Subacromial–subdeltoid bursa injection", "html": "<p>Region: MSK soft tissue · Station time: 15 minutes · Partner viva case: 6.2 subacromial impingement.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Sitting, modified Crass position (hand in the back pocket), or arm neutral</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 5–13 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>25 G 1.5 inch or 22 G 2 inch</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Long axis of supraspinatus, lateral to the acromion, onto the greater tuberosity</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane from the distal (lateral) end of the probe</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Subdeltoid part of the bursa: deep to the subdeltoid fat, superficial to the supraspinatus tendon</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>0.5 mL test dose spreads fast along the bursa as a thin dark line</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>About 4 mL local anaesthetic with steroid (e.g. methylprednisolone 40 mg)</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Subacromial pain syndrome (bursitis, cuff tendinopathy, impingement) is the commonest cause of shoulder pain. Injection gives short-term relief and allows rehabilitation. A diagnostic injection also helps separate bursal pain from AC or glenohumeral pain.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>The bursa lies between the deltoid and acromion above and the supraspinatus and infraspinatus tendons below.</li>\n<li>The subacromial and subdeltoid parts form one continuous space, usually not connected to the glenohumeral joint (a connection suggests a full-thickness cuff tear).</li>\n<li>The coracoacromial arch (acromion, coracoacromial ligament, coracoid) forms its roof.</li>\n<li>Normally it is a potential space under 2 mm thick, lined by bright peribursal fat.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Start with the biceps tendon in the rotator interval, then slide lateral and rotate to the long axis of supraspinatus.</li>\n<li>Show: deltoid, subdeltoid (peribursal) fat, the bursa (thin dark line), supraspinatus tendon (bright fibrillar beak inserting on the greater tuberosity), the dark cartilage over the humeral head.</li>\n<li>In bursitis: fluid in the bursa, thickened peribursal fat. Measure and compare with the other side.</li>\n<li>Dynamic test: abduct the arm while watching the bursa and tendon pass under the acromion; bunching of the bursa suggests impingement.</li>\n<li>Power Doppler for hyperaemia in the bursal wall.</li>\n</ol>\n<p>Diagram 1 below shows the long-axis view and needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 408' role='img' aria-label='Subacromial-subdeltoid bursa injection: tip inside the bursa' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>SASD bursa: tip between the subdeltoid fat and the supraspinatus tendon</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic long-axis view of supraspinatus, modified Crass position. Screen left = proximal, right = distal.</text><g transform='translate(0,28)'><g><rect x='160' y='50' width='400' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='360' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='160' y1='72' x2='560' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='120' y1='86' x2='640' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M120 120 L176 112 L176 330 L120 330 Z' fill='var(--line)' fill-opacity='0.6'/><path d='M120 120 L176 112' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/></g><g><path d='M180 94 L640 94 L640 160 Q420 150 180 150 Z' fill='var(--mus)' fill-opacity='0.14' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M180 156 Q420 158 640 166' fill='none' stroke='var(--muted)' stroke-width='3'/></g><g><path d='M180 166 Q420 168 640 176' fill='none' stroke='var(--ink)' stroke-width='3'/></g><g><path d='M180 174 Q420 176 600 196 L600 214 Q420 230 180 228 Z' fill='var(--muted)' fill-opacity='0.22' stroke='var(--muted)' stroke-width='1'/></g><g><path d='M180 238 Q360 236 520 254' fill='none' stroke='var(--line)' stroke-width='7'/></g><g><path d='M180 246 Q360 244 520 262 Q580 230 640 226' fill='none' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/><path d='M180 250 Q360 248 520 266 Q580 234 640 230 L640 330 L180 330 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><line x1='690' y1='104' x2='440' y2='168' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='470' y='118' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='436.0,159.0 433.6,164.8 427.4,165.2 432.2,169.2 430.7,175.3 436.0,172.0 441.3,175.3 439.8,169.2 444.6,165.2 438.4,164.8' fill='var(--accent)' stroke='var(--accent)'/><text x='196' y='142' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: inside the bursa</text></g><line x1='330' y1='146' x2='424' y2='166' stroke='var(--muted)' stroke-width='1'/><text x='148' y='350' font-size='12' text-anchor='middle' fill='var(--muted)'>Acromion</text><text x='196' y='118' font-size='12' text-anchor='start' fill='var(--muted)'>Deltoid</text><text x='300' y='210' font-size='12' text-anchor='middle' fill='var(--ink)'>Supraspinatus tendon</text><line x1='610' y1='228' x2='640' y2='256' stroke='var(--muted)' stroke-width='1'/><text x='640' y='270' font-size='12' text-anchor='end' fill='var(--muted)'>Greater tuberosity</text><text x='360' y='298' font-size='12' text-anchor='middle' fill='var(--muted)'>Humeral head with dark cartilage</text><text x='190' y='318' font-size='12' text-anchor='start' fill='var(--muted)'>Over the tendon: bright peribursal fat, then the dark bursa</text><text x='24' y='372' font-size='12' text-anchor='start' fill='var(--muted)'>Confirm with 0.5 mL: a thin dark line opens quickly along the bursa. A round bleb = deltoid.</text></g></svg><figcaption>Diagram 1 · SASD bursa, long-axis view of supraspinatus</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Sit the cadaver up with the arm in modified Crass (or neutral if stiff). Machine opposite.</li>\n<li>MSK preset; depth 2–3 cm; focus at the bursa.</li>\n<li>Long axis of supraspinatus over the greater tuberosity. Name deltoid, peribursal fat, bursa, tendon, greater tuberosity.</li>\n<li>Insert in-plane from the distal (lateral) end of the probe, shallow angle, 1–2 cm off the edge.</li>\n<li>Advance under vision through deltoid until the tip sits just under the peribursal fat, above the tendon.</li>\n<li>Inject 0.5 mL: the bursa should open quickly as a dark line spreading under the deltoid. A bleb in deltoid or swelling of the tendon means wrong position.</li>\n<li>State the drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip inside the subdeltoid part of the bursa: deep to the subdeltoid fat and deltoid fascia, superficial to the supraspinatus tendon, over the greater tuberosity.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Tip in deltoid: injectate forms a round bleb in muscle.</li>\n<li>Tip in the tendon: high resistance, tendon swelling. Stop and pull back.</li>\n<li>Not showing the dynamic or comparison scan when asked.</li>\n<li>Steep entry so the needle is invisible.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Sitting, modified Crass, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Linear probe, MSK preset, shallow depth</label></li>\n<li><label><input type='checkbox' data-i='2'> Long axis of supraspinatus found from the biceps landmark</label></li>\n<li><label><input type='checkbox' data-i='3'> Deltoid, peribursal fat, bursa, tendon and greater tuberosity named</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane from distal end, shallow angle</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip between subdeltoid fat and tendon</label></li>\n<li><label><input type='checkbox' data-i='7'> 0.5 mL test spread along the bursa shown; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>What does fluid passing from the joint into the bursa suggest? <details class='ans'><summary>Answer</summary>A full-thickness rotator cuff tear.</details></li>\n<li>Which arm position brings the supraspinatus out from under the acromion? <details class='ans'><summary>Answer</summary>Modified Crass: hand in the back pocket.</details></li>\n<li>How do you confirm the tip is in the bursa? <details class='ans'><summary>Answer</summary>A 0.5 mL test dose spreads rapidly along the bursa.</details></li>\n<li>Does landmark injection reliably reach the bursa? <details class='ans'><summary>Answer</summary>No: accuracy 29–100% in studies; guided injection near 100%.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 19 (Shoulder).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 2.</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 26.</li>\n<li>Jacobson JA. <em>Fundamentals of Musculoskeletal Ultrasound</em>, 3rd ed. Elsevier 2017, shoulder chapter.</li>\n<li>Koester MC et al. The efficacy of subacromial corticosteroid injection in the treatment of rotator cuff disease: a systematic review. J Am Acad Orthop Surg 2007;15:3–11.</li>\n<li>Peng PWH, Cheng P. Ultrasound-guided interventional procedures in pain medicine, Part III: shoulder. Reg Anesth Pain Med 2011;36:592–605.</li>\n</ul>", "checks": 8}, "P20": {"title": "P20 Greater trochanteric bursae (sub-gluteus maximus, medius, minimus)", "html": "<p>Region: MSK soft tissue · Station time: 15 minutes · Partner viva case: 12.2 greater trochanteric pain syndrome.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Lateral decubitus, affected side up, legs straight or slightly bent, pillow between the knees</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 5–12 MHz (curvilinear if large)</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G, 3.5–5 inch</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Short axis over the greater trochanter to find the facets, then long axis toward the ASIS</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane: posterior to anterior for gluteus medius and sub-gluteus maximus; anterior to posterior for gluteus minimus</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Sub-GMax: deep to the ITB/gluteus maximus, superficial to the gluteus medius tendon over the posterior/lateral facets. Sub-GMed: deep to the medius tendon on the lateral facet. Sub-GMin: deep to the minimus tendon on the anterior facet</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>1–3 mL local anaesthetic + 1 mL steroid per bursa</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Greater trochanteric pain syndrome (lateral hip pain, cannot lie on that side, pain rising from a chair) is mostly gluteus medius and minimus tendinopathy, with or without bursitis. Bursal steroid gives short-term relief; fenestration, PRP or prolotherapy target the tendon itself.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>The greater trochanter has four facets:<ul>\n<li><strong>Anterior facet:</strong> gluteus minimus.</li>\n<li><strong>Lateral facet:</strong> gluteus medius (main part).</li>\n<li><strong>Superoposterior facet:</strong> gluteus medius (posterior part).</li>\n<li><strong>Posterior facet:</strong> bare bone, covered by the sub-gluteus maximus (trochanteric) bursa.</li>\n</ul>\n</li>\n<li>The ridge (apex) between the anterior and lateral facets is the key landmark on the short-axis scan.</li>\n<li>The ITB and tensor fasciae latae cover the medius and minimus insertions; gluteus maximus inserts into the ITB and gluteal tuberosity, not the trochanter.</li>\n<li>Bursae: sub-gluteus maximus (largest, over the posterior and lateral facets), sub-gluteus medius (under the medius tendon at the lateral facet), sub-gluteus minimus (under the minimus tendon at the anterior facet).</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Short axis over the trochanter: the bright bony outline with the ridge between anterior and lateral facets.</li>\n<li>Name the gluteus minimus tendon on the anterior facet, gluteus medius on the lateral facet, and the ITB as a bright band on top.</li>\n<li>Slide posteriorly: the posterior facet and the overlying sub-gluteus maximus bursa region.</li>\n<li>Long axis (probe toward the ASIS): gluteus medius tendon inserting on the lateral facet, deep to the ITB.</li>\n<li>Look for tendinosis (thick, dark tendon), tears, calcification, cortical irregularity and bursal fluid. Compare with the other side; power Doppler for hyperaemia.</li>\n</ol>\n<p>Diagram 1 below shows the short-axis view with the three bursal targets.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 418' role='img' aria-label='Greater trochanteric bursae: sub-gluteus maximus, medius and minimus targets' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Trochanteric bursae: three targets around the facets</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic short-axis view over the greater trochanter. Left = anterior, right = posterior.</text><g transform='translate(0,28)'><g><rect x='150' y='50' width='460' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='150' y1='72' x2='610' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='130' y1='86' x2='630' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M140 104 L620 104' stroke='var(--muted)' stroke-width='4'/></g><g><path d='M460 108 L620 108 L620 150 Q540 146 470 128 Z' fill='var(--mus)' fill-opacity='0.16' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M160 240 L300 160 L470 196 Q560 220 600 290' fill='none' stroke='var(--muted)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/><path d='M160 244 L300 164 L470 200 Q560 224 600 294 L600 340 L160 340 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><path d='M170 220 L296 148 L300 134 L160 214 Z' fill='var(--muted)' fill-opacity='0.25' stroke='var(--muted)' stroke-width='1'/></g><g><path d='M304 146 L476 182 L470 160 L306 132 Z' fill='var(--muted)' fill-opacity='0.25' stroke='var(--muted)' stroke-width='1'/></g><g><line x1='690' y1='112' x2='508' y2='168' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='600' y='180' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='236.0,183.0 233.6,188.8 227.4,189.2 232.2,193.2 230.7,199.3 236.0,196.0 241.3,199.3 239.8,193.2 244.6,189.2 238.4,188.8' fill='var(--accent)' stroke='var(--accent)'/><text x='196' y='268' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--ink)'>Sub-GMin</text></g><g><polygon points='390.0,163.0 387.6,168.8 381.4,169.2 386.2,173.2 384.7,179.3 390.0,176.0 395.3,179.3 393.8,173.2 398.6,169.2 392.4,168.8' fill='var(--accent)' stroke='var(--accent)'/><text x='400' y='228' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--ink)'>Sub-GMed</text></g><g><polygon points='504.0,157.0 501.6,162.8 495.4,163.2 500.2,167.2 498.7,173.3 504.0,170.0 509.3,173.3 507.8,167.2 512.6,163.2 506.4,162.8' fill='var(--accent)' stroke='var(--accent)'/><text x='520' y='262' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--ink)'>Sub-GMax</text></g><line x1='196' y1='254' x2='232' y2='200' stroke='var(--muted)' stroke-width='1'/><line x1='398' y1='214' x2='390' y2='182' stroke='var(--muted)' stroke-width='1'/><line x1='518' y1='248' x2='506' y2='176' stroke='var(--muted)' stroke-width='1'/><text x='220' y='98' font-size='12' text-anchor='middle' fill='var(--muted)'>Iliotibial band</text><text x='530' y='124' font-size='12' text-anchor='middle' fill='var(--muted)'>Gluteus maximus</text><line x1='250' y1='168' x2='240' y2='140' stroke='var(--muted)' stroke-width='1'/><text x='236' y='136' font-size='12' text-anchor='end' fill='var(--muted)'>Gluteus minimus tendon</text><text x='390' y='124' font-size='12' text-anchor='middle' fill='var(--muted)'>Gluteus medius tendon</text><text x='300' y='196' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Ridge</text><text x='380' y='320' font-size='12' text-anchor='middle' fill='var(--muted)'>Anterior facet · lateral facet · posterior facet</text><text x='24' y='376' font-size='12' text-anchor='start' fill='var(--muted)'>Sub-GMax and sub-GMed from posterior (needle shown); sub-GMin from anterior, deep to the TFL.</text></g></svg><figcaption>Diagram 1 · Greater trochanter, short-axis view with the three bursal targets</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Lateral decubitus, affected side up. Stand behind the cadaver, machine in front.</li>\n<li>MSK preset, depth 4–6 cm, focus at the tendon insertions.</li>\n<li>Short axis over the trochanter: find the ridge, name the facets and tendons.</li>\n<li>Say which bursa you are targeting.</li>\n<li>Sub-gluteus maximus or medius: insert in-plane from the posterior end of the probe, 2 cm away. For sub-gluteus minimus: from the anterior end, deep to the TFL.</li>\n<li>Advance with the tip in view to the target plane (see below).</li>\n<li>Inject 0.5 mL: a thin dark line should spread along the bursal plane. A bleb in muscle or tendon swelling means reposition.</li>\n<li>State drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<ul>\n<li><strong>Sub-gluteus maximus:</strong> deep to the ITB/gluteus maximus fascia, superficial to the gluteus medius tendon, over the posterior and lateral facets.</li>\n<li><strong>Sub-gluteus medius:</strong> deep to the gluteus medius tendon, just above its lateral facet insertion.</li>\n<li><strong>Sub-gluteus minimus:</strong> deep to the gluteus minimus tendon at the anterior facet.</li>\n</ul>\n<h2>How marks are lost</h2>\n<ul>\n<li>Not naming the facets or tendons, or not saying which bursa is targeted.</li>\n<li>Intratendinous steroid (risk of tendon rupture).</li>\n<li>Spread staying in subcutaneous fat or in gluteus maximus muscle.</li>\n<li>Confusing the ITB with the medius tendon.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Lateral decubitus, pillow between the knees, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Linear probe, MSK preset, depth and focus set</label></li>\n<li><label><input type='checkbox' data-i='2'> Ridge, anterior, lateral and posterior facets named</label></li>\n<li><label><input type='checkbox' data-i='3'> Gluteus minimus, gluteus medius tendons and ITB named</label></li>\n<li><label><input type='checkbox' data-i='4'> Target bursa stated; approach direction correct for it</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip in the correct bursal plane, not in tendon</label></li>\n<li><label><input type='checkbox' data-i='7'> 0.5 mL test spread shown; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which tendon inserts on the anterior facet? <details class='ans'><summary>Answer</summary>Gluteus minimus.</details></li>\n<li>Which facet is bare and covered by the largest bursa? <details class='ans'><summary>Answer</summary>Posterior facet; sub-gluteus maximus bursa.</details></li>\n<li>Does image guidance improve the outcome of trochanteric bursa injection? <details class='ans'><summary>Answer</summary>Not shown: in the Cohen et al. RCT (BMJ 2009) fluoroscopic guidance gave no better outcome than blind injection, at higher cost. Guidance improves accuracy and lets you choose the right bursa or tendon.</details></li>\n<li>What is the commonest pathology in greater trochanteric pain syndrome? <details class='ans'><summary>Answer</summary>Gluteus medius (and minimus) tendinopathy, rather than isolated bursitis.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 22 (Stogicza, Hip).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 5.</li>\n<li>Jacobson JA. <em>Fundamentals of Musculoskeletal Ultrasound</em>, 3rd ed. Elsevier 2017, hip chapter.</li>\n<li>Peng PWH. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part IV: hip. Reg Anesth Pain Med 2013;38:264–73.</li>\n<li>Cohen SP et al. Comparison of fluoroscopically guided and blind corticosteroid injections for greater trochanteric pain syndrome: multicentre randomised controlled trial. BMJ 2009;338:b1088.</li>\n</ul>", "checks": 8}};
const PRACT_INTRO="<p>Part 2A is worth 60% of the CIPS mark. You perform 4 ultrasound-guided procedures on a fresh cadaver, one from each region, in 60 minutes (15 minutes each), watched by 2 examiners who score you separately.</p>\n<h2>On the day</h2>\n<ul>\n<li>You are told all four procedures at the start and get up to 5 minutes to plan. Decide probe, needle, position and target for each.</li>\n<li>The examiners choose the order so the cadaver is turned as little as possible.</li>\n<li>They do not prompt or give feedback. Talk through each step so they can credit it.</li>\n</ul>\n<h2>What the examiners look for</h2>\n<p>For each procedure both examiners answer yes or no to eight points, then give a global score.</p>\n<ol>\n<li>Uses the ultrasound machine appropriately (preset, depth, gain, focus).</li>\n<li>Chooses the proper equipment.</li>\n<li>Uses the probe correctly.</li>\n<li>Identifies the anatomical target(s).</li>\n<li>Uses ultrasound as a guide throughout.</li>\n<li>Acceptable skin entry point.</li>\n<li>Sees the needle tip before advancing.</li>\n<li>Correct final needle position.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Score</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>4</td>\n<td>Acceptable, exceeds basic competence</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Acceptable, basic competence</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Unacceptable, not harmful</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Unacceptable, potentially dangerous</td>\n</tr>\n</tbody>\n</table>\n<p>A dangerous move (advancing blind toward the lung, cord, vertebral artery or a nerve) scores 1 however good the rest was.</p>\n<h2>The 10-step routine</h2>\n<p>Say each step aloud.</p>\n<ol>\n<li><strong>Position</strong> the cadaver; machine on the opposite side, screen in line with the needle.</li>\n<li><strong>Machine:</strong> preset, depth with the target in the middle third, focus at target, gain.</li>\n<li><strong>Equipment:</strong> name the probe (linear for superficial, curvilinear for deep) and needle gauge and length; mention sterile cover and prep.</li>\n<li><strong>Orientation:</strong> check the probe marker against the screen.</li>\n<li><strong>Survey scan:</strong> count levels where needed; name the target and 2–3 neighbours.</li>\n<li><strong>Doppler</strong> over the planned path; name the vessel you are looking for.</li>\n<li><strong>Plan the path:</strong> in-plane or out-of-plane, direction, entry 1–2 cm off the probe.</li>\n<li><strong>Advance</strong> only when you see the tip; if lost, move the probe, not the needle.</li>\n<li><strong>End position:</strong> say where the tip is; inject a test volume and describe the spread.</li>\n<li><strong>Close:</strong> confirm in a second plane if useful, state drug and volume, remove the needle.</li>\n</ol>\n<h2>Needle visibility</h2>\n<ul>\n<li>Keep the needle as flat as possible: echoes fade when it is steeper than about 45° to the probe face.</li>\n<li>Heel the probe in toward the needle; use needle-enhancement or beam steering.</li>\n<li>A small saline puff (0.2–0.5 mL) shows the tip.</li>\n<li>Out-of-plane: walk down, sliding the probe forward each time the bright dot disappears.</li>\n</ul>";
let proc=null;
const pracBtn=document.querySelector('.modes button[data-mode="prac"]');
if(pracBtn)pracBtn.onclick=()=>{location.hash="practical"};
function pracSub(){document.getElementById("sub").innerHTML='Part 2A cadaver practical · 20 procedures · <span id="progress"></span>'}
function renderProcNav(){
  const ul=document.getElementById("topics");
  ul.innerHTML=`<li><button data-h="#practical" aria-current="${!proc}"><span class="n">2A</span><span>How Part 2A works</span><span></span></button></li>`+
    REGIONS.map((r,ri)=>`<li class="grp">${r}</li>`+PROCS.filter(p=>p[2]===ri).map(p=>{const ready=!!PRACT[p[0]];
      return `<li><button data-h="#proc-${p[0]}" aria-current="${p[0]===proc}"><span class="n">${p[0]}</span><span>${p[1]}</span><span class="pill ${ready?"ready":""}">${ready?"Ready":"Soon"}</span></button></li>`}).join("")).join("");
  ul.querySelectorAll("button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.h});
  document.getElementById("progress").textContent=Object.keys(PRACT).length+" of 20 chapters ready";
}
function pracState(id){return store.get("cips-prac-"+id,[])}
function bandSelf(n,t){return n===t?4:n>=t-2?3:n>=t/2?2:1}
function renderPracIntro(){
  const main=document.getElementById("main");
  main.innerHTML=`<div class="case-head"><span class="eyebrow">Part 2A · Cadaver practical</span><h2>How Part 2A works</h2></div>
  <div class="card chapter">${PRACT_INTRO}</div>
  <h3 style="margin:24px 0 10px">The 20 procedures</h3>
  <div class="procgrid">${REGIONS.map((r,ri)=>`<div class="card"><div class="eyebrow">${r}</div><ul>${PROCS.filter(p=>p[2]===ri).map(p=>`<li><a href="#proc-${p[0]}">${p[0]} ${p[1]}</a>${PRACT[p[0]]?"":" <span class='pill'>Soon</span>"}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="card" style="margin-top:16px"><h3 style="font-size:1.1rem;margin-bottom:6px">Mock station set</h3><p class="refs" style="margin:0 0 10px">Draw one ready procedure from each region, as on the day.</p><button class="btn primary" id="draw">Draw 4 procedures</button><div id="drawn" class="row" style="margin-top:10px"></div></div>`;
  document.getElementById("draw").onclick=()=>{
    const pick=REGIONS.map((_,ri)=>{const pool=PROCS.filter(p=>p[2]===ri&&PRACT[p[0]]);const all=pool.length?pool:PROCS.filter(p=>p[2]===ri);return all[Math.floor(Math.random()*all.length)]});
    document.getElementById("drawn").innerHTML=pick.map(p=>`<a class="btn" href="#proc-${p[0]}">${p[0]} ${p[1]}${PRACT[p[0]]?"":" (soon)"}</a>`).join("");
  };
}
function renderProc(){
  const main=document.getElementById("main"), info=PROCS.find(p=>p[0]===proc), c=PRACT[proc];
  clearInterval(timerId);
  const head=`<div class="case-head"><span class="eyebrow">Part 2A · ${REGIONS[info[2]]} · ${proc}</span><h2>${c?c.title.replace(/^P\d+\s/,""):info[1]}</h2></div>`;
  if(!c){main.innerHTML=head+`<div class="card soon"><p>This chapter is being written. It will follow the same layout: exam snapshot, anatomy, sonoanatomy, diagram, step-by-step procedure, final needle position, self-check and self-test.</p><div class="row">${Object.keys(PRACT).map(k=>`<a class="btn" href="#proc-${k}">Open ${k}</a>`).join("")}</div></div>`;return}
  main.innerHTML=head+`<div class="card station"><div class="row"><b>Station timer</b><span class="timer" id="stimer">15:00</span><button class="btn primary" id="sstart">Start 15 minutes</button><button class="btn" id="sreset">Reset</button><span class="refs" id="snote">Run it with a colleague scanning; tick the self-check as you go.</span></div></div>
  <div class="card chapter" id="chap">${c.html}</div>
  <div class="card selfband" style="margin-top:16px"><div class="row"><b>Self-check</b><span class="band" id="sb"></span><button class="btn" id="sclear" style="margin-left:auto">Clear ticks</button></div></div>`;
  const s=pracState(proc), boxes=[...document.querySelectorAll("#chap .selfcheck input")];
  const upd=()=>{const n=boxes.filter(b=>b.checked).length;const band=bandSelf(n,boxes.length);
    document.getElementById("sb").innerHTML=`${n} of ${boxes.length} ticked · estimated global score <span class="s${band}">${band}</span>`};
  boxes.forEach((b,i)=>{b.checked=!!s[i];b.onchange=()=>{const st=pracState(proc);st[i]=b.checked;store.set("cips-prac-"+proc,st);upd()}});upd();
  document.getElementById("sclear").onclick=()=>{store.set("cips-prac-"+proc,[]);boxes.forEach(b=>b.checked=false);upd()};

const FRONT={"intro": {"title": "Introduction to the CIPS examination", "html": "<p>The Certified Interventional Pain Sonologist (CIPS) examination tests whether you can use ultrasound safely and competently for pain procedures. It is run by the Board of Examination of the World Institute of Pain (WIP), in collaboration with the World Academy of Pain Medicine Ultrasonography (WAPMU). It has three parts, and you must pass on the combined result of all three.</p>\n<p>Facts in this chapter come from the WIP CIPS Information Bulletin (2019 edition). Fees, dates and format can change, so check the current Bulletin and the <a target=\"_blank\" rel=\"noopener\" href=\"https://worldinstituteofpain.org\">WIP website</a> before you apply.</p>\n<h2 id=\"f-the-exam-at-a-glance\">The exam at a glance</h2>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>Format</th>\n<th>Time</th>\n<th>Weight</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Part 1 Theoretical</td>\n<td>100 multiple-choice questions, 4 options each</td>\n<td>2 hours</td>\n<td>20%</td>\n</tr>\n<tr>\n<td>Part 2A Practical</td>\n<td>4 ultrasound-guided procedures on a fresh cadaver, 1 from each region, 2 examiners</td>\n<td>15 minutes each, 60 minutes in all</td>\n<td>60%</td>\n</tr>\n<tr>\n<td>Part 2B Oral</td>\n<td>1 extended clinical vignette, physical and ultrasound examination of a live model, up to 10 questions, 2 examiners</td>\n<td>up to 30 minutes, with up to 5 minutes to read the case</td>\n<td>20%</td>\n</tr>\n</tbody>\n</table>\n<p>The exam is held in English, except Part 2B. Examiners are drawn from a pool, and you will not be examined by someone who knows you well. Sittings are usually held alongside WIP meetings and workshops; the venues and dates are announced on the WIP website.</p>\n<h2 id=\"f-who-can-sit-the-exam\">Who can sit the exam</h2>\n<p>The Bulletin sets seven requirements. In short:</p>\n<ol>\n<li><strong>Licence:</strong> every medical licence you hold is valid, current and unrestricted.</li>\n<li><strong>Residency:</strong> a completed 4-year accredited residency (ACGME or equivalent) that included pain management.</li>\n<li><strong>Specialist certification:</strong> certification by an ABMS board, or by your national board as a specialist or family physician, with documented training equivalent in scope and length.</li>\n<li><strong>Ultrasound training:</strong> formal ultrasound-in-pain training during residency or fellowship, or 20 Category-1 CME credits (or equivalent) from approved courses, such as those of WAPMU, ASRA, ESRA, the Mayo Clinic MSK course, AAPM, AAPM&amp;R, ISURA, ISSPS and the Innsbruck ultrasound course.</li>\n<li><strong>Clinical practice:</strong> at least 12 months of pain practice after residency (a 12-month pain fellowship counts), with at least half your practice in pain medicine.</li>\n<li><strong>Professional standards:</strong> two letters of recommendation from practising physicians; at most one from a partner, none from relatives.</li>\n<li><strong>Declaration and consent</strong> in the online application.</li>\n</ol>\n<p>The 2019 fee is USD 2,500. It is refunded, less USD 250, only if you are found ineligible. Moving to a later sitting costs USD 100, and you must sit within 2 years or 4 sittings of applying. The credentials review takes about 4 weeks from the day your file is complete.</p>\n<h2 id=\"f-syllabus\">Syllabus</h2>\n<h3>Part 1 Theoretical: content outline</h3>\n<table>\n<thead>\n<tr>\n<th>Domain</th>\n<th>What it covers</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. General knowledge</td>\n<td>Ultrasound physics and principles; musculoskeletal and spine anatomy; the machine and its handling; patient safety (sterility, preparation, equipment); image documentation</td>\n</tr>\n<tr>\n<td>2. Chronic pain</td>\n<td>Chronic pain syndromes; treatment guidelines; history and examination; clinical reasoning, differential diagnosis and treatment plan; drug and interventional treatments; other treatments (rehabilitation, neurosurgery, neurology, psychology, physiotherapy); how a multidisciplinary pain service is organised</td>\n</tr>\n<tr>\n<td>3. Spine procedures</td>\n<td>Cervical medial branch block; cervical selective nerve root block; thoracic medial branch / facet joint block; lumbar medial branch / facet joint block; lumbar selective nerve root block; subarachnoid injection; caudal epidural; sacroiliac joint injection</td>\n</tr>\n<tr>\n<td>4. Peripheral and autonomic nerves</td>\n<td>Cervical sympathetic trunk; suprascapular; ilioinguinal / iliohypogastric; greater occipital; median at the wrist; ulnar at the cubital canal; intercostal; saphenous above the knee; tibial at the tarsal canal; pudendal</td>\n</tr>\n<tr>\n<td>5. Musculoskeletal</td>\n<td>AC joint; biceps (peri)tendon; glenohumeral joint (any approach); subdeltoid bursa; elbow joint; medial or lateral epicondylosis sheath injection / fenestration; first MCP joint; piriformis; hip joint; trochanteric bursae (sub-gluteus maximus, medius and minimus); knee joint; distal ITB peritendon; tibiotalar joint; subtalar joint; first MTP joint</td>\n</tr>\n</tbody>\n</table>\n<h3>Part 2A Practical: the procedure pool</h3>\n<p>You are given one procedure from each region.</p>\n<table>\n<thead>\n<tr>\n<th>Spine</th>\n<th>Peripheral nerves</th>\n<th>MSK joints</th>\n<th>MSK soft tissue</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cervical medial branch block</td>\n<td>Suprascapular nerve</td>\n<td>AC joint</td>\n<td>Biceps (peri)tendon</td>\n</tr>\n<tr>\n<td>Cervical selective nerve root block</td>\n<td>Ilioinguinal / iliohypogastric nerve</td>\n<td>Glenohumeral joint (any approach)</td>\n<td>Subdeltoid bursa</td>\n</tr>\n<tr>\n<td>Thoracic facet joint block</td>\n<td>Pudendal nerve</td>\n<td>Hip joint</td>\n<td>Medial or lateral epicondylosis sheath / fenestration</td>\n</tr>\n<tr>\n<td>Lumbar medial branch / facet joint block</td>\n<td>Ulnar nerve at the cubital canal</td>\n<td>Knee joint</td>\n<td>Piriformis</td>\n</tr>\n<tr>\n<td>Caudal epidural</td>\n<td>Lateral femoral cutaneous nerve</td>\n<td>Tibiotalar joint</td>\n<td>Trochanteric bursae (sub-gluteus maximus, medius, minimus)</td>\n</tr>\n</tbody>\n</table>\n<p>You have a fresh cadaver, the instruments you need and an ultrasound machine. The examiners have their own machine to check your needle.</p>\n<h3>Part 2B Oral: case topics</h3>\n<p>The vignette comes from one of 16 topics: peripheral nerve injury; headache; cervical radicular pain; cervical facet pain; occipital neuralgia; shoulder pain; thoracic pain; lumbosacral radicular pain; lumbar facet pain; sacroiliac joint pain; knee pain; hip pain; carpal tunnel syndrome; meralgia paresthetica; foot pain; musculoskeletal pain and disability.</p>\n<p>You read a short history, then give a diagnosis and the procedure you would do. The examiners ask up to 10 further questions on the patient's care, and you examine a live model clinically and with ultrasound.</p>\n<h2 id=\"f-marking-scheme\">Marking scheme</h2>\n<p>The final result is a weighted composite: Part 2A 60%, Part 2B 20%, Part 1 20%. It is criterion-referenced: the pass mark is set by the expected standard, not by how the other candidates on the day perform. Your chance of passing does not depend on whether your group is strong or weak.</p>\n<p>Part 1 is marked on correct answers. In Parts 2A and 2B each examiner scores you on a four-point scale:</p>\n<table>\n<thead>\n<tr>\n<th>Score</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>4</td>\n<td>Acceptable: exceeds basic competence</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Acceptable: basic competence</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Unacceptable: below basic competence, not harmful</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Unacceptable: below basic competence, potentially harmful</td>\n</tr>\n</tbody>\n</table>\n<p>In Part 2A each examiner scores every procedure. In Part 2B the score covers your diagnosis, the procedure you propose, your physical examination, your ultrasound examination and your answers. A score of 1 is kept for unsafe practice, so safety decides more marks than polish.</p>\n<h2 id=\"f-results-retakes-and-appeals\">Results, retakes and appeals</h2>\n<ul>\n<li>Results arrive by e-mail about 8 weeks after the exam, never by phone.</li>\n<li>If you pass, you get a letter and certificate and may use the title CIPS. No numeric score is given.</li>\n<li>If you fail, you get your score, the pass mark and a breakdown for each of the three parts.</li>\n<li>There is no limit on attempts. After 3 failures you need at least 1 more year of practice before reapplying, and each attempt needs a new application and fee.</li>\n<li>A failed candidate may ask for hand re-scoring in writing within 20 days of the score report, with a USD 50 fee. The hand-scored result is final.</li>\n<li>Answer sheets are destroyed 6 months after the exam. Certificates are time-limited and remain WIP property.</li>\n</ul>\n<h2 id=\"f-on-the-day\">On the day</h2>\n<ul>\n<li>Bring photo identification (passport or driving licence). There are no exceptions.</li>\n<li>Arrive about 45 minutes before the start. Late arrivals are not admitted.</li>\n<li>No phones, electronic devices, books, paper or notes in the exam room. No food, drink or gum.</li>\n<li>You may leave for the toilet, but the clock keeps running.</li>\n<li>Disturbance, or giving or receiving help, can end your exam or void your scores.</li>\n</ul>\n<h2 id=\"f-how-to-prepare\">How to prepare</h2>\n<p>The Bulletin advises three things: study the content outline, try the sample questions, and read from the reference list. This book adds exam-format practice for each part:</p>\n<ol>\n<li><strong>Part 2A first.</strong> It carries 60% of the marks. Learn the routine, then practise every procedure on a model until it is automatic.</li>\n<li><strong>Part 2B next.</strong> Pair each procedure with its viva case; the anatomy and scan overlap.</li>\n<li><strong>Part 1 throughout.</strong> Do the MCQ sets under time: 100 questions in 2 hours, about 70 seconds each.</li>\n<li><strong>Hands-on time.</strong> No book replaces scanning. Attend a cadaver workshop and a mock exam station if you can.</li>\n</ol>\n<h2 id=\"f-reference-list\">Reference list</h2>\n<h3>Recommended in the CIPS Bulletin</h3>\n<p>WIP lists these as study aids only. It does not endorse them, and exam questions are not taken from them. Where a newer edition exists, it is given in brackets.</p>\n<ol>\n<li>WAPMU lectures and video demonstrations. <a target=\"_blank\" rel=\"noopener\" href=\"https://www.wapmu.org\">wapmu.org</a></li>\n<li>Bianchi S, Martinoli C. <em>Ultrasound of the Musculoskeletal System</em>. Springer; 2007.</li>\n<li>Narouze SN, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>. Springer; 2010 (2nd ed. 2018).</li>\n<li>Bigeleisen PE, ed. <em>Ultrasound-Guided Regional Anesthesia and Pain Medicine</em>. Wolters Kluwer; 2010 (2nd ed. 2015).</li>\n<li>Jacobson JA. <em>Fundamentals of Musculoskeletal Ultrasound</em>. 2nd ed. Elsevier; 2012 (3rd ed. 2018).</li>\n<li>Spinner DA, Kirschner JS, Herrera JE, eds. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer; 2013.</li>\n<li>Agur AMR, Dalley AF. <em>Grant's Atlas of Anatomy</em>. 13th ed. Lippincott Williams &amp; Wilkins; 2012 (later editions available).</li>\n</ol>\n<h3>Further reading used in this book</h3>\n<ol>\n<li>Peng P, Finlayson R, Lee SH, Bhatia A, eds. <em>Ultrasound for Interventional Pain Management: An Illustrated Procedural Guide</em>. Springer; 2020.</li>\n<li>Peng PWH, et al. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy and procedures. Parts I–VI (non-axial structures; axial structures; shoulder; hip; knee; ankle and foot). <em>Reg Anesth Pain Med</em>. 2009–2016.</li>\n<li>Waldman SD. <em>Comprehensive Atlas of Ultrasound-Guided Pain Management Injection Techniques</em>. 2nd ed. Wolters Kluwer; 2019.</li>\n<li>Waldman SD. <em>Atlas of Interventional Pain Management</em>. 4th ed. Elsevier; 2015.</li>\n<li>Gruber H, Loizides A, Moriggl B. <em>Sonographic Peripheral Nerve Topography: A Landmark-based Algorithm</em>. Springer; 2019.</li>\n<li>Peer S, Gruber H, eds. <em>Atlas of Peripheral Nerve Ultrasound</em>. Springer; 2013.</li>\n<li>Karmakar MK, ed. <em>Atlas of Sonoanatomy for Regional Anesthesia and Pain Medicine</em>. McGraw-Hill; 2018.</li>\n<li>Silvestri E, Martino F, Puntillo F, eds. <em>Ultrasound-Guided Peripheral Nerve Blocks</em>. Springer; 2018.</li>\n<li>Jankovic D, Peng P, eds. <em>Regional Nerve Blocks in Anesthesia and Pain Therapy</em>. 4th ed. Springer; 2015.</li>\n<li>Stogicza AR, Mansano AM, Trescot AM, Staats PS, eds. <em>Interventional Pain: A Step-by-Step Guide for the FIPP Exam</em>. Springer; 2020.</li>\n<li>Daniels JM, Dexter WW, eds. <em>Basics of Musculoskeletal Ultrasound</em>. 2nd ed. Springer; 2021.</li>\n<li>World Institute of Pain. <em>CIPS Examination Information Bulletin</em>. 2019 edition. <a target=\"_blank\" rel=\"noopener\" href=\"https://worldinstituteofpain.org\">worldinstituteofpain.org</a></li>\n</ol>", "secs": [["f-the-exam-at-a-glance", "The exam at a glance"], ["f-who-can-sit-the-exam", "Who can sit the exam"], ["f-syllabus", "Syllabus"], ["f-marking-scheme", "Marking scheme"], ["f-results-retakes-and-appeals", "Results, retakes and appeals"], ["f-on-the-day", "On the day"], ["f-how-to-prepare", "How to prepare"], ["f-reference-list", "Reference list"]]}, "disc": {"title": "Disclaimer", "html": "<p>Please read this before using the book or the website. By using either, you accept these terms.</p>\n<h2 id=\"f-independent-not-official\">Independent, not official</h2>\n<ul>\n<li>This is an independent preparatory resource. It is <strong>not</strong> produced, endorsed, approved or sponsored by the World Institute of Pain (WIP), its Board of Examination, the World Academy of Pain Medicine Ultrasonography (WAPMU) or any other examining body.</li>\n<li>It is not a WIP-endorsed course or workshop, and using it gives no credit towards the CIPS eligibility requirements, including the ultrasound-training and CME requirements.</li>\n<li>\"CIPS\", \"Certified Interventional Pain Sonologist\", \"FIPP\", \"World Institute of Pain\" and \"WAPMU\" belong to their owners. They are used here only to describe the exam this resource helps you prepare for.</li>\n</ul>\n<h2 id=\"f-no-guarantee-of-passing\">No guarantee of passing</h2>\n<ul>\n<li>Using this book or website does <strong>not</strong> guarantee that you will pass any part of the CIPS examination, or any other exam.</li>\n<li>Your result depends on your own knowledge, clinical skill, hands-on ultrasound experience and performance on the day. Pass or fail is decided only by the WIP Board of Examination.</li>\n<li>No refund, compensation or other remedy is offered on the basis of an exam result.</li>\n</ul>\n<h2 id=\"f-not-real-exam-questions\">Not real exam questions</h2>\n<ul>\n<li>All multiple-choice questions, viva cases, model answers, checklists and mock stations here are <strong>original practice material</strong>, written to match the published format and syllabus.</li>\n<li>They are not past or live examination questions, and they do not come from any confidential exam material. They show the style of the exam, not its content.</li>\n<li>Self-scores, bands and \"estimated\" scores on the website are study aids only. They do not predict your real score.</li>\n</ul>\n<h2 id=\"f-a-preparation-aid-not-a-substitute-for-training\">A preparation aid, not a substitute for training</h2>\n<ul>\n<li>This resource supports your study. It does not replace formal training, supervised scanning, cadaver workshops or clinical experience.</li>\n<li>You still need to study the official syllabus and the recommended textbooks, and to practise the procedures hands-on under supervision.</li>\n<li>Always read the current official CIPS Information Bulletin and the WIP website. Eligibility, fees, dates, format and the marking scheme can change, and the official documents take priority over anything written here.</li>\n</ul>\n<h2 id=\"f-educational-content-only-not-clinical-advice\">Educational content only, not clinical advice</h2>\n<ul>\n<li>The content is for education and exam preparation by qualified physicians. It is not medical advice, and it is not a protocol for treating any patient.</li>\n<li>Clinical decisions remain the responsibility of the treating physician. Perform procedures only within your training, competence, credentials and local regulations, with appropriate consent and supervision.</li>\n<li>Check drug choices, doses, volumes and contraindications against current product information and local guidelines before you use them.</li>\n<li>Medicine changes. Techniques, evidence and guidelines described here may be superseded after writing.</li>\n</ul>\n<h2 id=\"f-accuracy-and-liability\">Accuracy and liability</h2>\n<ul>\n<li>Every effort has been made to make the content accurate and up to date, but errors and omissions are possible. It is provided \"as is\", without warranty of any kind.</li>\n<li>To the extent the law allows, the author and publisher accept no liability for any loss, injury, damage or exam outcome arising from the use or misuse of this material.</li>\n<li>If you find an error, please report it so it can be corrected in the next update.</li>\n</ul>\n<h2 id=\"f-sources-and-copyright\">Sources and copyright</h2>\n<ul>\n<li>The text is written in original wording. Techniques follow standard textbooks and published papers, which are cited in each chapter and in the reference list. Citing a source does not mean its author or publisher endorses this resource.</li>\n<li>Diagrams are original schematics, drawn for this resource. They are not copies of published figures, ultrasound images or cadaver photographs.</li>\n<li>This book and website are protected by copyright. They are licensed for the purchaser's personal study. Do not copy, share, resell or upload any part of them without written permission.</li>\n</ul>\n<h2 id=\"f-website-and-personal-data\">Website and personal data</h2>\n<ul>\n<li>Practice answers, ticks and scores on the website are saved only in your own browser, on your own device. They are not sent to anyone, and clearing your browser data deletes them.</li>\n<li>Links to outside websites are given for convenience. Their content is not controlled or endorsed by this resource.</li>\n</ul>", "secs": [["f-independent-not-official", "Independent, not official"], ["f-no-guarantee-of-passing", "No guarantee of passing"], ["f-not-real-exam-questions", "Not real exam questions"], ["f-a-preparation-aid-not-a-substitute-for-training", "A preparation aid, not a substitute for training"], ["f-educational-content-only-not-clinical-advice", "Educational content only, not clinical advice"], ["f-accuracy-and-liability", "Accuracy and liability"], ["f-sources-and-copyright", "Sources and copyright"], ["f-website-and-personal-data", "Website and personal data"]]}};
