<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIPS Exam Preparation Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: left rail switches between the 16 oral topics (viva) and the MCQ sets; main column runs a viva case as a 9-question stepper, or an MCQ part in practice or timed exam mode. */
:root{
  --ink:#16202e; --muted:#5b6778; --paper:#f4f6f9; --panel:#ffffff; --line:#d8dee7;
  --accent:#2350b8; --accent-soft:#e6ecf9; --good:#1f7a4d; --warn:#a15c00; --bad:#b3261e;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ebf2; --muted:#9aa6b6; --paper:#0f141b; --panel:#171e28; --line:#2a3443;
    --accent:#86a7f0; --accent-soft:#1d2a44; --good:#5cc28e; --warn:#e0a54a; --bad:#f08a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ebf2; --muted:#9aa6b6; --paper:#0f141b; --panel:#171e28; --line:#2a3443;
  --accent:#86a7f0; --accent-soft:#1d2a44; --good:#5cc28e; --warn:#e0a54a; --bad:#f08a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:650;text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:1.25rem;padding:0 8px}
aside .sub{color:var(--muted);font-size:.85rem;padding:2px 8px 14px}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.topics button{width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:6px;display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center;font-size:.92rem}
.topics button:hover{background:var(--accent-soft)}
.topics button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.topics .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.grp{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 8px 2px}
.topics button{grid-template-columns:34px 1fr auto}
.pill{font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ready{border-color:var(--good);color:var(--good)}
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:900px;width:100%}
.eyebrow{color:var(--accent);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.case-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.case-head h2{font-size:1.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.vignette{border-left:4px solid var(--accent);font-size:1.02rem;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:7px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;min-width:4.5ch}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 14px}
.steps button{width:40px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.steps button[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.steps button.done{border-color:var(--good)}
.q h3{font-size:1.3rem;margin-bottom:10px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
label.small{font-size:.85rem;color:var(--muted);display:block;margin:12px 0 6px}
.model{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.model h4{margin:14px 0 6px;font-size:.95rem}
.model ul,.model ol{margin:4px 0 10px;padding-left:22px}
.model li{margin:3px 0}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:.93rem}
.score{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.score button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:.85rem;text-align:left;max-width:200px}
.score button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.score b{display:block;font-size:1.05rem}
.check{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:6px}
.check label:hover{background:var(--accent-soft)}
.check input{margin-top:5px;accent-color:var(--accent)}
.band{font-weight:700;font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.summary div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-variant-numeric:tabular-nums}
.summary b{display:block;font-size:1.3rem}
.s1{color:var(--bad)}.s2{color:var(--warn)}.s3,.s4{color:var(--good)}
.refs{font-size:.88rem;color:var(--muted)}
.refs li{margin:4px 0}
.soon p{color:var(--muted);max-width:60ch}
.nav{display:flex;justify-content:space-between;margin-top:16px}
details summary{cursor:pointer;font-weight:600}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  aside{max-height:45vh}
}
.modes{display:flex;gap:2px;margin:10px 8px 4px;padding:3px;border:1px solid var(--line);border-radius:8px}
.modes button,.seg button{flex:1;border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;font-weight:600;font-size:.85rem}
.modes button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px}
.opts{display:grid;gap:8px;margin:6px 0 4px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:1rem;width:100%}
button.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-weight:700;color:var(--muted)}
.opt.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}.opt.right .L{color:var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}.opt.wrong .L{color:var(--bad)}
button.opt:disabled{cursor:default}
.steps button.done{border-color:var(--accent)}
.steps button.ok{border-color:var(--good);color:var(--good)}.steps button.no{border-color:var(--bad);color:var(--bad)}
.steps button.ok[aria-current="true"],.steps button.no[aria-current="true"]{color:var(--panel)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kw span{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--accent);background:var(--panel)}
.xhead{font-weight:700;font-size:.9rem;margin:10px 0 4px}
.xwrong{margin:0 0 8px;padding-left:18px}.xwrong li{margin:3px 0;font-size:.93rem}
.xwrong li.mine{color:var(--bad)}
.dsum{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/*PCSS-START*/
:root{--mus:#b0413e;--nrv:#b07d00}
:root[data-theme="dark"]{--mus:#e8837f;--nrv:#e3b341}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mus:#e8837f;--nrv:#e3b341}}
.modes{flex-wrap:wrap}
.parts{display:flex;flex-direction:column;gap:4px;padding:4px 0 10px}
.parts a{display:block;padding:7px 10px;border-radius:7px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.parts a:hover{border-color:var(--accent)}
.parts a[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chapter{max-width:none}
.chapter h2{font-size:1.3rem;margin:26px 0 8px}
.chapter h2:first-child{margin-top:4px}
.chapter h3{font-size:1.05rem;margin:18px 0 6px}
.chapter p{max-width:72ch}
.chapter ul,.chapter ol{padding-left:22px;max-width:72ch}
.chapter li{margin:4px 0}
.chapter table{border-collapse:collapse;width:100%;margin:8px 0 4px;font-size:.93rem}
.chapter th,.chapter td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.chapter th{background:var(--accent-soft)}
.chapter td:first-child{font-weight:600;white-space:nowrap}
.chapter .selfcheck{padding-left:0}
.chapter .refs{padding-left:22px}
.dia{margin:14px 0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
.dia svg{width:100%;height:auto;display:block;font-family:var(--body)}
.dia figcaption{font-size:.85rem;color:var(--muted);margin-top:6px}
details.ans{display:inline-block;margin-left:6px}
details.ans summary{font-weight:500;color:var(--accent);font-size:.88rem}
details.ans[open]{display:block;margin:4px 0 0;font-style:italic}
.station{position:sticky;top:0;z-index:2;margin-bottom:16px}
.timer.s2{color:var(--warn)}.timer.s1{color:var(--bad)}
.procgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.procgrid ul{list-style:none;padding:0;margin:8px 0 0}
.procgrid li{margin:5px 0}
.procgrid a,.chapter a{color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
/*PCSS-END*/

.modes button b{display:block;font-weight:700}
.modes button span{display:block;font-size:.78rem;font-weight:500;opacity:.85}
/*FCSS-START*/
.modes{display:grid!important;grid-template-columns:repeat(3,1fr)}
.modes button.wide{grid-column:1/-1;text-align:left;padding:6px 10px}
.modes button.wide span{font-size:.74rem}
.front h2{scroll-margin-top:16px}
.front td:first-child{white-space:normal}
.legal{font-size:.75rem;color:var(--muted);padding:14px 8px 0;margin:0;line-height:1.4}
.legal a{color:var(--accent)}
/*FCSS-END*/
/*DCSS-START*/
/* Light medical-blue palette (overrides the base theme) */
:root{
  --ink:#1c2d3f; --muted:#5d7085; --paper:#f2f7fc; --panel:#ffffff; --line:#d5e3ef;
  --accent:#2a78bf; --accent-soft:#e4f0fa; --good:#178a6b; --warn:#b06d12; --bad:#c0392f;
  --tint:#f7fbfe; --bar:#e9f1f8;
  --ok-fill:#e8b14a; --good-fill:#3fae8c; --bad-fill:#e07a6f; --acc-fill:#5aa0dc;
}
:root[data-theme="dark"]{
  --ink:#e4edf6; --muted:#9db0c3; --paper:#0f1822; --panel:#16212d; --line:#2a3a4c;
  --accent:#7fb6ea; --accent-soft:#1b2d42; --good:#5cc7a3; --warn:#e3ab55; --bad:#f08c82;
  --tint:#132030; --bar:#203042;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e4edf6; --muted:#9db0c3; --paper:#0f1822; --panel:#16212d; --line:#2a3a4c;
  --accent:#7fb6ea; --accent-soft:#1b2d42; --good:#5cc7a3; --warn:#e3ab55; --bad:#f08c82;
  --tint:#132030; --bar:#203042;
}}
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--paper) 260px) no-repeat,var(--paper)}
aside{background:var(--tint)}
aside h1{color:var(--accent)}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(42,120,191,.06)}
.modes{grid-template-columns:repeat(6,1fr)!important;background:var(--panel)}
.modes button{grid-column:span 2}
.modes button.wide{grid-column:1/-1}
.modes button.half{grid-column:span 3;text-align:left;padding:6px 10px}
.modes button.half span{font-size:.72rem}
/* Dashboard */
.dsec{margin-top:16px;scroll-margin-top:16px}
.dh{font-size:1.1rem;margin:0 0 10px}
.dh4{font-size:.92rem;margin:16px 0 6px;font-family:var(--body);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--acc-fill)}
.tile .tl{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile b{font-size:1.8rem;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1.2}
.tile .ts{font-size:.8rem;color:var(--muted)}
b.good,.bv.good{color:var(--good)} b.ok{color:var(--warn)} b.weak{color:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;grid-template-areas:"l t v" "l s s";column-gap:12px;align-items:center;padding:6px 4px;border-radius:6px;color:var(--ink);text-decoration:none}
a.brow:hover{background:var(--accent-soft)}
.bl{grid-area:l;font-size:.9rem;font-weight:600}
.bt{grid-area:t;position:relative;height:12px;background:var(--bar);border-radius:99px;overflow:visible}
.bf{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc-fill)}
.bf.good{background:var(--good-fill)}.bf.ok{background:var(--ok-fill)}.bf.weak{background:var(--bad-fill)}
.pass{position:absolute;left:75%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55;border-radius:1px}
.bv{grid-area:v;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.bs{grid-area:s;font-size:.78rem;color:var(--muted)}
.focus{margin:0;padding-left:22px}
.focus li{margin:6px 0}
.focus a{color:var(--ink);text-decoration:none}
.focus a:hover{color:var(--accent);text-decoration:underline}
.ptag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;margin-right:8px;background:var(--accent-soft);color:var(--accent)}
.ptag.p2A{background:#e3f4ee;color:#137258}
.ptag.p2B{background:#efeafb;color:#5a45a8}
.minis{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:.8rem;color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}
.mini b{color:var(--ink);font-size:.85rem}
.mini.good{border-color:var(--good-fill)}.mini.ok{border-color:var(--ok-fill)}.mini.weak{border-color:var(--bad-fill)}
.ptable{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
.pcell{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--line);font-size:.8rem;color:var(--muted);text-decoration:none;background:var(--panel)}
.pcell b{color:var(--ink);font-size:.88rem}
a.pcell:hover{border-color:var(--accent)}
.pcell.good{border-left-color:var(--good-fill)}.pcell.ok{border-left-color:var(--ok-fill)}.pcell.weak{border-left-color:var(--bad-fill)}
.missed{margin:0;padding-left:20px;font-size:.88rem}
.missed li{margin:3px 0}
.missed a{color:var(--accent);font-weight:600;text-decoration:none;margin-right:4px}
.big{font-size:1.4rem;font-family:var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.hc{border-radius:3px;background:var(--bar)}
.hc.l1{background:#c6def3}.hc.l2{background:#8fbde6}.hc.l3{background:#5a9ad5}.hc.l4{background:#2a78bf}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
@media (max-width:560px){.brow{grid-template-columns:1fr 44px;grid-template-areas:"l v" "t t" "s s";row-gap:4px}}
.dbox{width:100%;min-height:70px;margin-top:10px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--tint)}
.acct{display:flex;align-items:center;gap:7px;margin:6px 8px 2px;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:.78rem;color:var(--muted);width:fit-content;max-width:100%}
.acct .dot{width:8px;height:8px;border-radius:50%;background:#a9b8c6;flex:none}
.acct.on{color:var(--good);border-color:#bfe3d6}.acct.on .dot{background:var(--good)}
.acct.warn .dot{background:var(--warn)}
/*DCSS-END*/
</style>
<script src="viva-cases.js"></script>
</head>

</div>

"6.2":{
 title:"Shoulder pain: subacromial impingement",
 vignette:"A 48-year-old right-handed male house painter presents with a 5-month history of right shoulder pain. There was no injury; the pain began gradually during a long contract painting ceilings. The pain is felt over the outer side of the upper arm and is worst when he lifts the arm out to the side or reaches overhead. He cannot sleep on the right side and is woken when he rolls onto it. He can still raise the arm fully, but the middle part of the movement is painful. He has type 2 diabetes, reasonably controlled, and occasional neck ache after work. Naproxen helped a little; six weeks of physiotherapy gave partial relief, but the pain returns whenever he goes back to overhead work. There is no numbness or tingling in the hand.",
 clues:"<b>Clues:</b> overhead job, insidious onset, pain at the deltoid insertion, painful arc, night pain lying on the side, full range. <b>Distractors:</b> diabetes (frozen shoulder, but range is full), neck ache (C5 radiculopathy, but no arm symptoms).",

 answers:[
`<p><b>Most likely:</b> subacromial impingement with SASD bursitis, with or without supraspinatus tendinopathy or a partial bursal-side tear.</p>
<h4>Differential diagnosis</h4><ul><li>Full-thickness rotator cuff tear</li><li>Calcific tendinitis</li><li>Adhesive capsulitis (diabetes; early stage)</li><li>AC joint OA with inferior osteophytes</li><li>Long head of biceps tendinopathy or SLAP lesion</li><li>Glenohumeral OA</li><li>C5 radiculopathy; suprascapular neuropathy</li><li>Referred pain: cardiac, diaphragmatic, apical lung tumour (red flags)</li></ul>`,
`<p><b>Positioning:</b> standing, then sitting, both shoulders exposed, scapulae seen from behind.</p>
<p><b>Inspection:</b> supraspinatus and infraspinatus wasting, scapular dyskinesis, deltoid bulk, AC prominence.</p>
<h4>Neurological exam with tools</h4><ul><li>Reflex hammer: biceps C5, brachioradialis C6, triceps C7</li><li>Neurotip over C5 dermatome and regimental badge area (axillary nerve); light touch</li><li>MRC power of deltoid and cuff</li><li>Cervical ROM and Spurling</li></ul>
<h4>Musculoskeletal exam</h4><ul><li>Active and passive ROM; preserved passive external rotation argues against frozen shoulder (say "capsular pattern")</li><li>Painful arc 60°–120°</li><li>Neer, Hawkins–Kennedy</li><li>Jobe empty can and full can; resisted ER and ER lag; lift-off, belly press, bear hug; drop arm</li><li>Speed, Yergason, cross-body adduction, O'Brien</li><li>Neer impingement test with local anaesthetic</li></ul>`,
`<ul><li><b>X-ray</b> (AP, axillary, outlet): acromion type, spur, calcification, AC OA, acromiohumeral distance (below ~7 mm suggests a large tear)</li><li><b>Ultrasound:</b> first-line for the cuff, as accurate as MRI for full-thickness tears; bursa thicker than ~2 mm or with fluid supports bursitis</li><li><b>MRI:</b> if surgery is considered, labral lesion suspected, or US inconclusive</li><li><b>HbA1c</b> before steroid</li><li><b>Diagnostic injection:</b> relief of arc and impingement signs after subacromial local anaesthetic</li></ul>`,
`<h4>Set-up</h4><ul><li>Machine opposite, screen in line of sight; patient and operator details entered</li><li>Clean transducer, gloves</li><li>Linear 6–15 MHz, shoulder preset, depth 3–4 cm</li><li>Patient on a stool without back support</li></ul>
<h4>Systematic overview</h4><ol><li>Long head of biceps in the groove, short and long axis; Doppler for anterior circumflex humeral artery branch</li><li>Subscapularis with passive ER (dynamic)</li><li>Supraspinatus in modified Crass position, long and short axis to the footprint</li><li>Infraspinatus, teres minor, posterior GH recess</li><li>AC joint</li></ol>
<p><b>Focus and measure:</b> SASD bursa thickness, compared with the left.<br><b>Doppler:</b> bursal or tendon hyperaemia.<br><b>Dynamic:</b> coronal probe at the lateral acromion during abduction; bursal bunching or tendon catching.</p>
<p><b>Name:</b> deltoid, subdeltoid fat, SASD bursa, supraspinatus, greater tuberosity, acromion, coracoacromial ligament, LHB, subscapularis, humeral cartilage.</p>`,
`<ul><li>Relative rest, avoid sustained overhead work, platforms and extension rollers</li><li>Paracetamol, short-course oral NSAIDs (renal caution in diabetes), topical NSAIDs</li><li><b>Physiotherapy:</b> scapular stabilisation, posture, progressive cuff strengthening; long-term results similar to decompression</li><li>Weaker evidence: ice, TENS, taping, therapeutic ultrasound</li></ul><div class="tip">Say the injection opens a window for rehab; it does not replace it.</div>`,
`<p><b>US-guided SASD bursa injection of corticosteroid and local anaesthetic.</b></p><ul><li>Landmark accuracy ~29–100%; US-guided ~100%; better short-term pain and function than landmark (Naredo 2004; Aly 2015)</li><li>Later: suprascapular nerve block or pulsed RF, barbotage if calcific, PRP, surgical referral for full-thickness tear or failure</li></ul>`,
`<ol><li>Consent; allergies, anticoagulation, glucose</li><li>Seated, arm neutral or modified Crass; machine opposite</li><li>Chlorhexidine, sterile cover and gel</li><li>Linear probe, coronal oblique over lateral acromion, supraspinatus in long axis</li><li><b>25G 38 mm</b> (22G 50 mm in a large shoulder), in plane from lateral, ~1 cm from probe edge</li><li>Target: bursal space between subdeltoid fat and supraspinatus, lateral to acromion; avoid the tendon</li><li>0.5 mL test: bursa opens as a thin anechoic line; resistance or intratendinous collection means withdraw</li><li><b>Injectate:</b> triamcinolone or methylprednisolone 40 mg + 3–4 mL 1% lidocaine or 0.25% bupivacaine</li><li>Re-test arc, Neer, Hawkins after 5–10 min</li></ol>`,
`<ul><li><b>Common:</b> flare 24–48 h, raised glucose (monitor 2–3 days), facial flushing</li><li><b>Local:</b> fat atrophy, depigmentation, intratendinous injection and rupture</li><li><b>Rare:</b> septic bursitis, haematoma, vasovagal, allergy, LA toxicity</li><li><b>Long term:</b> repeated steroid linked with tendon degeneration and worse cuff repair outcomes</li></ul>`,
`<ul><li><b>Immediately:</b> rest and movement pain, arc, impingement tests (≥50% relief supports subacromial source); no neuro change</li><li>Home glucose monitoring 48–72 h</li><li><b>4–6 weeks:</b> NRS, ROM, cuff strength, sleep, SPADI or Constant–Murley, return to work</li><li>Restart progressive rehab within days</li><li><b>Escalate:</b> re-image if no response; max ~3 steroid injections/year, 6–12 weeks apart; surgical referral if indicated</li></ul>`

"13.1":{
 title:"Carpal tunnel syndrome",
 vignette:"A 52-year-old right-handed female hairdresser presents with a 6-month history of numbness and tingling in the right hand, mainly the thumb, index and middle fingers. Symptoms are worse at night and regularly wake her; she gets relief by shaking her hand. Over the last two months she has started dropping scissors and has difficulty with buttons. She also describes an aching pain spreading up the forearm towards the elbow, and occasional neck stiffness at the end of a working day. Her past history includes hypothyroidism, and her BMI is 32. Her family physician gave her a night wrist splint, which helped partially, and a course of ibuprofen, which did not help. The little finger feels normal.",
 clues:"<b>Clues:</b> lateral three digits, little finger spared, nocturnal waking, flick sign, new weakness, repetitive grip, hypothyroidism, obesity, partial response to splint. <b>Distractors:</b> forearm ache radiating proximally, neck stiffness.",
 pe:PE_STD,
 answers:[
`<p><b>Most likely:</b> right carpal tunnel syndrome with motor involvement. Risk factors: female, age 50s, hypothyroidism, BMI 32, repetitive forceful grip and wrist flexion.</p>
<h4>Differential diagnosis</h4><ul>
<li>C6 or C7 cervical radiculopathy</li><li>Double crush (cervical root plus median nerve at the wrist)</li><li>Pronator teres syndrome</li><li>Anterior interosseous nerve syndrome (pure motor)</li><li>Neurogenic thoracic outlet syndrome</li><li>Polyneuropathy (hypothyroid or diabetic)</li><li>Space-occupying lesion in the tunnel: ganglion, flexor tenosynovitis, lipoma, fibrolipomatous hamartoma</li><li>Hand mimics: 1st CMC osteoarthritis, de Quervain tenosynovitis, trigger thumb</li></ul>
<div class="tip">Say that forearm aching proximal to the wrist is common in CTS and does not exclude it.</div>`,
`<p><b>Positioning:</b> seated facing you, both arms exposed to the elbow, forearms supported. Examine both sides and start with the neck.</p>
<p><b>Inspection:</b> thenar wasting, skin and nail changes, scars, wrist swelling.</p>
<h4>Neurological exam, naming each tool</h4><ul>
<li>Light touch and pinprick (Neurotip): radial 3½ digits vs little finger, and thenar palm (spared palm points to the wrist)</li>
<li>Two-point discriminator: abnormal above 6 mm</li><li>Semmes–Weinstein monofilament: above 2.83 abnormal</li><li>Tuning fork, 128 or 256 Hz</li>
<li>Reflex hammer: biceps C5, brachioradialis C6, triceps C7</li>
<li>Power (MRC): APB and opponens; FDI and ADM as ulnar control; FPL and FDP index (AIN, "OK" sign)</li></ul>
<h4>Musculoskeletal exam</h4><ul>
<li>Cervical spine: active ROM, Spurling test</li><li>Wrist and hand: active and passive ROM, grip strength, girth and wasting vs other side</li>
<li>CTS tests: Tinel, Phalen (60 s), reverse Phalen, Durkan carpal compression (30 s, most sensitive), hand elevation test</li>
<li>Mimics: pronator teres pressure and Tinel, Finkelstein, CMC grind, Roos or Adson</li></ul>
<div class="tip">Marks come from positioning, tools and named special tests. Say each tool aloud.</div>`,
`<p>The diagnosis is clinical, but motor symptoms mean you confirm and grade severity before intervening.</p><ul>
<li><b>NCS and EMG (gold standard):</b> prolonged median distal sensory latency, reduced SNAP, distal motor latency above about 4.2 ms, comparison studies (ring finger, palmar). EMG of APB for denervation. Grade severity (e.g. Padua). Also screens for radiculopathy and polyneuropathy.</li>
<li><b>Ultrasound:</b> inlet CSA above about 10–12 mm² abnormal; ΔCSA ≥2 mm² forearm to inlet ≈99% accuracy (Klauser 2009); Δ6 mm² moderate, Δ9 mm² severe; wrist-to-forearm ratio above 1.4. Shows causes: tenosynovitis, ganglion, bifid nerve, persistent median artery.</li>
<li><b>Bloods:</b> TSH and free T4, glucose or HbA1c; ESR, CRP, RF if indicated.</li>
<li><b>Baseline:</b> Boston Carpal Tunnel Questionnaire.</li>
<li><b>Other imaging:</b> X-ray only for bony pathology; cervical MRI only with radicular signs; wrist MRI not routine.</li></ul>`,
`<h4>Set-up</h4><ul><li>Machine opposite, screen in line of sight; patient and operator details entered</li><li>Clean transducer, gloves on</li><li>Linear 12–18 MHz, hockey-stick ideal; MSK preset, depth 2–2.5 cm, focus at the nerve</li><li>Seated, elbow flexed, forearm supinated, wrist slightly extended over a towel</li></ul>
<h4>Overview, then focus</h4><ol><li>Short axis at pronator quadratus: find the median nerve, measure CSA</li><li>Tunnel inlet (scaphoid–pisiform): trace CSA inside the epineurium</li><li>Outlet (trapezium–hamate hook): flattening, retinaculum bowing</li><li>Long axis: notch sign</li></ol>
<p><b>Measure:</b> CSA at forearm and inlet, difference and ratio; repeat on the left.<br><b>Doppler:</b> ulnar and radial arteries, persistent median artery, intraneural hypervascularity.<br><b>Dynamic:</b> finger flexion and extension; reduced transverse nerve sliding; tilt the probe to show tendon anisotropy.</p>
<p><b>Name:</b> median nerve, flexor retinaculum, FCR, palmaris longus, FPL, FDS and FDP, scaphoid, pisiform, trapezium, hook of hamate, ulnar artery and nerve, radial artery, palmar cutaneous branch.</p>`,
`<ul><li><b>Night splint</b> in neutral, at least 6 weeks (partial benefit, so continue)</li>
<li><b>Ergonomics:</b> less sustained flexion and forceful scissor grip, ergonomic scissors, micro-breaks</li>
<li><b>Risk factors:</b> optimise thyroid replacement, weight loss</li>
<li><b>Short oral steroid</b> (e.g. prednisolone 20 mg × 2 weeks, then 10 mg × 2 weeks): short-term benefit</li>
<li><b>Therapy:</b> nerve and tendon gliding exercises, hand therapist</li>
<li><b>Not supported:</b> NSAIDs, diuretics, vitamin B6; weak evidence for therapeutic US, laser, TENS</li></ul>
<div class="tip">Motor symptoms make conservative care time-limited. Thenar wasting or EMG denervation means surgical referral.</div>`,
`<p><b>US-guided carpal tunnel corticosteroid injection, in-plane ulnar approach, with perineural hydrodissection.</b></p><ul>
<li>More accurate than landmark injection (Üstün 2013); ulnar approach spares the palmar cutaneous branch (Smith 2008)</li>
<li>Later: 5% dextrose hydrodissection (Wu 2017), PRP; surgical release (open, endoscopic or US-guided percutaneous) for severe disease, failure or relapse</li></ul>`,
`<ol><li>Consent; check allergies, anticoagulation, glucose</li>
<li>Seated, forearm supinated, wrist slightly extended; machine opposite</li>
<li>Chlorhexidine prep, sterile probe cover and gel</li>
<li>Linear probe short axis at the inlet (pisiform); identify median nerve, ulnar artery and nerve with Doppler, persistent median artery</li>
<li>Skin wheal on the ulnar side</li>
<li><b>25G or 27G, 38 mm needle</b>, in plane, ulnar to radial, 1–2 cm from probe, shallow angle; pass radial to the ulnar artery and nerve, under the retinaculum, to the space between nerve and FDS tendons</li>
<li>Tip in view at all times; small test volume spreads around, not into, the nerve</li>
<li>Hydrodissect above and below the nerve for a fluid "halo"</li>
<li><b>Injectate:</b> 1–2 mL 1% lidocaine or 0.25% bupivacaine + methylprednisolone 40 mg or triamcinolone 20–40 mg; total 2–4 mL</li>
<li>Stop for sharp paraesthesia, high resistance or nerve swelling</li>
<li>Alternative: out-of-plane at the inlet; gel stand-off for a small wrist</li>
<li>Finger flexion and extension afterwards; no driving while numb</li></ol>`,
`<ul><li><b>Nerve:</b> intraneural injection, median nerve injury; palmar cutaneous branch (radial approach) or ulnar nerve (ulnar approach); transient numbness and weakness</li>
<li><b>Vascular:</b> ulnar or persistent median artery puncture, haematoma</li>
<li><b>Tendon:</b> injury or later rupture</li><li><b>Infection:</b> septic tenosynovitis (rare)</li>
<li><b>Steroid:</b> flare, skin atrophy and depigmentation, raised glucose, flushing, menstrual change</li>
<li><b>Other:</b> vasovagal, allergy, recurrence (many relapse within 1 year)</li></ul>`,
`<ul><li><b>Immediately:</b> median and ulnar sensation and power, no new severe paraesthesia, haemostasis; no driving while numb</li>
<li><b>4–6 weeks:</b> night symptoms, paraesthesia and pain scores; Boston questionnaire; two-point and monofilament; APB power and thenar bulk; grip</li>
<li><b>Ultrasound:</b> CSA may fall within about 1 week of steroid</li>
<li><b>Escalate</b> to surgery for no response, early relapse, progressive weakness, wasting or denervation; limit repeats (about 3, at least 3 months apart)</li>
<li>Continue splint, ergonomics and thyroid control</li></ul>`
 ],
 refs:[
  "Narouze SN, ed. Atlas of Ultrasound-Guided Procedures in Interventional Pain Management, 2nd ed. 2018. Ch. 27 (Bodor, Lesher, Colio), pp. 267–269.",
  "Peng P, et al., eds. Ultrasound for Interventional Pain Management. 2020. Ch. 21 (Spinner, Mazzola), pp. 247–252.",
  "Spinner DA, Kirschner JS, Herrera JE, eds. Atlas of Ultrasound Guided Musculoskeletal Injections. 2014. Ch. 4 (Spinner, Rosado), pp. 29–31.",
  "Jacobson JA. Fundamentals of Musculoskeletal Ultrasound, 3rd ed. 2017. Ch. 5, pp. 203–206.",
  "Klauser AS, et al. Radiology 2009;250:171–177.",
  "Hobson-Webb LD, et al. Clin Neurophysiol 2008;119:1353–1357.",
  "Smith J, et al. J Ultrasound Med 2008;27:1485–1490.",
  "Üstün N, et al. Am J Phys Med Rehabil 2013;92:999–1004.",
  "Marshall S, et al. Cochrane Database Syst Rev 2007;CD001554.",
  "Wu YT, et al. Mayo Clin Proc 2017;92:1179–1189.",
  "AAOS. Management of Carpal Tunnel Syndrome: Evidence-Based Clinical Practice Guideline. 2016."
 ]
