</li>\n<li>In front of the pillar lie the transverse process with its anterior and posterior tubercles, the exiting nerve root and, deeper, the vertebral artery.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<h3>Coronal (long-axis) scan: count the levels</h3>\n<ol>\n<li>Place the probe coronally just behind the mastoid, along the back edge of the pillars.</li>\n<li>Find the drop-off: the inferior articular process of C2 slopes away, with the vertebral artery just above it on Doppler. The first joint below is C2–C3.</li>\n<li>Count down. Joints appear as peaks (bright joint lines); pillars as valleys between them.</li>\n</ol>\n<h3>Lower-neck check (transverse scan)</h3>\n<ol>\n<li>Start over T1: its transverse process is wide and square; tilt down to see the pleura.</li>\n<li>Slide up: the C7 transverse process sits more anterior and has no anterior tubercle. The C7 root and vertebral artery lie in front of it.</li>\n<li>Slide up again: C6 has the large anterior tubercle (Chassaignac). Its pillar is the next target up.</li>\n</ol>\n<h3>Transverse (short-axis) scan: the working view</h3>\n<ul>\n<li>The pillar centroid is a flat, bright line. Joints look rounder and less bright as you move the probe up and down.</li>\n<li>Name aloud: semispinalis capitis over the pillar, posterior tubercle, nerve root, anterior tubercle.</li>\n<li>Turn the probe slightly so it lies parallel to the joint lines; this sharpens the pillar.</li>\n</ul>\n<p>Diagram 1 below shows the working view and the needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 428' role='img' aria-label='Cervical medial branch block: tip on the centroid of the articular pillar' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Cervical MBB: tip on the centroid of the articular pillar</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic transverse view, lateral decubitus. Screen left = posterior, right = anterior.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><g><line x1='150' y1='86' x2='610' y2='86' stroke='var(--line)' stroke-width='1'/></g><g><path d='M170 150 Q300 132 420 168 L420 198 Q300 175 200 200 Z' fill='var(--mus)' fill-opacity='0.14' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M215 238 L395 232' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/><rect x='215' y='240' width='180' height='70' fill='var(--line)' fill-opacity='0.5'/></g><g><path d='M410 236 Q432 222 452 244' fill='none' stroke='var(--muted)' stroke-width='4' stroke-linecap='round'/></g><g><ellipse cx='495' cy='250' rx='22' ry='14' fill='var(--nrv)' fill-opacity='0.25' stroke='var(--nrv)' stroke-width='1.5'/></g><g><path d='M532 246 Q556 222 580 238' fill='none' stroke='var(--muted)' stroke-width='4' stroke-linecap='round'/></g><g><circle cx='470' cy='318' r='14' fill='var(--bad)' fill-opacity='0.18' stroke='var(--bad)' stroke-width='1.5'/></g><g><line x1='120' y1='112' x2='300' y2='226' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='40' y='104' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='305.0,219.0 302.6,224.8 296.4,225.2 301.2,229.2 299.7,235.3 305.0,232.0 310.3,235.3 308.8,229.2 313.6,225.2 307.4,224.8' fill='var(--accent)' stroke='var(--accent)'/><text x='230' y='268' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: pillar centroid</text></g><text x='300' y='128' font-size='12' text-anchor='middle' fill='var(--muted)'>Semispinalis capitis</text><text x='300' y='330' font-size='12' text-anchor='middle' fill='var(--muted)'>Articular pillar (flat bright line)</text><line x1='452' y1='214' x2='440' y2='230' stroke='var(--muted)' stroke-width='1'/><text x='456' y='208' font-size='12' text-anchor='start' fill='var(--muted)'>Posterior tubercle</text><line x1='510' y1='264' x2='530' y2='284' stroke='var(--muted)' stroke-width='1'/><text x='534' y='292' font-size='12' text-anchor='start' fill='var(--muted)'>Nerve root</text><line x1='585' y1='230' x2='600' y2='212' stroke='var(--muted)' stroke-width='1'/><text x='604' y='206' font-size='12' text-anchor='start' fill='var(--muted)'>Anterior tubercle</text><line x1='486' y1='326' x2='520' y2='346' stroke='var(--muted)' stroke-width='1'/><text x='524' y='352' font-size='12' text-anchor='start' fill='var(--muted)'>Vertebral artery (deep)</text><text x='24' y='380' font-size='12' text-anchor='start' fill='var(--muted)'>Rotate to coronal to confirm: tip mid-pillar (valley), between two joints (peaks).</text></g></svg><figcaption>Diagram 1 · Cervical MBB, transverse working view</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Position the cadaver on its side; stand behind the neck; screen opposite you in line with the needle.</li>\n<li>Select the small-parts or nerve preset. Depth about 3–4 cm. Focus at the pillar.</li>\n<li>Count the level in the coronal view and say it aloud.</li>\n<li>Rotate to transverse at the target pillar. Reduce probe pressure and run colour Doppler along the path (deep cervical and radicular branches).</li>\n<li>Insert in-plane from the posterior end of the probe, 1–2 cm away, aiming at the pillar centroid.</li>\n<li>Advance only while you see the tip until it touches periosteum.</li>\n<li>Rotate to coronal: the tip must sit in the middle of the pillar, not over a joint.</li>\n<li>Return to transverse and inject a small volume. Spread should run under semispinalis capitis across the pillar from front to back.</li>\n<li>For TON: tip on the lateral surface of the C2–C3 joint; the nerve can often be seen crossing it in the coronal view.</li>\n<li>For C7: half the volume on the C7 superior articular process, half about 3 mm lateral.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip on bone at the centroid of the articular pillar, posterior to the transverse process and nerve root, under semispinalis capitis. Confirmed mid-pillar in the coronal view.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Wrong level because the drop-off or C7 was not identified.</li>\n<li>Tip too anterior: near the nerve root or vertebral artery. This is the dangerous error.</li>\n<li>Out-of-plane needle you cannot follow.</li>\n<li>Tip on a joint line instead of the pillar waist (fine for TON, wrong for C3–C6).</li>\n<li>No second plane confirmation.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Lateral position, machine ergonomic, linear probe, preset and depth set</label></li>\n<li><label><input type='checkbox' data-i='1'> Level counted aloud from C2 drop-off or from T1/C7</label></li>\n<li><label><input type='checkbox' data-i='2'> Pillar, semispinalis capitis, tubercles and nerve root named</label></li>\n<li><label><input type='checkbox' data-i='3'> Doppler along the path</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane, posterolateral entry 1–2 cm from probe</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip on bone at the pillar centroid, confirmed in coronal view</label></li>\n<li><label><input type='checkbox' data-i='7'> Volume and spread under semispinalis stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which nerve alone supplies the C2–C3 facet joint? <details class='ans'><summary>Answer</summary>Third occipital nerve.</details></li>\n<li>How do you tell C7 from C6 on a transverse scan? <details class='ans'><summary>Answer</summary>C7 transverse process has no anterior tubercle; C6 has the large anterior (Chassaignac) tubercle.</details></li>\n<li>In the coronal view, are pillars peaks or valleys? <details class='ans'><summary>Answer</summary>Valleys; the joints are the peaks.</details></li>\n<li>What is the diagnostic volume per level for C3–C6? <details class='ans'><summary>Answer</summary>0.3 mL.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 13 (Etheridge &amp; Finlayson).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer 2018, ch 6.</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 10.</li>\n<li>Finlayson RJ et al. Cervical medial branch block: a novel technique using ultrasound guidance. Reg Anesth Pain Med 2012;37:219–23.</li>\n<li>Finlayson RJ et al. A randomized comparison between ultrasound- and fluoroscopy-guided third occipital nerve block. Reg Anesth Pain Med 2013;38:212–7.</li>\n<li>Finlayson RJ et al. A prospective validation of bi-planar ultrasound imaging for C5–C6 medial branch blocks. Reg Anesth Pain Med 2014;39:160–3.</li>\n</ul>", "checks": 8}, "P04": {"title": "P04 Lumbar medial branch block and facet joint injection", "html": "<p>Region: Spine · Station time: 15 minutes · Partner viva case: 9.1 lumbar facet pain.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Prone, pillow under the abdomen to flatten the lordosis</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Curvilinear 2–6 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G, 8–10 cm (3.5 inch) echogenic or spinal needle</td>\n</tr>\n<tr>\n<td>Level check</td>\n<td>Paramedian sagittal: count up from the sacrum (or transverse from the median sacral crest) and mark the skin</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Transverse view at the transverse process, in-plane, lateral to medial</td>\n</tr>\n<tr>\n<td>Final tip (L1–L4 medial branch)</td>\n<td>On bone in the groove where the superior articular process (SAP) meets the cranial edge of the transverse process (TP)</td>\n</tr>\n<tr>\n<td>Final tip (L5 dorsal ramus)</td>\n<td>Groove between the sacral ala and the S1 SAP</td>\n</tr>\n<tr>\n<td>Final tip (facet joint)</td>\n<td>Posterior joint gap between inferior and superior articular processes</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Rotate to paramedian sagittal: tip on the cranial edge of the TP</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>0.5–1 mL local anaesthetic per medial branch; up to 1 mL in a joint</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the block is done</h2>\n<p>Lumbar facet joints cause a large share of chronic axial low back pain. No clinical sign or scan proves the diagnosis; it rests on pain relief after medial branch blocks, which also select patients for radiofrequency denervation. Intra-articular injection is an alternative diagnostic and therapeutic option.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Each lumbar facet joint is supplied by two medial branches: the one at its own level and the one above (L4–L5 joint = L3 and L4 medial branches).</li>\n<li>The L1–L4 medial branches cross the junction of the SAP and the upper border of the TP of the vertebra below, then run under the mamillo-accessory ligament.</li>\n<li>At L5 the dorsal ramus itself runs in the groove between the sacral ala and the S1 SAP, so the L5 dorsal ramus is blocked instead of a medial branch.</li>\n<li>Deep and lateral to the TPs lie psoas, then the peritoneum. Between TPs, a bright intertransverse ligament and psoas fascia can be mistaken for bone.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<h3>The five basic views</h3>\n<ol>\n<li><strong>Paramedian sagittal transverse process view</strong> (3–5 cm from midline): TPs as short bright lines with shadows (\"trident\"), psoas seen through the gaps.</li>\n<li><strong>Paramedian sagittal articular process view</strong> (1–2 cm more medial): a continuous wavy bright line of articular processes (\"camel humps\" or saw-tooth), no gaps.</li>\n<li><strong>Paramedian sagittal oblique view</strong> (tilt medially): laminae with the interlaminar window, posterior dura, intrathecal space, anterior complex.</li>\n<li><strong>Transverse spinous process view</strong>: spinous process with a deep shadow; nothing deeper is seen.</li>\n<li><strong>Transverse interlaminar view</strong>: the working orientation for the facet joint, showing SAP, IAP, joint gap, TP laterally and the intrathecal space through the window.</li>\n</ol>\n<h3>Counting the level</h3>\n<ol>\n<li>Paramedian sagittal at the sacrum: a flat continuous line. The first step up is the L5 lamina (or articular process).</li>\n<li>Count TPs upward in the TP view and mark each on the skin.</li>\n<li>Beware a gap in the sacrum that can look like L5–S1; check the plain film for lumbarisation or sacralisation first.</li>\n</ol>\n<p>Diagram 1 below shows the transverse working view for a medial branch block.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 428' role='img' aria-label='Lumbar medial branch block: tip at the junction of SAP and transverse process' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Lumbar MBB: tip in the groove where the SAP meets the transverse process</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic transverse view at the TP level, prone. Screen left = midline, right = lateral.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='150' y1='86' x2='610' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M210 100 L600 100 L600 196 Q440 200 330 172 Q270 200 210 186 Z' fill='var(--mus)' fill-opacity='0.12' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M196 112 L206 112 L206 330 L196 330 Z' fill='var(--line)' fill-opacity='0.6'/><path d='M201 112 L201 120' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/></g><g><path d='M206 200 L290 214 Q312 176 334 206' fill='none' stroke='var(--muted)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></g><g><path d='M336 210 L566 222' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/><path d='M336 214 L566 226 L566 250 L336 250 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><ellipse cx='480' cy='322' rx='80' ry='30' fill='var(--mus)' fill-opacity='0.2' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M210 352 Q280 320 350 352' fill='none' stroke='var(--muted)' stroke-width='4' stroke-linecap='round'/></g><g><line x1='660' y1='112' x2='344' y2='204' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='470' y='96' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='340.0,198.0 337.6,203.8 331.4,204.2 336.2,208.2 334.7,214.3 340.0,211.0 345.3,214.3 343.8,208.2 348.6,204.2 342.4,203.8' fill='var(--accent)' stroke='var(--accent)'/><text x='440' y='274' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: SAP–TP groove</text></g><line x1='436' y1='268' x2='348' y2='212' stroke='var(--muted)' stroke-width='1'/><text x='188' y='300' font-size='12' text-anchor='end' fill='var(--muted)'>Spinous process</text><text x='410' y='128' font-size='12' text-anchor='middle' fill='var(--muted)'>Erector spinae</text><line x1='300' y1='180' x2='270' y2='160' stroke='var(--muted)' stroke-width='1'/><text x='266' y='156' font-size='12' text-anchor='end' fill='var(--muted)'>SAP</text><text x='246' y='232' font-size='12' text-anchor='middle' fill='var(--muted)'>Lamina</text><text x='500' y='244' font-size='12' text-anchor='middle' fill='var(--muted)'>Transverse process</text><text x='480' y='326' font-size='12' text-anchor='middle' fill='var(--muted)'>Psoas</text><text x='280' y='374' font-size='12' text-anchor='middle' fill='var(--muted)'>Vertebral body (deep)</text><text x='24' y='396' font-size='12' text-anchor='start' fill='var(--muted)'>Confirm in the sagittal view: tip on the cranial edge of the TP.</text></g></svg><figcaption>Diagram 1 · Lumbar MBB, transverse view at the transverse process</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Prone with a pillow under the abdomen. Machine on the opposite side, screen in line with the needle.</li>\n<li>Abdominal or spine preset, depth 6–8 cm, focus at the TP.</li>\n<li>Count and mark the level in the paramedian sagittal views; say the level aloud.</li>\n<li>Rotate to transverse at the TP of the target vertebra: show spinous process, lamina, SAP, TP and psoas.</li>\n<li>To prove you have the cranial edge of the TP, slide slightly cephalad until the TP shadow disappears and psoas appears, then come back.</li>\n<li>Insert in-plane from the lateral end of the probe, 2 cm away, aiming at the SAP–TP groove.</li>\n<li>Advance with the tip in view until it touches bone in the groove. If you never feel bone, the needle and beam are not aligned.</li>\n<li>Rotate the probe 90° to the paramedian sagittal TP view: the tip should sit on the cranial edge of the TP.</li>\n<li>For L5: out-of-plane oblique approach to the groove between sacral ala and S1 SAP; confirm in the sagittal view that the tip is on the cranial edge of the ala.</li>\n<li>For the facet joint: transverse interlaminar view, in-plane lateral to medial into the posterior joint gap; inject 0.2–0.5 mL and watch for the joint to distend.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Medial branch L1–L4: tip on bone at the junction of the SAP and the cranial edge of the TP, confirmed on the sagittal view. L5: groove between sacral ala and S1 SAP. Facet joint: posterior joint gap.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Wrong level (no counting, or a sacral gap mistaken for L5–S1).</li>\n<li>Taking the intertransverse ligament for the TP: the needle passes into the foramen.</li>\n<li>Tip too deep or too lateral, past the TP toward psoas, nerve root or peritoneum.</li>\n<li>No sagittal confirmation.</li>\n<li>Advancing a needle you cannot see on a steep path.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Prone with pillow, machine ergonomic, curvilinear probe, depth and focus set</label></li>\n<li><label><input type='checkbox' data-i='1'> Paramedian sagittal views shown; level counted aloud from the sacrum</label></li>\n<li><label><input type='checkbox' data-i='2'> SAP, TP, lamina, spinous process and psoas named in the transverse view</label></li>\n<li><label><input type='checkbox' data-i='3'> Cranial edge of the TP proved by sliding cephalad</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane lateral to medial, entry 2 cm from probe</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Bony contact in the SAP–TP groove; confirmed in the sagittal view</label></li>\n<li><label><input type='checkbox' data-i='7'> Volume stated (0.5–1 mL per level)</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which medial branches supply the L4–L5 facet joint? <details class='ans'><summary>Answer</summary>L3 and L4.</details></li>\n<li>After placing the needle for a lumbar medial branch block, what is the next step? <details class='ans'><summary>Answer</summary>Turn to a long-axis view to confirm the tip on the transverse process.</details></li>\n<li>What is the target for the L5 level? <details class='ans'><summary>Answer</summary>The L5 dorsal ramus, in the groove between the sacral ala and the S1 superior articular process.</details></li>\n<li>Technical success of ultrasound-guided lumbar facet joint injection in the cadaver study? <details class='ans'><summary>Answer</summary>88% (96% if invisible joints are excluded).</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 14 (Greher &amp; Peng).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer 2018, ch 10 (Irwin &amp; Gofeld).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 10.</li>\n<li>Greher M et al. Ultrasound-guided lumbar facet nerve block: a sonoanatomic study of a new methodologic approach. Anesthesiology 2004;100:1242–8.</li>\n<li>Gofeld M et al. Ultrasound-guided injection of lumbar zygapophyseal joints: an anatomic study with fluoroscopy validation. Reg Anesth Pain Med 2012;37:228–31.</li>\n<li>Greher M et al. Sonographic visualization and ultrasound-guided blockade of the lumbar zygapophyseal nerves: a fluoroscopy-controlled study. Anesthesiology 2004;101:1195–200.</li>\n</ul>", "checks": 8}, "P05": {"title": "P05 Caudal epidural injection", "html": "<p>Region: Spine · Station time: 15 minutes · Partner viva case: 8.1 lumbosacral radicular pain.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Prone, pillow under the pelvis, legs internally rotated (heels out) to open the buttocks</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear (curvilinear only if obese)</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G 3.5 inch spinal needle (17 G Tuohy if a catheter is planned)</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Transverse at the hiatus (two cornua, \"frog eyes\"), then rotate 90° to the long axis of the sacral canal</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Long-axis view, in-plane, caudal to cephalad at a shallow angle (out-of-plane in the transverse view also described)</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Just through the sacrococcygeal ligament, inside the sacral canal; do not advance further</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Colour Doppler during injection shows flow going up the canal; no swelling under the skin</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>10–20 mL dilute local anaesthetic with 40 mg methylprednisolone</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Caudal epidural steroid treats lumbosacral radicular pain from disc herniation or radiculitis that has not settled with conservative care. It is useful when the lumbar route is difficult, for example after spinal surgery. Blind caudal placement fails in up to a quarter of attempts; ultrasound-guided placement is close to 100% accurate.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>The sacral hiatus is a defect where the S4 and S5 laminae fail to fuse. The sacral cornua border it on each side.</li>\n<li>The superficial (posterior) sacrococcygeal ligament covers the hiatus.</li>\n<li>The canal contains the lower sacral and coccygeal roots, the filum terminale, fat and the epidural venous plexus.</li>\n<li>The dural sac ends at about S2 in adults, but in 1–5% it reaches S3 or below.</li>\n<li>Variants are common (up to 10%), including a very narrow hiatus (AP depth under 1.6 mm) or an absent posterior wall.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Palpate the cornua at the top of the natal cleft.</li>\n<li>Transverse view: two bright humps (the cornua, \"frog eyes\"), the bright band of the sacrococcygeal ligament between them, and the bright dorsal surface of the sacrum (the floor of the canal) deeper. The dark gap between ligament and floor is the canal.</li>\n<li>Rotate 90°: long-axis view. Show the ligament sloping down into the canal, the dorsal surface of the sacrum above it, and the triangular entrance.</li>\n<li>Note the AP depth of the hiatus; a very narrow entrance predicts difficulty.</li>\n</ol>\n<p>Diagram 1 below shows the long-axis view with the needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 388' role='img' aria-label='Caudal epidural: tip just through the sacrococcygeal ligament' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Caudal: tip just through the sacrococcygeal ligament</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic long-axis view at the sacral hiatus, prone. Left = caudal, right = cephalad.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='120' y1='86' x2='640' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M140 252 L222 250' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M140 256 L222 254 L222 300 L140 300 Z' fill='var(--line)' fill-opacity='0.6'/></g><g><path d='M380 150 L620 138' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M380 154 L620 142 L620 226 L380 236 Z' fill='var(--line)' fill-opacity='0.55'/></g><g><path d='M232 236 L380 152' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/></g><g><path d='M232 262 L620 246' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M232 266 L620 250 L620 300 L232 300 Z' fill='var(--line)' fill-opacity='0.6'/></g><g><line x1='110' y1='112' x2='330' y2='198' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='36' y='104' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='334.0,191.0 331.6,196.8 325.4,197.2 330.2,201.2 328.7,207.3 334.0,204.0 339.3,207.3 337.8,201.2 342.6,197.2 336.4,196.8' fill='var(--accent)' stroke='var(--accent)'/><text x='300' y='330' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--ink)'>Target: just inside the canal</text></g><line x1='316' y1='318' x2='332' y2='212' stroke='var(--muted)' stroke-width='1'/><line x1='240' y1='192' x2='296' y2='202' stroke='var(--muted)' stroke-width='1'/><text x='236' y='196' font-size='12' text-anchor='end' fill='var(--muted)'>Sacrococcygeal ligament</text><text x='500' y='128' font-size='12' text-anchor='middle' fill='var(--muted)'>Dorsal wall of sacrum</text><text x='500' y='200' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Shadow hides the needle here</text><text x='270' y='250' font-size='11.5' text-anchor='middle' fill='var(--ink)'>Sacral canal</text><text x='520' y='282' font-size='12' text-anchor='middle' fill='var(--muted)'>Floor of the canal</text><text x='180' y='286' font-size='12' text-anchor='middle' fill='var(--muted)'>Coccyx</text><text x='24' y='352' font-size='12' text-anchor='start' fill='var(--muted)'>Stop once through the ligament. Doppler during injection: flow runs up the canal.</text></g></svg><figcaption>Diagram 1 · Caudal, long-axis view at the sacral hiatus</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Prone with a pillow under the pelvis and heels out. Machine at the head end on the opposite side.</li>\n<li>Small-parts preset, depth 2–3 cm, focus at the ligament.</li>\n<li>Transverse view: name the cornua, ligament and sacral floor. Then rotate to the long axis.</li>\n<li>Insert in-plane from the caudal end of the probe, at a shallow angle, aiming through the ligament.</li>\n<li>Feel the give as the ligament is crossed. Inside the canal the needle disappears into the shadow of the dorsal sacral wall.</li>\n<li>Stop just past the ligament: advancing further risks dural puncture and vessel entry.</li>\n<li>Aspirate, then inject while watching with colour Doppler in the transverse view: flow should go cephalad inside the canal, not under the skin.</li>\n<li>State the drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip just through the sacrococcygeal ligament, inside the sacral canal at the hiatus, lying along the long axis of the canal.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Needle superficial to the ligament: injectate swells the subcutaneous tissue.</li>\n<li>Needle advanced deep into the canal: dural puncture or intravascular injection.</li>\n<li>Steep entry into bone (intraosseous injection) instead of a shallow path through the ligament.</li>\n<li>Not confirming flow in the canal (Doppler) or not naming the cornua and ligament.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Prone, pillow under pelvis, heels out, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> Linear probe, shallow depth, focus at the ligament</label></li>\n<li><label><input type='checkbox' data-i='2'> Transverse view: cornua, ligament and sacral floor named</label></li>\n<li><label><input type='checkbox' data-i='3'> Long-axis view obtained before needling</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane caudal to cephalad, shallow angle</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance up to the ligament</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip just through the ligament; not advanced further</label></li>\n<li><label><input type='checkbox' data-i='7'> Doppler flow up the canal described; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>What forms the sacral hiatus? <details class='ans'><summary>Answer</summary>Failure of fusion of the S4 and S5 laminae, bordered by the sacral cornua.</details></li>\n<li>Where does the dural sac usually end in adults? <details class='ans'><summary>Answer</summary>Around S2 (S3 or lower in 1–5%).</details></li>\n<li>Why can you not see the needle once it is in the canal? <details class='ans'><summary>Answer</summary>The dorsal wall of the sacrum casts an acoustic shadow.</details></li>\n<li>How do you confirm epidural spread without fluoroscopy? <details class='ans'><summary>Answer</summary>Colour Doppler shows flow moving cephalad in the canal, with no subcutaneous swelling.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 17 (Vargas-Silva &amp; Peng).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer 2018, ch 13.</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 10.</li>\n<li>Chen CP et al. Ultrasound guidance in caudal epidural needle placement. Anesthesiology 2004;101:181–4.</li>\n<li>Bagheri H, Govsa F. Anatomy of the sacral hiatus and its clinical relevance in caudal epidural block. Surg Radiol Anat 2017;39:943–51.</li>\n</ul>", "checks": 8}, "P06": {"title": "P06 Suprascapular nerve block", "html": "<p>Region: Peripheral nerves · Station time: 15 minutes · Partner viva cases: 6.4 frozen shoulder, 6.5 chronic shoulder pain unfit for surgery.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Sitting, arm in lap or hand on the opposite shoulder; or prone with a pillow under the chest</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 8–13 MHz (curvilinear if large)</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G, 3.5–4 inch (90–100 mm)</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Probe coronal over the supraspinous fossa with a slight anterior tilt</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane, medial to lateral</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Floor of the supraspinous fossa, deep to the supraspinatus fascia, next to the nerve, between the suprascapular and spinoglenoid notches</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>2–4 mL local anaesthetic + 1 mL steroid (e.g. triamcinolone 40 mg)</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the block is done</h2>\n<p>The suprascapular nerve carries most of the sensation from the glenohumeral and AC joints. Blocking it relieves pain from frozen shoulder, arthritis, cuff tear arthropathy and post-stroke shoulder pain. It is also the target for pulsed radiofrequency and nerve stimulation.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Arises from the upper trunk of the brachial plexus (C5, C6; sometimes C4).</li>\n<li>Runs back under omohyoid and trapezius to the suprascapular notch, passing under the superior transverse scapular ligament. The suprascapular artery usually passes above the ligament.</li>\n<li>In the supraspinous fossa it gives motor branches to supraspinatus and sensory branches to the glenohumeral and AC joints.</li>\n<li>It then turns around the spinoglenoid notch to supply infraspinatus.</li>\n<li>Entrapment at the suprascapular notch causes pain plus weakness of both muscles. Entrapment at the spinoglenoid notch causes painless infraspinatus wasting, because the sensory branches have already left.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Palpate the spine of the scapula and the acromion.</li>\n<li>Place the probe coronally over the supraspinous fossa, just above the spine, with a slight anterior tilt. A transverse probe is less useful because the scapular spine casts a shadow over the fossa.</li>\n<li>Identify from superficial to deep: skin, trapezius, supraspinatus, the bony floor of the fossa.</li>\n<li>Scan from medial to lateral to see the fossa floor slope toward the spinoglenoid notch and the base of the scapular spine.</li>\n<li>Turn on colour Doppler: the suprascapular artery and vein lie with the nerve on the fossa floor.</li>\n<li>The nerve is often hard to see. Then the target is the plane under the supraspinatus fascia on the fossa floor.</li>\n</ol>\n<p>Anatomical note to quote: the bright line some describe as the transverse scapular ligament on ultrasound is in fact the deep fascial layer of supraspinatus. The posterior ultrasound approach targets the fossa floor, not the notch.</p>\n<p>Diagram 1 below shows the view and needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 408' role='img' aria-label='Suprascapular nerve block: tip on the floor of the supraspinous fossa' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Suprascapular nerve: tip on the floor of the supraspinous fossa</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic coronal view with anterior tilt, sitting or prone. Screen left = medial, right = lateral.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='420' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='150' y1='86' x2='610' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M160 96 L600 96 L600 134 L160 128 Z' fill='var(--mus)' fill-opacity='0.10' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M160 134 L600 140 L600 214 Q420 232 160 214 Z' fill='var(--mus)' fill-opacity='0.20' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M160 222 Q420 240 600 222' fill='none' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='5 4'/></g><g><path d='M160 252 Q420 268 600 246' fill='none' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/><path d='M160 255 Q420 271 600 249 L600 310 L160 310 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><circle cx='452' cy='252' r='8' fill='var(--bad)' fill-opacity='0.2' stroke='var(--bad)' stroke-width='1.5'/></g><g><circle cx='474' cy='253' r='7' fill='var(--nrv)' fill-opacity='0.3' stroke='var(--nrv)' stroke-width='1.5'/></g><g><line x1='110' y1='100' x2='425' y2='250' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='36' y='94' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='428.0,243.0 425.6,248.8 419.4,249.2 424.2,253.2 422.7,259.3 428.0,256.0 433.3,259.3 431.8,253.2 436.6,249.2 430.4,248.8' fill='var(--accent)' stroke='var(--accent)'/><text x='180' y='298' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: fossa floor, under the fascia</text></g><text x='380' y='120' font-size='12' text-anchor='middle' fill='var(--muted)'>Trapezius</text><text x='520' y='186' font-size='12' text-anchor='middle' fill='var(--muted)'>Supraspinatus</text><line x1='560' y1='230' x2='600' y2='202' stroke='var(--muted)' stroke-width='1'/><text x='604' y='196' font-size='12' text-anchor='start' fill='var(--muted)'>Supraspinatus fascia</text><line x1='456' y1='260' x2='520' y2='292' stroke='var(--muted)' stroke-width='1'/><line x1='478' y1='260' x2='524' y2='290' stroke='var(--muted)' stroke-width='1'/><text x='528' y='298' font-size='12' text-anchor='start' fill='var(--muted)'>Artery + nerve</text><text x='380' y='330' font-size='12' text-anchor='middle' fill='var(--muted)'>Bony floor of the fossa: the backstop against the pleura</text><text x='24' y='362' font-size='12' text-anchor='start' fill='var(--muted)'>Doppler first: the suprascapular artery runs with the nerve on the floor.</text></g></svg><figcaption>Diagram 1 · Suprascapular nerve, coronal view over the fossa</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Sit or place the cadaver prone; stand behind; screen in front of you on the far side.</li>\n<li>MSK preset; depth 4–5 cm; focus on the fossa floor.</li>\n<li>Show the fossa, name trapezius, supraspinatus, fossa floor, base of the scapular spine.</li>\n<li>Doppler over the floor: say you are looking for the suprascapular artery.</li>\n<li>Insert in-plane from the medial end of the probe, 2 cm away. The path is steep, so heel the probe in.</li>\n<li>Advance under vision through trapezius and supraspinatus until the tip reaches the fossa floor beside the nerve and artery.</li>\n<li>Aspirate, inject a test volume: fluid should spread along the floor under the supraspinatus fascia, lifting the muscle.</li>\n<li>State the drugs and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip on the bony floor of the supraspinous fossa, deep to the supraspinatus fascia, next to the nerve and artery, between the suprascapular and spinoglenoid notches. The scapula is the backstop.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Aiming into the suprascapular notch from above: the needle can pass through to the lung.</li>\n<li>Injecting inside supraspinatus (spread stays in the muscle, not along the floor).</li>\n<li>No Doppler before the needle.</li>\n<li>Losing the tip on the steep path and advancing blind.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Sitting or prone, machine ergonomic, linear probe with MSK preset</label></li>\n<li><label><input type='checkbox' data-i='1'> Coronal probe over the fossa with anterior tilt</label></li>\n<li><label><input type='checkbox' data-i='2'> Trapezius, supraspinatus, fossa floor and scapular spine named</label></li>\n<li><label><input type='checkbox' data-i='3'> Doppler for the suprascapular artery</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane, medial to lateral, entry 2 cm from probe</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip on fossa floor under the supraspinatus fascia</label></li>\n<li><label><input type='checkbox' data-i='7'> Spread along the floor described; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Which muscle does the suprascapular nerve supply? <details class='ans'><summary>Answer</summary>Supraspinatus and infraspinatus (bulletin sample answer: infraspinatus).</details></li>\n<li>Why can spinoglenoid notch entrapment be painless? <details class='ans'><summary>Answer</summary>The sensory branches to the shoulder joints leave proximal to it.</details></li>\n<li>What protects against pneumothorax in the posterior approach? <details class='ans'><summary>Answer</summary>The bony floor of the fossa; keep the tip on bone and stay out of the notch.</details></li>\n<li>Which clinical test stretches the nerve at the spinoglenoid notch? <details class='ans'><summary>Answer</summary>Cross-body adduction.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 4 (Suprascapular nerve).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 2.</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 19 and 25.</li>\n<li>Harmon D, Hearty C. Ultrasound-guided suprascapular nerve block technique. Pain Physician 2007;10:743–6.</li>\n<li>Laumonerie P et al. Description and ultrasound targeting of the origin of the suprascapular nerve. Clin Anat 2017;30:747–52.</li>\n<li>Bilfeld M et al. Ultrasonography study of the suprascapular nerve. Diagn Interv Imaging 2017;98:873–9.</li>\n</ul>", "checks": 8}, "P07": {"title": "P07 Ilioinguinal and iliohypogastric nerve block", "html": "<p>Region: Peripheral nerves · Station time: 15 minutes · Partner viva case: 1.1 groin pain after hernia repair.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Supine</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 6–13 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>25 G 1.5 or 3.5 inch (out-of-plane); 22–25 G 3.5 inch (in-plane)</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Probe 2–3 fingerbreadths posterior to the ASIS, lateral end on the iliac crest, short axis to the nerves</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Out-of-plane (preferred) or in-plane from medial to lateral</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>In the fascial split between internal oblique and transversus abdominis, next to the nerves, within about 1.5 cm of the iliac crest</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>0.5 mL saline opens the IO–TA plane and pushes transversus down</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>About 5 mL local anaesthetic (e.g. 0.25% bupivacaine) ± 1 mL steroid</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the block is done</h2>\n<p>The ilioinguinal and iliohypogastric \"border nerves\" are injured in hernia repair, Pfannenstiel incisions, appendicectomy and laparoscopic port sites. Neuropathic groin and lower abdominal pain follows. The block is diagnostic and therapeutic; pulsed radiofrequency, neurectomy or nerve stimulation are later options.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Both nerves come from L1 (iliohypogastric also T12), emerge at the lateral border of psoas and cross quadratus lumborum.</li>\n<li>They pierce transversus abdominis near the iliac crest and run between it and internal oblique. Above and lateral to the ASIS they are found in this plane in about 90% of people.</li>\n<li>The iliohypogastric pierces internal oblique above the ASIS and supplies the suprapubic and lateral gluteal skin.</li>\n<li>The ilioinguinal enters the inguinal canal and supplies the root of the penis/anterior scrotum (mons and labium majus) and upper inner thigh.</li>\n<li>The deep circumflex iliac artery runs in the same plane: Doppler finds it and confirms the right layer.</li>\n<li>Course and branching vary widely; only a minority match the textbook pattern, which is why blind blocks fail in 10–40%.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Place the probe on the line from ASIS toward the umbilicus, then move it 2–3 fingerbreadths back (posterior) along the iliac crest so the lateral end sits on the crest.</li>\n<li>Keep the probe at right angles to the skin and press a little more on the medial end (toe in) to see all three muscles.</li>\n<li>Name: iliac crest (bright with shadow), external oblique, internal oblique, transversus abdominis, peritoneum and bowel below.</li>\n<li>Look for a fascial split between internal oblique and transversus close to the crest: the nerves lie in it as small oval structures.</li>\n<li>Colour Doppler: the deep circumflex iliac artery in the same split.</li>\n<li>Avoid scanning too far cephalad, where the subcostal nerve in the same plane can be mistaken for the iliohypogastric. Below the ASIS external oblique is only an aponeurosis, so you see two muscle layers.</li>\n</ol>\n<p>Diagram 1 below shows the view and the target plane.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 408' role='img' aria-label='Ilioinguinal and iliohypogastric block: tip between internal oblique and transversus abdominis' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>II/IH: tip in the plane between internal oblique and transversus abdominis</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic view behind the ASIS, probe end on the iliac crest. Left = medial, right = lateral.</text><g transform='translate(0,28)'><g><rect x='150' y='50' width='440' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='370' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='150' y1='72' x2='590' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='130' y1='86' x2='610' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M130 98 L540 98 L520 136 L130 132 Z' fill='var(--mus)' fill-opacity='0.10' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M130 140 L518 144 L496 196 L130 192 Z' fill='var(--mus)' fill-opacity='0.18' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M130 206 L494 210 L476 250 L130 246 Z' fill='var(--mus)' fill-opacity='0.26' stroke='var(--mus)' stroke-width='1'/></g><g><line x1='130' y1='262' x2='470' y2='266' stroke='var(--muted)' stroke-width='2'/></g><g><path d='M548 100 Q520 200 500 300' fill='none' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M552 104 Q526 200 506 300 L610 300 L610 100 Z' fill='var(--line)' fill-opacity='0.6'/></g><g><circle cx='428' cy='201' r='6' fill='var(--nrv)' fill-opacity='0.35' stroke='var(--nrv)' stroke-width='1.5'/><circle cx='452' cy='202' r='6' fill='var(--nrv)' fill-opacity='0.35' stroke='var(--nrv)' stroke-width='1.5'/></g><g><circle cx='474' cy='203' r='6' fill='var(--bad)' fill-opacity='0.2' stroke='var(--bad)' stroke-width='1.5'/></g><g><line x1='90' y1='104' x2='404' y2='198' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='24' y='98' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='408.0,191.0 405.6,196.8 399.4,197.2 404.2,201.2 402.7,207.3 408.0,204.0 413.3,207.3 411.8,201.2 416.6,197.2 410.4,196.8' fill='var(--accent)' stroke='var(--accent)'/><text x='230' y='300' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: IO–TA plane</text></g><line x1='300' y1='290' x2='400' y2='208' stroke='var(--muted)' stroke-width='1'/><text x='300' y='122' font-size='12' text-anchor='middle' fill='var(--muted)'>External oblique</text><text x='200' y='180' font-size='12' text-anchor='middle' fill='var(--muted)'>Internal oblique</text><text x='280' y='232' font-size='12' text-anchor='middle' fill='var(--muted)'>Transversus abdominis</text><text x='160' y='282' font-size='12' text-anchor='start' fill='var(--muted)'>Peritoneum, bowel below</text><text x='600' y='320' font-size='12' text-anchor='end' fill='var(--muted)'>Iliac crest</text><line x1='424' y1='164' x2='440' y2='194' stroke='var(--muted)' stroke-width='1'/><text x='420' y='160' font-size='12' text-anchor='end' fill='var(--muted)'>Nerves + DCIA</text><text x='24' y='352' font-size='12' text-anchor='start' fill='var(--muted)'>0.5 mL saline should split IO from TA and push transversus down. Out-of-plane is also fine.</text></g></svg><figcaption>Diagram 1 · Ilioinguinal / iliohypogastric, view by the iliac crest</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Supine. Stand on the side to be blocked, machine opposite.</li>\n<li>Small-parts or nerve preset, depth 3–4 cm, focus at the IO–TA plane.</li>\n<li>Find the three layers and the crest; name them aloud. Doppler for the deep circumflex iliac artery.</li>\n<li>Out-of-plane: enter at the mid-point of the probe edge and walk the tip down, sliding the probe to track the bright dot. Or in-plane from the medial end, aiming laterally toward the crest.</li>\n<li>Once the tip passes internal oblique, inject 0.5 mL saline: the IO–TA plane should open and transversus should be pushed down.</li>\n<li>Adjust until spread surrounds the nerves, then state the drug and volume.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip in the fascial plane between internal oblique and transversus abdominis, beside the nerves and the deep circumflex iliac artery, within about 1.5 cm of the iliac crest.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Injecting into a muscle (spread stays as a bleb, plane does not open).</li>\n<li>Tip deep to transversus: peritoneum and bowel puncture; spread under the fascia iliaca can block the femoral nerve.</li>\n<li>Scanning too high and blocking the subcostal nerve instead.</li>\n<li>No Doppler.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Supine, machine ergonomic, linear probe, depth and focus set</label></li>\n<li><label><input type='checkbox' data-i='1'> Probe on the crest posterior to the ASIS, short axis to the nerves</label></li>\n<li><label><input type='checkbox' data-i='2'> Iliac crest, EO, IO, TA and peritoneum named</label></li>\n<li><label><input type='checkbox' data-i='3'> Doppler for the deep circumflex iliac artery</label></li>\n<li><label><input type='checkbox' data-i='4'> Approach stated (out-of-plane walk-down or in-plane medial to lateral)</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Hydrolocation opens the IO–TA plane</label></li>\n<li><label><input type='checkbox' data-i='7'> Drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Between which muscles do the nerves lie near the ASIS? <details class='ans'><summary>Answer</summary>Internal oblique and transversus abdominis.</details></li>\n<li>Which artery lies close to the ilioinguinal nerve? <details class='ans'><summary>Answer</summary>A branch of the deep circumflex iliac artery.</details></li>\n<li>Why does external oblique often look like a thin line here? <details class='ans'><summary>Answer</summary>Below the ASIS it is an aponeurosis, not muscle.</details></li>\n<li>Name two complications. <details class='ans'><summary>Answer</summary>Bowel or peritoneal puncture; temporary femoral nerve block (quadriceps weakness).</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 6 (Kumar &amp; Peng).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 17.</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 5.</li>\n<li>Eichenberger U et al. Ultrasound-guided blocks of the ilioinguinal and iliohypogastric nerve: accuracy of a selective new technique confirmed by anatomical dissection. Br J Anaesth 2006;97:238–43.</li>\n<li>Rab M et al. Anatomic variability of the ilioinguinal and genitofemoral nerve: implications for the treatment of groin pain. Plast Reconstr Surg 2001;108:1618–23.</li>\n<li>Peng PWH, Narouze S. Ultrasound-guided interventional procedures in pain medicine, Part I: non-axial structures. Reg Anesth Pain Med 2009;34:458–74.</li>\n</ul>", "checks": 8}, "P08": {"title": "P08 Pudendal nerve block (interligamentous plane)", "html": "<p>Region: Peripheral nerves · Station time: 15 minutes · Partner viva case: 1.2 pudendal neuralgia.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Prone, pillow under the pelvis</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Curvilinear 2–6 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G 3.5 inch</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Three steps down from the PSIS: iliac crest → greater sciatic notch (piriformis) → ischial spine</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane, medial to lateral, entry 2 cm from the probe</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Medial to the ischial spine, in the interligamentous plane between the sacrotuberous (superficial) and sacrospinous (deep) ligaments, next to the internal pudendal artery</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Saline hydrolocation spreads between the two ligaments</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>4 mL local anaesthetic (0.25% bupivacaine, no adrenaline) + 1 mL steroid</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the block is done</h2>\n<p>Pudendal neuralgia causes burning perineal, genital or perianal pain, worse on sitting and eased by standing or sitting on a toilet seat. Entrapment at the interligamentous plane or in Alcock's canal is common. The block confirms the diagnosis and can treat it; pulsed radiofrequency or decompression may follow.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Formed from the S2–S4 anterior rami.</li>\n<li>Leaves the pelvis below piriformis, curves around the ischial spine and sacrospinous ligament, and re-enters through the lesser sciatic notch into Alcock's canal.</li>\n<li>At the ischial spine it lies between the sacrospinous (deep) and sacrotuberous (superficial) ligaments: the interligamentous plane.</li>\n<li>The internal pudendal artery runs with it; the nerve is usually medial to the artery.</li>\n<li>Branches: inferior rectal (external anal sphincter, perianal skin), perineal (perineal skin, deep perineal muscles) and the dorsal nerve of the penis or clitoris.</li>\n<li>The sciatic nerve lies lateral to the tip of the ischial spine.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li><strong>Over the iliac crest:</strong> start at the PSIS; the crest with the three gluteal muscles.</li>\n<li><strong>At the greater sciatic notch:</strong> slide down. The ischium appears as a curved line; gluteus maximus covers piriformis; the sciatic nerve with a branch of the inferior gluteal artery lies deep to piriformis. Keep the probe along the axis of piriformis and tilt it medially.</li>\n<li><strong>At the ischial spine:</strong> slide further down. Four changes: the ischium becomes longer and straighter; piriformis disappears; the bright sacrospinous ligament appears medial to the spine; the internal pudendal artery appears (Doppler).</li>\n<li>Bone casts a shadow; the sacrospinous ligament does not. That is how you tell them apart.</li>\n<li>The sacrotuberous ligament lies superficially, under gluteus maximus.</li>\n</ol>\n<p>Diagram 1 below shows the view at the ischial spine with the target.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 408' role='img' aria-label='Pudendal nerve block: tip in the interligamentous plane medial to the ischial spine' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Pudendal: tip between the ligaments, medial to the ischial spine</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic view at the level of the ischial spine, prone. Left = medial, right = lateral.</text><g transform='translate(0,28)'><g><rect x='160' y='50' width='440' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='160' y1='72' x2='600' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='120' y1='86' x2='640' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M140 98 L630 98 L630 168 Q400 176 140 172 Z' fill='var(--mus)' fill-opacity='0.14' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M150 186 L400 192' stroke='var(--muted)' stroke-width='4' stroke-linecap='round'/></g><g><path d='M170 250 L410 236' stroke='var(--muted)' stroke-width='4' stroke-linecap='round'/></g><g><path d='M410 236 L630 252' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M410 240 L630 256 L630 320 L410 320 Z' fill='var(--line)' fill-opacity='0.6'/></g><g><circle cx='330' cy='218' r='7' fill='var(--nrv)' fill-opacity='0.35' stroke='var(--nrv)' stroke-width='1.5'/></g><g><circle cx='360' cy='216' r='7' fill='var(--bad)' fill-opacity='0.2' stroke='var(--bad)' stroke-width='1.5'/></g><g><ellipse cx='560' cy='206' rx='26' ry='14' fill='var(--nrv)' fill-opacity='0.25' stroke='var(--nrv)' stroke-width='1.5'/></g><g><line x1='96' y1='108' x2='304' y2='212' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='24' y='100' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle (in-plane)</text></g><g><polygon points='306.0,205.0 303.6,210.8 297.4,211.2 302.2,215.2 300.7,221.3 306.0,218.0 311.3,221.3 309.8,215.2 314.6,211.2 308.4,210.8' fill='var(--accent)' stroke='var(--accent)'/><text x='310' y='306' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--ink)'>Target: interligamentous plane</text></g><line x1='304' y1='292' x2='306' y2='226' stroke='var(--muted)' stroke-width='1'/><text x='400' y='134' font-size='12' text-anchor='middle' fill='var(--muted)'>Gluteus maximus</text><text x='170' y='206' font-size='12' text-anchor='start' fill='var(--muted)'>Sacrotuberous lig.</text><text x='176' y='272' font-size='12' text-anchor='start' fill='var(--muted)'>Sacrospinous lig.</text><line x1='436' y1='212' x2='370' y2='216' stroke='var(--muted)' stroke-width='1'/><text x='440' y='216' font-size='12' text-anchor='start' fill='var(--muted)'>Nerve + artery</text><text x='520' y='300' font-size='12' text-anchor='middle' fill='var(--muted)'>Ischial spine (bone, shadow)</text><text x='560' y='236' font-size='12' text-anchor='middle' fill='var(--muted)'>Sciatic nerve</text><text x='24' y='356' font-size='12' text-anchor='start' fill='var(--muted)'>In-plane medial to lateral. Stay medial to the spine: lateral spread blocks the sciatic nerve.</text></g></svg><figcaption>Diagram 1 · Pudendal nerve, view at the ischial spine</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Prone. Stand on the side to be blocked, machine opposite.</li>\n<li>Abdominal or deep preset, depth 6–8 cm, focus at the spine.</li>\n<li>Walk the probe down through the three views, naming the structures.</li>\n<li>Colour Doppler: find the internal pudendal artery medial to the spine.</li>\n<li>Insert in-plane from the medial end of the probe, 2 cm away (the path is steep).</li>\n<li>Advance with the tip in view through gluteus maximus and the sacrotuberous ligament.</li>\n<li>Once past the sacrotuberous ligament, inject saline: it should spread in the plane between the two ligaments, beside the artery.</li>\n<li>State the drugs; avoid adrenaline (it may compromise the blood supply of a compressed nerve).</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip medial to the ischial spine, in the interligamentous plane: deep to the sacrotuberous ligament, superficial to the sacrospinous ligament, beside the internal pudendal artery.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Injecting lateral to the ischial spine: sciatic nerve block.</li>\n<li>Puncture of the internal pudendal artery (no Doppler).</li>\n<li>Tip deep to the sacrospinous ligament (into the pelvis) or still within gluteus maximus.</li>\n<li>Not showing the three-step scan, so the spine is not proven.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Prone, machine ergonomic, curvilinear probe, depth and focus set</label></li>\n<li><label><input type='checkbox' data-i='1'> Three-step scan shown (crest, sciatic notch, ischial spine)</label></li>\n<li><label><input type='checkbox' data-i='2'> Ischial spine, sacrospinous and sacrotuberous ligaments named</label></li>\n<li><label><input type='checkbox' data-i='3'> Internal pudendal artery found with Doppler; sciatic nerve location stated</label></li>\n<li><label><input type='checkbox' data-i='4'> In-plane medial to lateral, entry 2 cm from probe</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Hydrolocation in the interligamentous plane, medial to the spine</label></li>\n<li><label><input type='checkbox' data-i='7'> Drug and volume stated; no adrenaline</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>Where is the pudendal nerve most readily found? <details class='ans'><summary>Answer</summary>Medial to the ischial spine, between the sacrospinous and sacrotuberous ligaments.</details></li>\n<li>What lies lateral to the ischial spine? <details class='ans'><summary>Answer</summary>The sciatic nerve.</details></li>\n<li>How do you tell the sacrospinous ligament from the ischium? <details class='ans'><summary>Answer</summary>Bone casts an acoustic shadow; the ligament does not.</details></li>\n<li>Which branch supplies the external anal sphincter? <details class='ans'><summary>Answer</summary>The inferior rectal nerve.</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 9 (Bellingham &amp; Peng).</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 17.</li>\n<li>Rofaeel A et al. Feasibility of real-time ultrasound for pudendal nerve block in patients with chronic perineal pain. Reg Anesth Pain Med 2008;33:139–45.</li>\n<li>Bellingham GA et al. Randomized controlled trial comparing pudendal nerve block under ultrasound and fluoroscopic guidance. Reg Anesth Pain Med 2012;37:262–6.</li>\n<li>Peng PWH, Tumber PS. Ultrasound-guided interventional procedures for patients with chronic pelvic pain: a description of techniques and review of literature. Pain Physician 2008;11:215–24.</li>\n</ul>", "checks": 8}, "P11": {"title": "P11 Acromioclavicular joint injection", "html": "<p>Region: MSK joints · Station time: 15 minutes · Partner viva case: 6.1 AC joint pain in a powerlifter.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Sitting, arm by the side</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 5–13 MHz (high frequency)</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>25 G, 1.5 inch (38 mm)</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Coronal over the joint, then short-axis (sagittal) between acromion and clavicle</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Out-of-plane from anterior in the coronal view (common); or in-plane in the short-axis view</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Just deep to the superior AC capsule, inside the joint, no more than about 1 cm deep</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>1.5–2 mL local anaesthetic with steroid (e.g. methylprednisolone 10–20 mg)</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>AC joint osteoarthritis, post-traumatic arthritis and distal clavicle osteolysis cause top-of-shoulder pain made worse by cross-body adduction. A guided injection is both diagnostic (repeat the provocation test afterwards) and therapeutic.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Plane synovial joint between the lateral end of the clavicle and the medial acromion.</li>\n<li>Contains a wedge-shaped fibrocartilaginous disc that often degenerates early.</li>\n<li>Capsule reinforced above by the superior AC ligament; stability also from the coracoclavicular (conoid and trapezoid) ligaments.</li>\n<li>Directly under the joint lie the subacromial–subdeltoid bursa and the supraspinatus muscle. A needle that goes too deep injects there instead.</li>\n<li>Innervation: suprascapular, lateral pectoral and axillary nerve branches.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<h3>Scan 1: coronal</h3>\n<ol>\n<li>Palpate along the lateral clavicle to its end. Place the probe coronally across the joint.</li>\n<li>Show: clavicle (medial bright line with shadow), acromion (lateral), the dark joint gap, the bright superior capsule/ligament bridging it, the wedge-shaped disc.</li>\n<li>Look for capsular bulge, effusion, osteophytes and cortical erosion. Compare with the other side and measure capsule distension.</li>\n<li>Dynamic test: cross-body adduction loads the joint; watch for capsular bulging and pain.</li>\n</ol>\n<h3>Scan 2: short axis (for in-plane)</h3>\n<ol>\n<li>Rotate the probe 90° over the acromion (sagittal).</li>\n<li>Slide medially until the bony shadow disappears: you are over the joint gap, with capsule, bursa and supraspinatus below.</li>\n<li>Slide further medially to the clavicle to confirm, then back to the gap.</li>\n</ol>\n<p>Diagram 1 below shows the coronal view with the target.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 398' role='img' aria-label='AC joint injection: tip just under the superior capsule' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>AC joint: tip just under the superior capsule, no deeper than about 1 cm</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic coronal view, sitting, arm by side. Screen left = medial (clavicle), right = lateral (acromion).</text><g transform='translate(0,28)'><g><rect x='200' y='42' width='360' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='380' y='55' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe on a thick layer of gel (step-off)</text></g><line x1='200' y1='64' x2='560' y2='64' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><g><rect x='200' y='64' width='360' height='16' fill='var(--accent-soft)'/></g><line x1='170' y1='96' x2='590' y2='96' stroke='var(--line)' stroke-width='1'/><g><path d='M170 150 Q300 128 362 150 L362 250 L170 250 Z' fill='var(--line)' fill-opacity='0.5'/><path d='M170 150 Q300 128 362 150' fill='none' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/></g><g><path d='M398 150 Q470 130 590 146 L590 250 L398 250 Z' fill='var(--line)' fill-opacity='0.5'/><path d='M398 150 Q470 130 590 146' fill='none' stroke='var(--muted)' stroke-width='5' stroke-linecap='round'/></g><g><path d='M330 136 Q380 112 430 136' fill='none' stroke='var(--muted)' stroke-width='3'/></g><g><polygon points='370,144 390,144 380,176' fill='var(--muted)' fill-opacity='0.35'/></g><g><line x1='170' y1='266' x2='590' y2='266' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='5 4'/></g><g><rect x='170' y='274' width='420' height='34' fill='var(--mus)' fill-opacity='0.14' stroke='var(--mus)' stroke-width='1'/></g><g><circle cx='380' cy='136' r='15' fill='none' stroke='var(--accent)' stroke-width='1.5' stroke-dasharray='3 3'/></g><g><polygon points='380.0,127.0 377.6,132.8 371.4,133.2 376.2,137.2 374.7,143.3 380.0,140.0 385.3,143.3 383.8,137.2 388.6,133.2 382.4,132.8' fill='var(--accent)' stroke='var(--accent)'/><text x='450' y='112' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: in the gap, under the capsule</text></g><line x1='448' y1='108' x2='396' y2='130' stroke='var(--muted)' stroke-width='1'/><text x='250' y='210' font-size='12' text-anchor='middle' fill='var(--muted)'>Clavicle</text><text x='510' y='210' font-size='12' text-anchor='middle' fill='var(--muted)'>Acromion</text><line x1='330' y1='128' x2='286' y2='108' stroke='var(--muted)' stroke-width='1'/><text x='282' y='104' font-size='12' text-anchor='end' fill='var(--muted)'>Superior capsule / AC ligament</text><line x1='380' y1='176' x2='380' y2='230' stroke='var(--muted)' stroke-width='1'/><text x='380' y='244' font-size='12' text-anchor='middle' fill='var(--muted)'>Wedge-shaped disc</text><text x='600' y='262' font-size='12' text-anchor='start' fill='var(--muted)'>Subacromial bursa</text><text x='380' y='296' font-size='12' text-anchor='middle' fill='var(--muted)'>Supraspinatus: too deep if the tip reaches here</text><text x='24' y='350' font-size='12' text-anchor='start' fill='var(--muted)'>Out-of-plane: the needle shows as a bright dot (dashed ring). Walk it down into the gap.</text></g></svg><figcaption>Diagram 1 · AC joint, coronal view</figcaption></figure>\n<h2>Procedure on the cadaver</h2>\n<ol>\n<li>Sit the cadaver up or prop it; machine on the opposite side.</li>\n<li>High-frequency preset; depth 2–3 cm; focus at the capsule.</li>\n<li>Coronal view centred over the joint. Name clavicle, acromion, capsule, disc.</li>\n<li>Apply a thick layer of gel (the step-off) so the probe floats over the bony bumps and the needle can enter under its edge.</li>\n<li>Out-of-plane: enter at the middle of the probe edge, steep, using a walk-down technique: a bright dot each time you slide the probe and advance.</li>\n<li>Stop when the dot lies inside the gap under the capsule.</li>\n<li>Inject: the superior capsule lifts and the joint distends. Resistance is normal in this small joint.</li>\n<li>Alternative: short-axis view, in-plane from anterior or posterior, tip in the gap under the capsule.</li>\n</ol>\n<h2>Final needle position</h2>\n<p>Tip inside the AC joint gap, just under the superior capsule and AC ligament, between clavicle and acromion. Not deeper than about 1 cm.</p>\n<h2>How marks are lost</h2>\n<ul>\n<li>Tip too deep: injectate goes into the subacromial bursa or supraspinatus.</li>\n<li>Injection into the capsule or soft tissue above the joint (bleb outside the joint).</li>\n<li>Out-of-plane without the walk-down: you cannot prove where the tip is.</li>\n<li>Forgetting to compare with the other side or to do a dynamic test.</li>\n</ul>\n<h2>Self-check (tick each one)</h2>\n<ul class='check selfcheck'>\n<li><label><input type='checkbox' data-i='0'> Sitting, arm by side, machine ergonomic</label></li>\n<li><label><input type='checkbox' data-i='1'> High-frequency linear probe, shallow depth, focus at capsule</label></li>\n<li><label><input type='checkbox' data-i='2'> Clavicle, acromion, capsule/ligament and disc named</label></li>\n<li><label><input type='checkbox' data-i='3'> Contralateral comparison or measurement offered</label></li>\n<li><label><input type='checkbox' data-i='4'> Gel step-off used; entry point appropriate</label></li>\n<li><label><input type='checkbox' data-i='5'> Tip seen (walk-down) before every advance</label></li>\n<li><label><input type='checkbox' data-i='6'> Tip under the superior capsule inside the gap</label></li>\n<li><label><input type='checkbox' data-i='7'> Capsule lift seen; drug and volume stated</label></li>\n</ul>\n<h2>Self-test</h2>\n<ol>\n<li>What lies immediately deep to the AC joint? <details class='ans'><summary>Answer</summary>Subacromial–subdeltoid bursa and supraspinatus.</details></li>\n<li>Maximum safe depth of the needle tip? <details class='ans'><summary>Answer</summary>About 1 cm.</details></li>\n<li>Accuracy of guided vs blind AC injection? <details class='ans'><summary>Answer</summary>About 95–100% with ultrasound vs 39–50% by palpation.</details></li>\n<li>Which clinical test do you repeat after the injection? <details class='ans'><summary>Answer</summary>Cross-body adduction (plus O'Brien test).</details></li>\n</ol>\n<h2>References</h2>\n<ul class='refs'>\n<li>Peng P et al. <em>Ultrasound for Interventional Pain Management</em>. Springer 2020, ch 19 (Shoulder).</li>\n<li>Spinner D et al. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer 2014, ch 2.</li>\n<li>Narouze S, ed. <em>Atlas of Ultrasound-Guided Procedures</em>, 2nd ed. Springer 2018, ch 26.</li>\n<li>Peck E et al. Accuracy of ultrasound-guided versus palpation-guided acromioclavicular joint injections: a cadaveric study. PM R 2010;2:817–21.</li>\n<li>Sabeti-Aschraf M et al. Ultrasound guidance improves the accuracy of the acromioclavicular joint infiltration: a prospective randomized study. Knee Surg Sports Traumatol Arthrosc 2011;19:292–5.</li>\n<li>Peng PWH, Cheng P. Ultrasound-guided interventional procedures in pain medicine, Part III: shoulder. Reg Anesth Pain Med 2011;36:592–605.</li>\n</ul>", "checks": 8}, "P12": {"title": "P12 Glenohumeral joint injection (posterior approach)", "html": "<p>Region: MSK joints · Station time: 15 minutes · Partner viva case: 6.4 frozen shoulder.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Lateral decubitus (side up) or sitting; arm across the chest, hand on the opposite shoulder</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 5–13 MHz; curvilinear if large or for a steep path</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 G 2 inch, or 22 G 3.5 inch spinal</td>\n</tr>\n<tr>\n<td>Scan</td>\n<td>Probe just below and parallel to the scapular spine, over the back of the joint</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>In-plane from the lateral end of the probe</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>Between the posterior labrum and the humeral head, just deep to the capsule; avoid cartilage and labrum</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Capsule distends and fluid spreads medially into the joint</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>About 4 mL local anaesthetic + 40 mg methylprednisolone; larger volumes for capsular distension</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the injection is done</h2>\n<p>Adhesive capsulitis (frozen shoulder), glenohumeral osteoarthritis and inflammatory arthritis cause deep shoulder pain and loss of rotation. Steroid helps in the short term; distension (hydrodilatation) is an option in frozen shoulder. Ultrasound guidance is far more accurate than blind injection.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Ball-and-socket joint: the large humeral head on the shallow glenoid, deepened by the fibrocartilage labrum.</li>\n<li>The posterior capsule lies under infraspinatus; teres minor sits below it.</li>\n<li>The suprascapular nerve and artery run around the spinoglenoid notch, medial to the posterior glenoid: stay lateral to it.</li>\n<li>The capsule is lax enough at the back for a needle to enter between head and labrum.</li>\n<li>The anterior alternative is through the rotator interval (between supraspinatus and subscapularis), next to the intra-articular biceps tendon.</li>\n</ul>\n<h2>Sonoanatomy: what you must show</h2>\n<ol>\n<li>Place the probe parallel to and just below the scapular spine, over the back of the shoulder.</li>\n<li>Name: deltoid, infraspinatus (and its tendon running to the humeral head), the round humeral head with dark cartilage, the posterior glenoid and the bright triangular labrum, the posterior capsule.</li>\n<li>Dynamic test: rotate the arm internally and externally; the head and infraspinatus glide under the probe.</li>\n<li>Look for effusion in the posterior recess (dark fluid between capsule and head). Compare with the other side.</li>\n<li>Medially, the spinoglenoid notch with the suprascapular vessels (Doppler).</li>\n</ol>\n<p>Diagram 1 below shows the posterior view with the needle path.</p>\n<figure class='dia'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 408' role='img' aria-label='Glenohumeral joint injection: tip between posterior labrum and humeral head' font-family='inherit'><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--ink)'>Glenohumeral: tip between the posterior labrum and the humeral head</text><text x='24' y='50' font-size='11.5' text-anchor='start' fill='var(--muted)'>Schematic posterior view below the scapular spine. Left = medial, right = lateral.</text><g transform='translate(0,28)'><g><rect x='170' y='50' width='430' height='18' rx='6' fill='var(--accent-soft)' stroke='var(--muted)' stroke-width='1.25'/><text x='385' y='63' font-size='11.5' text-anchor='middle' fill='var(--muted)'>Probe</text></g><line x1='170' y1='72' x2='600' y2='72' stroke='var(--muted)' stroke-width='1.25' stroke-dasharray='4 4'/><line x1='130' y1='86' x2='640' y2='86' stroke='var(--line)' stroke-width='1'/><g><path d='M140 98 L640 98 L640 136 L140 132 Z' fill='var(--mus)' fill-opacity='0.10' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M140 138 L640 142 L640 186 Q420 196 140 190 Z' fill='var(--mus)' fill-opacity='0.20' stroke='var(--mus)' stroke-width='1'/></g><g><path d='M150 262 L330 236' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M150 266 L330 240 L330 320 L150 320 Z' fill='var(--line)' fill-opacity='0.6'/></g><g><polygon points='326,236 362,226 334,254' fill='var(--muted)' fill-opacity='0.45' stroke='var(--muted)' stroke-width='1'/></g><g><path d='M372 262 Q420 196 520 196 Q600 200 640 236' fill='none' stroke='var(--line)' stroke-width='8'/><path d='M372 268 Q420 202 520 202 Q600 206 640 242' fill='none' stroke='var(--muted)' stroke-width='6' stroke-linecap='round'/><path d='M372 272 Q420 206 520 206 Q600 210 640 246 L640 320 L372 320 Z' fill='var(--line)' fill-opacity='0.5'/></g><g><path d='M300 214 Q420 196 640 200' fill='none' stroke='var(--muted)' stroke-width='2' stroke-dasharray='5 3'/></g><g><circle cx='200' cy='232' r='7' fill='var(--bad)' fill-opacity='0.2' stroke='var(--bad)' stroke-width='1.5'/></g><g><line x1='700' y1='108' x2='368' y2='232' stroke='var(--accent)' stroke-width='3' stroke-linecap='round'/><text x='660' y='150' font-size='12' text-anchor='start' font-weight='600' fill='var(--ink)'>Needle</text></g><g><polygon points='366.0,225.0 363.6,230.8 357.4,231.2 362.2,235.2 360.7,241.3 366.0,238.0 371.3,241.3 369.8,235.2 374.6,231.2 368.4,230.8' fill='var(--accent)' stroke='var(--accent)'/><text x='380' y='300' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--ink)'>Target: between labrum and head</text></g><line x1='430' y1='290' x2='370' y2='244' stroke='var(--muted)' stroke-width='1'/><text x='260' y='122' font-size='12' text-anchor='middle' fill='var(--muted)'>Deltoid</text><text x='260' y='170' font-size='12' text-anchor='middle' fill='var(--muted)'>Infraspinatus</text><text x='230' y='300' font-size='12' text-anchor='middle' fill='var(--muted)'>Glenoid</text><line x1='344' y1='246' x2='318' y2='270' stroke='var(--muted)' stroke-width='1'/><text x='314' y='284' font-size='12' text-anchor='end' fill='var(--muted)'>Labrum</text><text x='560' y='262' font-size='12' text-anchor='middle' fill='var(--muted)'>Humeral head (dark cartilage)</text><text x='150' y='214' font-size='11.5' text-anchor='start' fill='var(--muted)'>Suprascapular a.</text><text x='24' y='356' font-size='12' text-anchor='start' fill='var(--muted)'>In-plane from lateral; heel the probe in. Dashe
