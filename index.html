020 ch15, ch16", "kw": ["SIJ innervation", "posterior sacral network", "S1–S3 lateral branches"], "x": ["L4–L5 medial branches supply the facet joints (L5 contributes only occasionally).", "", "S2–S4 ventral rami form the pudendal and pelvic splanchnic nerves.", "The superior cluneal nerves are cutaneous to the buttock."]}, {"d": "P", "q": "Comparing median nerve cross-sectional area at the pronator quadratus with the largest area at the wrist crease, a difference greater than how much is reported to diagnose carpal tunnel syndrome with about 99% accuracy?", "o": ["1 mm²", "2 mm²", "4 mm²", "6 mm²"], "a": 1, "why": "A rise of more than 2 mm² from the proximal (pronator quadratus) level to the wrist is highly accurate. As single values, under 6 mm² usually excludes and over 12 mm² indicates CTS.", "ref": "Jacobson ch5", "kw": ["median nerve CSA", "ΔCSA", "pronator quadratus", "carpal tunnel"], "x": ["Not the published threshold.", "", "Not the published threshold; too insensitive.", "Not the published threshold; too insensitive."]}, {"d": "P", "q": "At the elbow, the thin band bridging the medial epicondyle and the olecranon, superficial to the ulnar nerve, is the:", "o": ["Cubital tunnel retinaculum (Osborne fascia)", "Posterior bundle of the ulnar collateral ligament", "Ligament of Struthers", "Anconeus muscle"], "a": 0, "why": "The cubital tunnel retinaculum roofs the ulnar nerve in the retrocondylar groove. The posterior bundle of the UCL lies deep to the nerve. The ligament of Struthers is above the elbow.", "ref": "Jacobson ch4", "kw": ["cubital tunnel retinaculum", "Osborne", "retrocondylar groove", "ulnar nerve"], "x": ["", "The posterior bundle of the UCL lies DEEP to the nerve (floor).", "The ligament of Struthers is above the elbow (supracondylar process, median nerve).", "Anconeus is lateral; only an accessory anconeus epitrochlearis can replace the retinaculum."]}, {"d": "P", "q": "The tarsal tunnel contains all of the following EXCEPT the:", "o": ["Tibialis posterior tendon", "Flexor digitorum longus tendon", "Flexor hallucis longus tendon", "Peroneus brevis tendon"], "a": 3, "why": "Medial ankle, anterior to posterior: tibialis posterior, flexor digitorum longus, posterior tibial vessels and tibial nerve, flexor hallucis longus. The peroneal tendons are lateral, behind the fibula.", "ref": "Jacobson ch8", "kw": ["tarsal tunnel", "flexor retinaculum", "Tom, Dick And Very Nervous Harry"], "x": ["Tibialis posterior is inside the tunnel.", "Flexor digitorum longus is inside the tunnel.", "Flexor hallucis longus is inside the tunnel.", ""]}, {"d": "P", "q": "The target plane for ultrasound-guided intercostal nerve block is between the:", "o": ["External and internal intercostal muscles", "Subcutaneous tissue and the external intercostal fascia", "Internal intercostal and innermost intercostal muscles", "Innermost intercostal muscle and the visceral pleura"], "a": 2, "why": "The intercostal nerve runs in the plane between the internal and innermost intercostal muscles. If the innermost layer is not seen, inject just deep to the internal intercostal.", "ref": "Peng 2020 ch5", "kw": ["intercostal nerve", "subcostal groove", "internal / innermost intercostal", "pneumothorax"], "x": ["Too superficial; the nerve is deep to the internal intercostal.", "Too superficial.", "", "Deep to the innermost intercostal is the endothoracic fascia and pleura (pneumothorax)."]}, {"d": "P", "q": "Expected effects after a successful stellate ganglion block include all of the following EXCEPT:", "o": ["Ptosis", "Hoarseness", "Conjunctival flushing", "Mydriasis"], "a": 3, "why": "Horner's syndrome (ptosis, miosis, anhidrosis), facial and conjunctival flushing, hoarseness and dysphagia can all occur. Sympathetic block causes miosis, not mydriasis.", "ref": "Peng 2020 ch3", "kw": ["stellate ganglion block", "Horner syndrome", "miosis", "flushing", "hoarseness"], "x": ["Ptosis is part of Horner's syndrome (expected).", "Hoarseness comes from spread to the recurrent laryngeal nerve (recognised).", "Conjunctival flushing comes from sympathetic block (expected).", ""]}, {"d": "M", "q": "The reported accuracy of ultrasound-guided acromioclavicular joint injection is:", "o": ["21–40%", "41–60%", "61–80%", "81–100%"], "a": 3, "why": "US-guided AC injection is accurate in 95–100%, compared with 39–50% for blind (palpation-guided) injection.", "ref": "Peng 2020 ch19; Peck E et al. PM R 2010;2:817–21", "kw": ["AC joint", "injection accuracy", "US-guided 95–100%", "palpation 39–50%"], "x": ["The lower end of blind (palpation-guided) accuracy.", "Blind (palpation-guided) accuracy, not US-guided.", "Too low for US guidance.", ""]}, {"d": "M", "q": "For a posterior-approach glenohumeral joint injection, the transducer is placed:", "o": ["In long axis to the infraspinatus tendon, with the needle in plane towards the posterior glenohumeral recess", "In long axis to the supraspinatus tendon over the greater tuberosity", "In short axis over the bicipital groove", "In the coronal plane over the acromioclavicular joint"], "a": 0, "why": "The posterior approach targets the posterior recess between the humeral head and the posterior labrum, with the probe in long axis to the infraspinatus and the needle in plane (usually lateral to medial).", "ref": "Jacobson ch3, ch9", "kw": ["posterior GH approach", "infraspinatus long axis", "posterior labrum", "lateral-to-medial"], "x": ["", "This is the view for SASD bursa or supraspinatus work.", "This is the view for the LHB tendon sheath.", "This is the view for the AC joint."]}, {"d": "M", "q": "The MOST common relationship between the sciatic nerve and the piriformis muscle is:", "o": ["An undivided nerve passing through the piriformis", "A divided nerve, one division through and one below the muscle", "An undivided nerve passing below the piriformis", "An undivided nerve passing above the piriformis"], "a": 2, "why": "In about 78–84% of people the undivided nerve exits below piriformis. A divided nerve passing through and below the muscle is next most common (12–21%).", "ref": "Narouze 2e piriformis chapter; Peng 2020 ch8", "kw": ["sciatic nerve", "piriformis", "anatomical variants", "78–84%"], "x": ["An undivided nerve passing through piriformis is rare.", "The second most common variant (12–21%).", "", "An undivided nerve passing above piriformis is rare."]}, {"d": "M", "q": "In lateral epicondylosis, the tendon MOST commonly involved, which is also the most anterior part of the common extensor tendon, is the:", "o": ["Extensor digitorum", "Extensor carpi radialis brevis", "Extensor carpi radialis longus", "Extensor carpi ulnaris"], "a": 1, "why": "The common extensor tendon = ECRB, extensor digitorum, extensor digiti minimi and ECU; ECRB is the most anterior part and the usual site of tendinosis. ECRL arises more proximally from the humeral metaphysis.", "ref": "Jacobson ch4", "kw": ["ECRB", "common extensor origin", "lateral epicondylosis", "tendinosis"], "x": ["Extensor digitorum is part of the CET but less often the primary lesion.", "", "ECRL arises proximal to the epicondyle, on the supracondylar ridge.", "ECU is the most posterior part of the CET."]}, {"d": "M", "q": "During anterior tibiotalar joint injection, inserting the needle medial to the tibialis anterior tendon avoids the:", "o": ["Deep peroneal nerve and dorsalis pedis (anterior tibial) artery", "Saphenous nerve and great saphenous vein", "Sural nerve", "Posterior tibial artery"], "a": 0, "why": "The deep peroneal nerve and anterior tibial/dorsalis pedis artery lie lateral to the tibialis anterior tendon (near EHL), so a medial entry keeps clear of them.", "ref": "Peng 2020 ch24", "kw": ["tibiotalar joint", "anterior recess", "tibialis anterior", "deep peroneal nerve", "dorsalis pedis"], "x": ["", "The saphenous nerve and vein are medial, so a medial entry does not avoid them.", "The sural nerve is posterolateral, away from the anterior approach.", "The posterior tibial artery is behind the medial malleolus."]}], "1-3": [{"d": "G", "q": "To correct aliasing on a colour Doppler image, the operator should:", "o": ["Decrease the pulse repetition frequency (scale)", "Increase the transducer frequency", "Increase the pulse repetition frequency (scale)", "Increase the colour gain"], "a": 2, "why": "Aliasing occurs when the Doppler shift exceeds what the pulse repetition frequency can sample. Correct it by raising the PRF (scale), lowering the transducer frequency or changing the beam angle.", "ref": "Jacobson ch1", "kw": ["aliasing", "pulse repetition frequency", "scale", "colour Doppler"], "x": ["Lowering the PRF makes aliasing worse.", "A higher frequency increases the Doppler shift, so aliasing gets worse.", "", "Gain adds colour noise and bleeding; it does not fix aliasing."]}, {"d": "G", "q": "Increasing the number of focal zones on the image will:", "o": ["Increase the frame rate", "Decrease the frame rate", "Increase the depth of penetration", "Remove anisotropy"], "a": 1, "why": "Each focal zone needs its own pulses, so more zones slow the frame rate (flicker). Use the fewest zones needed and place them at the depth of the target.", "ref": "Jacobson ch1; Peng 2020 ch1", "kw": ["focal zone", "frame rate", "lateral resolution", "target depth"], "x": ["The opposite: more zones slow the frame rate.", "", "Penetration depends mainly on frequency, not on focus.", "Anisotropy is corrected by the beam angle (heel-toe), not by focus."]}, {"d": "G", "q": "In a 60 kg patient with local anaesthetic systemic toxicity, the initial bolus of 20% lipid emulsion is:", "o": ["1.5 mL/kg over 2–3 minutes", "0.25 mL/kg over 2–3 minutes", "5 mL/kg over 2–3 minutes", "10 mL/kg over 2–3 minutes"], "a": 0, "why": "After calling for help and securing the airway, give 20% lipid 1.5 mL/kg as a bolus (100 mL if over 70 kg), then an infusion of about 0.25 mL/kg/min.", "ref": "Neal JM et al. Third ASRA Practice Advisory on LAST. Reg Anesth Pain Med 2018;43:113–23", "kw": ["LAST", "20% lipid emulsion", "1.5 mL/kg bolus", "airway first"], "x": ["", "0.25 mL/kg is the per-minute INFUSION rate, not the bolus.", "Far too large as a bolus.", "Approaches the recommended MAXIMUM total dose (about 12 mL/kg), not the bolus."]}, {"d": "C", "q": "Gabapentin and pregabalin produce analgesia mainly by binding to:", "o": ["GABA-A receptors", "NMDA receptors", "Voltage-gated sodium channels", "The α2δ subunit of voltage-gated calcium channels"], "a": 3, "why": "Gabapentinoids bind the α2δ subunit of presynaptic voltage-gated calcium channels and reduce release of excitatory neurotransmitters.", "ref": "Finnerup NB et al. Lancet Neurol 2015;14:162–73", "kw": ["gabapentinoid", "α2δ subunit", "calcium channel", "neurotransmitter release"], "x": ["Despite the name, gabapentinoids are not GABA receptor agonists.", "NMDA antagonism is the mechanism of ketamine (and partly methadone).", "Sodium channel block is the mechanism of local anaesthetics and carbamazepine.", ""]}, {"d": "C", "q": "Features of a myofascial trigger point include all of the following EXCEPT:", "o": ["A hyperirritable spot within a taut band of skeletal muscle", "Referred pain in a dermatomal distribution", "A local twitch response on snapping palpation", "Reproduction of the patient's familiar pain on pressure"], "a": 1, "why": "Trigger points refer pain in characteristic muscle-specific patterns that do not follow dermatomes. Dermatomal pain suggests a radicular source.", "ref": "Simons DG, Travell JG, Simons LS. Myofascial Pain and Dysfunction: The Trigger Point Manual, 2nd ed. 1999", "kw": ["trigger point", "taut band", "local twitch response", "referred pain"], "x": ["The defining feature of a trigger point.", "", "A recognised confirmatory sign.", "A recognised diagnostic feature (recognition of the familiar pain)."]}, {"d": "C", "q": "Patrick's (FABER) test places the hip in:", "o": ["Flexion, adduction and internal rotation", "Extension, abduction and internal rotation", "Flexion, abduction and external rotation", "Flexion, adduction and external rotation"], "a": 2, "why": "FABER = Flexion, ABduction, External Rotation, with pressure on the knee. Groin pain suggests the hip; posterior pain suggests the SIJ. It is one of the SIJ provocation tests (three or more positive tests: sensitivity 91%, specificity 78%).", "ref": "Peng 2020 ch15", "kw": ["FABER", "Patrick test", "SIJ provocation", "hip"], "x": ["This is FADIR, the hip impingement test.", "Not a standard named test.", "", "Not a standard named test."]}, {"d": "S", "q": "Within the cervical intervertebral foramen, the spinal nerve:", "o": ["Occupies the lower part of the foramen, with the epiradicular veins in the upper part", "Occupies the upper part of the foramen, with the veins in the lower part", "Runs through the transverse foramen with the vertebral artery", "Lies medial to the uncinate process within the spinal canal"], "a": 0, "why": "The nerve lies in the lower part of the foramen and the epiradicular veins in the upper part. Radicular arteries run close to the nerve.", "ref": "Narouze 2e ch8; Peng 2020 ch12", "kw": ["intervertebral foramen", "spinal nerve lower", "epiradicular veins", "radicular arteries"], "x": ["", "The positions are reversed.", "The transverse foramen carries the vertebral artery, not the spinal nerve.", "Medial to the uncinate process is inside the canal, before the foramen."]}, {"d": "S", "q": "In the transverse (short-axis) scan for C3–C6 medial branch block, the needle target is:", "o": ["The rounded, less echogenic contour of the zygapophysial joint", "The posterior tubercle of the transverse process", "The lamina–spinous process junction", "The centroid of the articular pillar, seen as a flat hyperechoic line"], "a": 3, "why": "The medial branches lie on the waist (centroid) of the articular pillar, which shows as a flat hyperechoic line between the rounded joints ('valleys' between the 'peaks' on the long-axis view).", "ref": "Peng 2020 ch13", "kw": ["articular pillar", "centroid", "flat hyperechoic line", "peaks and valleys"], "x": ["The joint contour is the TON target at C2–C3 only.", "The posterior tubercle is the landmark for the nerve root (SNRB).", "Too medial; the medial branch is on the pillar, not the lamina.", ""]}, {"d": "S", "q": "The MOST reliable ultrasound method to identify a specific lumbar interspace is to:", "o": ["Palpate Tuffier's line between the iliac crests", "Identify the sacrum (L5–S1 gap) on the paramedian sagittal view and count upwards", "Count down from the 12th rib", "Find the longest transverse process and call it L3"], "a": 1, "why": "The continuous hyperechoic sacrum and the L5–S1 gap are a fixed landmark, so counting up from it is more accurate than palpation.", "ref": "Narouze 2e ch12", "kw": ["level identification", "sacrum", "L5–S1 gap", "count upwards"], "x": ["Tuffier's line is often wrong by one level or more.", "", "The 12th rib is variable and may be rudimentary.", "Transverse process length is not a reliable level marker."]}, {"d": "S", "q": "The sacroiliac joint is reported to be the pain source in up to what proportion of patients with chronic low back pain?", "o": ["5%", "15%", "30%", "60%"], "a": 2, "why": "The SIJ is the cause in up to about 30% of chronic low back pain. Diagnosis rests on provocation tests and controlled diagnostic blocks.", "ref": "Peng 2020 ch15", "kw": ["SIJ pain", "prevalence", "provocation tests", "diagnostic block"], "x": ["Too low.", "Too low.", "", "Overestimates; that figure is nearer the discogenic or facet range."]}, {"d": "P", "q": "The suprascapular nerve provides approximately what share of the sensory supply to the shoulder joint?", "o": ["21–40%", "41–60%", "61–80%", "81–100%"], "a": 2, "why": "About 70%, which is why suprascapular block or RF is effective for shoulder pain. Most of the rest comes from the axillary and lateral pectoral nerves.", "ref": "Peng 2020 ch4", "kw": ["suprascapular nerve", "70%", "shoulder sensory supply", "C5–C6"], "x": ["Underestimates.", "Underestimates.", "", "Overestimates; the axillary and lateral pectoral nerves also contribute."]}, {"d": "P", "q": "Entrapment of the suprascapular nerve at the spinoglenoid notch typically causes:", "o": ["Isolated infraspinatus weakness and atrophy", "Weakness and atrophy of both supraspinatus and infraspinatus", "Deltoid and teres minor weakness", "Sensory loss over the 'regimental badge' area of the lateral arm"], "a": 0, "why": "At the spinoglenoid notch the nerve has already given off its supraspinatus branch, so only infraspinatus is affected, often with little pain.", "ref": "Peng 2020 ch4", "kw": ["spinoglenoid notch", "infraspinatus atrophy", "ganglion / labral cyst", "suprascapular entrapment"], "x": ["", "Both muscles are affected in entrapment at the suprascapular notch.", "Deltoid and teres minor weakness = axillary nerve (quadrilateral space).", "'Regimental badge' sensory loss = axillary nerve."]}, {"d": "P", "q": "Distal to the inguinal ligament, the lateral femoral cutaneous nerve is MOST consistently found:", "o": ["On the surface of iliacus, lateral to the femoral nerve", "Within the femoral sheath", "Deep to gluteus medius", "In a fat-filled groove between tensor fasciae latae and sartorius"], "a": 3, "why": "The LFCN usually exits under the inguinal ligament medial to the ASIS (average 29 mm), crosses superficial to sartorius, then runs in a fatty groove between TFL and sartorius.", "ref": "Peng 2020 ch10", "kw": ["LFCN", "meralgia paresthetica", "TFL–sartorius groove", "ASIS"], "x": ["On iliacus is its course ABOVE the inguinal ligament.", "The femoral sheath contains the femoral vessels, not the LFCN.", "Gluteus medius is posterolateral and unrelated.", ""]}, {"d": "P", "q": "In the adductor canal, the saphenous nerve lies deep to which muscle?", "o": ["Sartorius", "Gracilis", "Rectus femoris", "Adductor longus"], "a": 0, "why": "Sartorius roofs the canal. The nerve runs with the superficial femoral artery, first lateral to it, then medial and superficial distally.", "ref": "Narouze 2e ch20", "kw": ["saphenous nerve", "adductor canal", "sartorius", "superficial femoral artery"], "x": ["", "Gracilis is posteromedial, outside the canal.", "Rectus femoris is anterior and lateral to the canal.", "Adductor longus forms the floor (posterior wall), deep to the nerve."]}, {"d": "P", "q": "At the elbow, an ulnar nerve cross-sectional area greater than which value at the site of maximal enlargement is considered abnormal?", "o": ["5 mm²", "9 mm²", "15 mm²", "20 mm²"], "a": 1, "why": "An ulnar nerve area over 9 mm², or a ratio over 2.8 compared with the proximal nerve, suggests cubital tunnel syndrome. Typically the nerve swells just proximal to the tunnel.", "ref": "Jacobson ch4", "kw": ["ulnar neuropathy", "cross-sectional area", "9 mm²", "ratio 2.8"], "x": ["Within the normal range.", "", "Too high; misses many cases.", "Too high; misses many cases."]}, {"d": "M", "q": "Small glenohumeral joint effusions are MOST readily detected in the:", "o": ["Subacromial-subdeltoid bursa", "Subcoracoid bursa", "Axillary recess", "Long head of biceps tendon sheath"], "a": 3, "why": "The LHB sheath communicates with the GH joint, and even a small effusion collects there. The posterior recess shows small effusions only with external rotation.", "ref": "Jacobson ch3", "kw": ["GH effusion", "LHB tendon sheath", "joint recesses", "posterior recess"], "x": ["The SASD bursa does not normally communicate with the joint (only with a full-thickness cuff tear).", "The subcoracoid bursa does not communicate with the joint.", "The axillary recess is hard to image and fills only with larger effusions.", ""]}, {"d": "M", "q": "All of the following leave the pelvis through the greater sciatic foramen BELOW the piriformis EXCEPT the:", "o": ["Sciatic nerve", "Pudendal nerve", "Inferior gluteal nerve", "Superior gluteal nerve"], "a": 3, "why": "Only the superior gluteal nerve and artery pass ABOVE piriformis. Below it: the sciatic, inferior gluteal, pudendal, posterior femoral cutaneous and obturator internus nerves, and the internal pudendal vessels.", "ref": "Peng 2020 ch8; Narouze 2e piriformis chapter", "kw": ["greater sciatic foramen", "piriformis", "superior gluteal nerve", "infrapiriform structures"], "x": ["Exits below piriformis (in most people).", "Exits below piriformis.", "Exits below piriformis.", ""]}, {"d": "M", "q": "Conventional genicular nerve radiofrequency ablation targets all of the following EXCEPT the:", "o": ["Inferior lateral genicular nerve", "Superior medial genicular nerve", "Superior lateral genicular nerve", "Inferior medial genicular nerve"], "a": 0, "why": "The inferolateral branches are avoided because they lie close to the common fibular (peroneal) nerve. The standard targets are SMGN, SLGN and IMGN, at the junction of shaft and epicondyle/condyle.", "ref": "Peng 2020 ch27", "kw": ["genicular RFA", "SMGN", "SLGN", "IMGN", "common fibular nerve"], "x": ["", "A standard target (with the medial branch of the nerve to vastus intermedius).", "A standard target.", "A standard target with a consistent position."]}, {"d": "M", "q": "In iliotibial band friction syndrome, ultrasound typically shows hypoechoic thickening or fluid:", "o": ["Superficial to the ITB, in the subcutaneous fat", "Deep to the ITB, over the lateral femoral condyle", "Within the popliteus tendon sheath", "At the Gerdy tubercle insertion"], "a": 1, "why": "Friction over the lateral femoral condyle produces oedema or an adventitial bursa between the ITB and the condyle.", "ref": "Jacobson ch7", "kw": ["ITB friction syndrome", "lateral femoral condyle", "deep soft-tissue oedema", "runner's knee"], "x": ["The changes are deep, not superficial, to the band.", "", "The popliteus groove is nearby but not the site of ITB friction.", "Gerdy tubercle changes = distal ITB tendinosis or tear."]}, {"d": "M", "q": "For ultrasound-guided subtalar joint injection, which approach is preferred because it carries the least neurovascular risk?", "o": ["Medial approach, close to the tarsal tunnel", "Anterior approach between extensor hallucis longus and tibialis anterior", "Lateral approach, starting from the sinus tarsi", "Posterior approach through the Achilles tendon"], "a": 2, "why": "The subtalar joint can be entered medially, laterally or posterolaterally. The lateral (sinus tarsi) route keeps away from the tibial neurovascular bundle.", "ref": "Peng 2020 ch24", "kw": ["subtalar joint", "sinus tarsi", "lateral approach", "neurovascular risk"], "x": ["The medial route passes near the tibial nerve and posterior tibial vessels.", "This is the anterior tibiotalar approach (and EHL–TA is near the deep peroneal bundle).", "", "Needling through the Achilles tendon is never the route."]}], "1-4": [{"d": "G", "q": "A 'dirty' acoustic shadow, with superimposed reverberation echoes, is produced by an object with:", "o": ["A small radius of curvature and a rough surface", "A large radius of curvature and a smooth surface", "Fluid content and low attenuation", "Fibrillar structure scanned obliquely"], "a": 1, "why": "Shadow type depends on the reflecting surface: a small radius or rough surface gives a clean shadow; a large radius and smooth surface give a dirty shadow from added reverberation. Gas typically gives a dirty shadow.", "ref": "Jacobson ch1", "kw": ["dirty shadow", "clean shadow", "reverberation", "radius of curvature"], "x": ["This produces a CLEAN shadow.", "", "Fluid gives posterior enhancement, not a shadow.", "This describes anisotropy (false hypoechogenicity), not shadowing."]}, {"d": "G", "q": "During in-plane needle guidance, needle visibility becomes WORSE when:", "o": ["The needle is more parallel to the transducer face", "A larger-gauge needle is used", "The insertion angle is steeper", "Spatial compound imaging is switched on"], "a": 2, "why": "The steeper the needle, the less of the beam is reflected back to the probe, so the needle fades. A shallow approach, a larger needle and compound imaging all improve visibility.", "ref": "Narouze 2e ch3, ch4", "kw": ["needle visibility", "insertion angle", "specular reflection", "compound imaging"], "x": ["A needle parallel to the probe reflects the most sound, so it is seen best.", "A larger gauge gives a bigger impedance change, so it is more visible.", "", "Compound imaging steers beams at several angles and improves needle visibility."]}, {"d": "G", "q": "By convention, a long-axis musculoskeletal ultrasound image is displayed with:", "o": ["The proximal end on the left of the screen and the distal end on the right", "The distal end on the left and the proximal end on the right", "The medial side always on the left, whatever the plane", "The superficial tissues at the bottom of the screen"], "a": 0, "why": "In long axis, proximal is shown on the left and distal on the right. Correct the orientation with the invert button or by turning the probe 180°, and label the image.", "ref": "Jacobson ch1", "kw": ["image orientation", "long axis", "proximal on left", "labelling"], "x": ["", "The reverse of the convention.", "Medial/lateral orientation applies to short-axis (transverse) images, not long axis.", "The skin surface (near field) is always at the top of the image."]}, {"d": "C", "q": "Before lumbar medial branch radiofrequency denervation, which diagnostic result is the BEST predictor of success?", "o": ["A single medial branch block with 50% pain relief", "A good response to one intra-articular steroid injection", "Pain relief after a saline placebo injection", "Concordant relief (≥80%) after separate lidocaine and bupivacaine medial branch blocks"], "a": 3, "why": "Single blocks have a false-positive rate of up to one third. A concordant response to short-acting (lidocaine) and long-acting (bupivacaine) blocks with 80% relief predicts RF success best; intra-articular injection correlates less well.", "ref": "Peng 2020 ch14", "kw": ["comparative blocks", "lidocaine vs bupivacaine", "80% relief", "radiofrequency selection"], "x": ["Single blocks with a low relief threshold give many false positives.", "Intra-articular injections correlate less well with RF outcome.", "Relief after placebo suggests a placebo response, not facet pain.", ""]}, {"d": "C", "q": "Diagnostic features of occipital neuralgia (ICHD-3) include all of the following EXCEPT:", "o": ["Paroxysmal shooting or stabbing pain in the distribution of the greater, lesser or third occipital nerve", "Continuous throbbing pain with photophobia and nausea", "Tenderness or allodynia over the affected nerve branches", "Temporary relief from a local anaesthetic block of the nerve"], "a": 1, "why": "Occipital neuralgia is brief, paroxysmal, shooting pain in an occipital nerve territory, with tenderness over the nerve and relief from a nerve block. Continuous throbbing pain with photophobia and nausea describes migraine.", "ref": "Headache Classification Committee of the IHS. ICHD-3. Cephalalgia 2018;38:1–211", "kw": ["occipital neuralgia", "ICHD-3", "paroxysmal shooting pain", "diagnostic nerve block"], "x": ["A core criterion.", "", "A core criterion (dysaesthesia, allodynia or tenderness).", "A core criterion (temporary relief by anaesthetic block)."]}, {"d": "C", "q": "The Nantes criteria for pudendal neuralgia include all of the following EXCEPT:", "o": ["Pain that wakes the patient from sleep", "Pain in the territory of the pudendal nerve", "Pain worsened by sitting", "Pain relieved by an anaesthetic pudendal nerve block"], "a": 0, "why": "The five essential criteria: pain in the pudendal territory, worse on sitting, the patient is NOT woken at night by the pain, no objective sensory loss, and relief from a pudendal block.", "ref": "Labat JJ et al. Neurourol Urodyn 2008;27:306–10", "kw": ["pudendal neuralgia", "Nantes criteria", "sitting pain", "diagnostic block"], "x": ["", "An essential criterion.", "An essential criterion.", "An essential criterion."]}, {"d": "S", "q": "The posterior boundary of the thoracic paravertebral space is formed by the:", "o": ["Parietal pleura", "Vertebral body and intervertebral disc", "Superior costotransverse ligament", "Erector spinae muscle"], "a": 2, "why": "The wedge-shaped TPVS is bounded anterolaterally by the parietal pleura, posteriorly by the superior costotransverse ligament, and medially by the vertebral body, disc and foramen.", "ref": "Narouze 2e ch9", "kw": ["thoracic paravertebral space", "superior costotransverse ligament", "parietal pleura", "pneumothorax"], "x": ["The pleura is the ANTEROLATERAL boundary.", "The vertebral body and disc form the MEDIAL boundary.", "", "Erector spinae lies superficial to the transverse process (ESP block plane), outside the TPVS."]}, {"d": "S", "q": "The false-positive rate of a single diagnostic lumbar medial branch block is reported to be up to:", "o": ["0–20%", "21–40%", "41–60%", "61–80%"], "a": 1, "why": "Up to one third of single blocks are false positive. This is why repeated (comparative) low-volume blocks of 1 mL or less are recommended before RF.", "ref": "Peng 2020 ch14", "kw": ["single block", "false positive", "one third", "low volume ≤1 mL"], "x": ["Underestimates.", "", "Overestimates.", "Overestimates."]}, {"d": "S", "q": "In the randomised trial by Jee et al. comparing ultrasound- and fluoroscopy-guided sacroiliac joint injection, ultrasound guidance gave:", "o": ["Higher accuracy and better pain outcomes", "Equal accuracy (about 98%) and equal outcomes", "Lower accuracy and worse pain outcomes", "Lower accuracy (about 87% vs 98%) but similar pain and disability at 3 months"], "a": 3, "why": "Accuracy was 87.3% with US vs 98.2% with fluoroscopy, with no difference in pain or disability over 3 months. Soneji et al. also found less intra-articular spread with US (50% vs 65%, not significant).", "ref": "Peng 2020 ch15", "kw": ["SIJ injection", "US vs fluoroscopy", "accuracy 87% vs 98%", "similar outcomes"], "x": ["Accuracy was lower, not higher, with US.", "Accuracy was lower with US.", "Pain and disability outcomes were similar.", ""]}, {"d": "S", "q": "The sacral hiatus contains all of the following EXCEPT the:", "o": ["Lower sacral and coccygeal nerve roots", "Filum terminale externum", "Dural (thecal) sac", "Fibro-fatty tissue"], "a": 2, "why": "The hiatus (S4–S5 fusion defect) contains the lower sacral and coccygeal roots, the filum terminale externum and fat. The thecal sac ends higher: around the lower border of the S1 foramen in adults (down to S3 in children).", "ref": "Peng 2020 ch17", "kw": ["sacral hiatus contents", "thecal sac ends ~S1–S2", "filum terminale", "dural puncture risk"], "x": ["These roots do pass through the hiatus.", "The filum terminale externum is present.", "", "Fibro-fatty tissue fills the hiatus."]}, {"d": "P", "q": "Compared with the distal approach at the superior nuchal line, the proximal ultrasound-guided greater occipital nerve block at C2:", "o": ["Had a higher success rate in a cadaver study", "Is less accurate because the nerve is deeper", "Has been proven superior in randomised clinical trials", "Has a higher rate of vertebral artery puncture"], "a": 0, "why": "A cadaver study showed higher success with the proximal (obliquus capitis inferior) approach, and case series support its safety. No clinical trial has yet compared the two US approaches.", "ref": "Peng 2020 ch2", "kw": ["GON block", "proximal vs distal", "cadaver success", "obliquus capitis inferior"], "x": ["", "The proximal approach is more precise, not less.", "No RCT has compared the two US-guided approaches.", "No such finding; the target plane is superficial to OCI, away from the vertebral artery."]}, {"d": "P", "q": "Ulnar nerve dislocation over the medial epicondyle during elbow flexion has been described in up to what proportion of ASYMPTOMATIC people?", "o": ["5%", "20%", "40%", "60%"], "a": 1, "why": "Up to 20% of asymptomatic people show it, so interpret it with symptoms. Avoid heavy probe pressure in the dynamic test, and distinguish it from snapping triceps (the medial head also subluxes).", "ref": "Jacobson ch4", "kw": ["ulnar nerve dislocation", "dynamic scan", "elbow flexion", "snapping triceps"], "x": ["Underestimates.", "", "Overestimates.", "Overestimates."]}, {"d": "P", "q": "To relieve pain in a single thoracic dermatome with intercostal nerve block, you should block:", "o": ["Only the nerve at that level", "That level and the level above", "That level and the level below", "That level and the levels above and below"], "a": 3, "why": "Adjacent intercostal nerves overlap, so the levels above and below must also be blocked.", "ref": "Peng 2020 ch5", "kw": ["intercostal block", "dermatomal overlap", "level above and below"], "x": ["Incomplete because of overlap from adjacent nerves.", "Misses the overlap from below.", "Misses the overlap from above.", ""]}, {"d": "P", "q": "The skin over the femoral triangle is supplied by the:", "o": ["Ilioinguinal nerve", "Genital branch of the genitofemoral nerve", "Femoral branch of the genitofemoral nerve", "Lateral femoral cutaneous nerve"], "a": 2, "why": "The femoral branch of the GFN passes below the inguinal ligament to supply the skin over the femoral triangle. The genital branch runs in the inguinal canal (cremaster, scrotum/labia).", "ref": "Peng 2020 ch7", "kw": ["genitofemoral nerve", "femoral branch", "femoral triangle", "inguinal pain"], "x": ["The ilioinguinal nerve supplies the upper medial thigh and the root of the genitalia.", "The genital branch runs through the inguinal canal to the cremaster and genital skin.", "", "The LFCN supplies the anterolateral thigh."]}, {"d": "P", "q": "At the level of the ischial spine, the internal pudendal artery MOST often lies:", "o": ["Lateral to the pudendal nerve", "Medial to the pudendal nerve", "Deep to the sacrospinous ligament, inside the pelvis", "Superficial to the sacrotuberous ligament"], "a": 0, "why": "In the interligamentous plane the artery is lateral to the nerve in about 90%. Find the artery with Doppler and inject just medial to it.", "ref": "Narouze 2e ch17", "kw": ["pudendal nerve", "internal pudendal artery", "Doppler landmark", "interligamentous plane"], "x": ["", "The nerve, not the artery, is usually medial.", "Both lie between the ligaments at this level, not inside the pelvis.", "Superficial to the sacrotuberous ligament is gluteus maximus."]}, {"d": "M", "q": "A Baker cyst communicates with the knee joint through a neck between the:", "o": ["Semitendinosus and gracilis tendons", "Biceps femoris and the lateral head of gastrocnemius", "Popliteus and the lateral head of gastrocnemius", "Semimembranosus tendon and the medial head of gastrocnemius"], "a": 3, "why": "Diagnosis rests on seeing the neck between semimembranosus and the medial gastrocnemius tendon. The cyst wraps around the medial head in a C shape.", "ref": "Jacobson ch7", "kw": ["Baker cyst", "semimembranosus", "medial gastrocnemius", "communicating neck"], "x": ["These are pes anserinus tendons (anteromedial), not the cyst neck.", "These are posterolateral structures.", "These are posterolateral structures.", ""]}, {"d": "M", "q": "In greater trochanteric pain syndrome, ultrasound MOST commonly shows:", "o": ["A distended, inflamed trochanteric bursa as the primary cause", "A hip joint effusion", "Gluteus medius and/or minimus tendinopathy, with true bursitis being rare", "Iliopsoas bursitis"], "a": 2, "why": "GTPS is usually a gluteal tendinopathy (tendinosis or tear). A primary distended bursa is uncommon, so assess the gluteal tendons first.", "ref": "Jacobson ch6", "kw": ["GTPS", "gluteal tendinopathy", "bursitis rare", "gluteus medius tear"], "x": ["Primary bursitis is rare in GTPS.", "A joint effusion points to an intra-articular cause, not GTPS.", "", "Iliopsoas bursitis causes anterior groin pain."]}, {"d": "M", "q": "The MOST sensitive location for detecting an elbow joint effusion with ultrasound is the:", "o": ["Posterior olecranon recess, with the elbow flexed", "Anterior recess, with the elbow fully extended", "Annular recess around the radial neck", "Olecranon bursa"], "a": 0, "why": "With the elbow flexed, fluid moves into the posterior olecranon recess and lifts the posterior fat pad.", "ref": "Jacobson ch4", "kw": ["elbow effusion", "posterior olecranon recess", "elbow flexion", "fat pad"], "x": ["", "The anterior recess may distend but is less sensitive.", "The annular recess distends less often.", "The olecranon bursa is superficial and does not communicate with the joint."]}, {"d": "M", "q": "Apart from a full-thickness tear, when the long head of biceps tendon is not seen in the bicipital groove it is MOST likely:", "o": ["Dislocated laterally over the greater tuberosity", "Subluxed into the subacromial-subdeltoid bursa", "Trapped inside the joint beneath supraspinatus", "Subluxed or dislocated medially over the lesser tuberosity, often with a subscapularis tear"], "a": 3, "why": "The LHB displaces medially. Dynamic external rotation can show subluxation; a dislocated tendon may relocate with internal rotation, with a painful snap.", "ref": "Jacobson ch3", "kw": ["LHB subluxation", "medial dislocation", "lesser tuberosity", "dynamic external rotation"], "x": ["The LHB does not dislocate laterally.", "Not the recognised pattern.", "An intra-articular dislocation can occur with cuff tears, but the usual finding is medial displacement.", ""]}, {"d": "M", "q": "On ultrasound of the first metatarsophalangeal joint, the 'double contour sign' indicates:", "o": ["The normal hyperechoic cartilage interface", "Monosodium urate deposition on the cartilage surface (gout)", "Calcium pyrophosphate crystals within the cartilage", "Osteoarthritic osteophytes"], "a": 1, "why": "Urate 'icing' on the hyaline cartilage surface parallels the bone contour. The normal interface is thin, uniform and visible only when the beam is perpendicular.", "ref": "Jacobson ch2", "kw": ["double contour sign", "gout", "urate icing", "1st MTP"], "x": ["The normal interface is uniform and seen only with a perpendicular beam.", "", "CPPD crystals lie WITHIN the cartilage (chondrocalcinosis).", "Osteophytes are bony excrescences at the joint margin."]}], "1-5": [{"d": "G", "q": "Time gain compensation (TGC) is used to:", "o": ["Increase the transmitted acoustic power", "Selectively amplify weaker echoes returning from deeper tissue", "Change the transducer frequency", "Increase the frame rate"], "a": 1, "why": "Deeper echoes are weakened by attenuation. TGC boosts them by depth, whereas overall gain brightens everything, including noise.", "ref": "Peng 2020 ch1", "kw": ["TGC", "depth-dependent gain", "attenuation", "overall gain"], "x": ["Gain and TGC amplify only the RETURNING signal, not the transmitted one.", "", "Frequency is set by the transducer and preset, not by TGC.", "Frame rate is set by depth, focal zones and sector width."]}, {"d": "G", "q": "By convention on colour Doppler, red indicates:", "o": ["Flow towards the transducer", "Flow away from the transducer", "Arterial flow, whatever its direction", "High-velocity flow only"], "a": 0, "why": "Colour Doppler codes direction relative to the probe: red = towards, blue = away. Colour does not identify artery or vein.", "ref": "Jacobson ch1", "kw": ["colour Doppler", "red towards", "blue away", "direction"], "x": ["", "Flow away from the probe is shown in blue.", "Colour shows direction, not vessel type; check arteries with pulsed Doppler or pulsatility.", "Velocity is shown by colour brightness or scale, and aliasing can confuse it."]}, {"d": "G", "q": "The 'PART' transducer manoeuvres include all of the following EXCEPT:", "o": ["Pressure", "Alignment", "Rotation", "Depth"], "a": 3, "why": "PART = Pressure, Alignment (sliding), Rotation and Tilting. Depth is a machine setting, not a probe manoeuvre.", "ref": "Peng 2020 ch1", "kw": ["PART", "pressure", "alignment", "rotation", "tilting"], "x": ["P = Pressure.", "A = Alignment (sliding).", "R = Rotation.", ""]}, {"d": "C", "q": "Against controlled comparative SIJ blocks, how many positive provocation tests give a sensitivity of 91% and specificity of 78%?", "o": ["One", "Two", "Three or more", "All six"], "a": 2, "why": "Three or more positive tests (distraction, compression, thigh thrust, Gaenslen's, sacral thrust, FABER) predict SIJ pain with about 91% sensitivity and 78% specificity.", "ref": "Peng 2020 ch15", "kw": ["SIJ provocation", "three or more tests", "sensitivity 91%", "specificity 78%"], "x": ["A single positive test is not specific enough.", "Two tests is below the validated threshold.", "", "Requiring all six would lower sensitivity; it is not the cluster rule."]}, {"d": "C", "q": "A meta-analysis of greater occipital nerve block in migraine showed:", "o": ["A reduction in headache duration only", "Reduced pain intensity and medication use, but no effect on headache duration", "No benefit beyond the duration of the local anaesthetic", "Benefit in cluster headache but not in migraine"], "a": 1, "why": "GON blocks reduced pain intensity and medication use in migraine without changing headache duration. Effects outlast the local anaesthetic, and both episodic and chronic cluster attacks are suppressed.", "ref": "Peng 2020 ch2", "kw": ["GON block", "migraine", "meta-analysis", "cluster headache"], "x": ["Duration was the outcome NOT affected.", "", "Trials consistently show effects outlasting the local anaesthetic and steroid.", "Benefit is seen in both migraine and cluster headache."]}, {"d": "C", "q": "The reported lifetime prevalence of shoulder pain is:", "o": ["21–40%", "41–60%", "61–80%", "81–100%"], "a": 2, "why": "About 70%. Shoulder pain often improves with conservative care (activity modification, physiotherapy).", "ref": "Peng 2020 ch19", "kw": ["shoulder pain", "lifetime prevalence", "70%", "conservative care"], "x": ["Underestimates.", "Underestimates.", "", "Overestimates."]}, {"d": "S", "q": "For a C7 medial branch block, the ultrasound target is:", "o": ["The C7 superior articular process, just cephalad to the C7 transverse process", "The centroid of the C7 articular pillar, as at C3–C6", "The posterior tubercle of the C7 transverse process", "The C7–T1 zygapophysial joint line"], "a": 0, "why": "At C7 the medial branch crosses the SAP just above the transverse process, so the small hyperechoic C7 SAP line is targeted. The C7 TP (no anterior tubercle) is the reference.", "ref": "Peng 2020 ch13", "kw": ["C7 medial branch", "C7 SAP", "C7 transverse process", "level reference"], "x": ["", "The centroid of the pillar is the C3–C6 target, not C7.", "The posterior tubercle is a nerve-root landmark.", "The joint line is not the C7 medial branch target."]}, {"d": "S", "q": "In Narouze's pilot study of ultrasound-guided cervical nerve root injection (10 patients, fluoroscopy as control), the key safety finding was that:", "o": ["No vessels were seen near the foramen", "Ultrasound needle positions were more than 1 cm from the fluoroscopic target in most patients", "The vertebral artery was punctured in two patients", "Critical vessels lay at the posterior foramen in two patients, where a correctly placed fluoroscopic needle could have injured them"], "a": 3, "why": "US showed vessels at the anterior foramen in four patients and critical vessels at the posterior foramen in two (one likely a segmental feeder). All needles were within 3 mm of the target on the oblique view.", "ref": "Peng 2020 ch12", "kw": ["Narouze pilot", "radicular vessels", "posterior foramen", "segmental feeder"], "x": ["Vessels were seen in several patients.", "Needles were within 3 mm (oblique) and 5 mm of the target.", "No vertebral artery puncture was reported.", ""]}, {"d": "S", "q": "Ultrasound guidance for caudal epidural needle placement has been reported to achieve an accuracy of up to:", "o": ["21–40%", "41–60%", "61–80%", "81–100%"], "a": 3, "why": "Up to 100% accuracy (Chen 2004). US also helps avoid vascular injection and reduces needle passes.", "ref": "Peng 2020 ch17; Chen CP et al. Anesthesiology 2004;101:181–4", "kw": ["caudal epidural", "US accuracy", "up to 100%", "fewer needle passes"], "x": ["Far too low.", "Far too low.", "Too low; nearer the accuracy of blind techniques.", ""]}, {"d": "S", "q": "The optimal sagittal ultrasound axis for imaging the thoracic paravertebral space is:", "o": ["Transverse over the spinous process", "Paramedian sagittal oblique, with the probe tilted slightly laterally", "Midline sagittal over the spinous processes", "Coronal over the posterior ribs"], "a": 1, "why": "Tilting the paramedian sagittal probe laterally avoids the transverse processes and makes the beam more perpendicular to the pleura. Only the apical part of the space is seen.", "ref": "Narouze 2e ch9", "kw": ["thoracic paravertebral", "paramedian sagittal oblique", "pleura", "SCTL"], "x": ["A transverse view over the spinous process does not show the TPVS.", "", "A midline view shows the spinous processes and interspinous ligament only.", "Not the described axis."]}, {"d": "P", "q": "The lateral femoral cutaneous nerve emerges under the inguinal ligament on average how far medial to the ASIS?", "o": ["5 mm", "15 mm", "29 mm", "60 mm"], "a": 2, "why": "On average 29 mm (range 0–73 mm). It may run over or through the ligament in up to 28%, and over or behind the ASIS in 4–29%, so scan, don't palpate.", "ref": "Peng 2020 ch10", "kw": ["LFCN", "29 mm medial to ASIS", "anatomical variation", "meralgia paresthetica"], "x": ["Too close to the ASIS.", "Too close to the ASIS.", "", "Too far; within the range but not the average."]}, {"d": "P", "q": "At the level of the ischial spine, what proportion of pudendal nerves have two or three trunks?", "o": ["0–20%", "21–40%", "41–60%", "61–80%"], "a": 1, "why": "30–40%, which partly explains incomplete blocks and supports a volume that spreads across the interligamentous plane.", "ref": "Narouze 2e ch17", "kw": ["pudendal nerve", "multiple trunks", "30–40%", "interligamentous plane"], "x": ["Underestimates.", "", "Overestimates.", "Overestimates."]}, {"d": "P", "q": "The iliohypogastric and ilioinguinal nerves arise as a single trunk from the ventral ramus of:", "o": ["L1", "T10", "L2–L3", "S2–S4"], "a": 0, "why": "They arise together from L1 (with a T12 contribution to the plexus), emerge lateral to psoas and pass anterior to quadratus lumborum. Their course matches the classic textbook description in only 42% of dissections.", "ref": "Peng 2020 ch6", "kw": ["iliohypogastric", "ilioinguinal", "L1", "anatomical variation"], "x": ["", "T10 is a thoracoabdominal (intercostal) nerve.", "L2–L3 contribute to the genitofemoral, LFCN and femoral nerves.", "S2–S4 form the pudendal nerve."]}, {"d": "P", "q": "As a single measurement, a median nerve cross-sectional area above which value indicates carpal tunnel syndrome (with under 6 mm² usually excluding it)?", "o": ["6 mm²", "8 mm²", "10 mm²", "12 mm²"], "a": 3, "why": "Under 6 mm² usually excludes CTS and over 12 mm² indicates it, with a grey zone in between. A proximal-to-distal increase of more than 2 mm² is more accurate.", "ref": "Jacobson ch5", "kw": ["median nerve CSA", "12 mm²", "6 mm²", "grey zone"], "x": ["Under 6 mm² is the value that EXCLUDES CTS.", "Within the grey zone.", "Within the grey zone in this scheme.", ""]}, {"d": "P", "q": "The suprascapular nerve arises from the:", "o": ["Posterior cord of the brachial plexus", "Lateral cord of the brachial plexus", "Upper trunk (C5–C6, with a C4 contribution)", "Middle trunk (C7)"], "a": 2, "why": "It comes from the upper trunk (C4–C6 ventral rami), passes under the transverse scapular ligament through the notch, and supplies supraspinatus, infraspinatus, and the GH and AC joints.", "ref": "Peng 2020 ch4", "kw": ["suprascapular nerve", "upper trunk", "C5–C6", "supraspinatus / infraspinatus"], "x": ["The posterior cord gives the axillary and radial nerves.", "The lateral cord gives the musculocutaneous and lateral pectoral nerves.", "", "The middle trunk (C7) does not give the suprascapular nerve."]}, {"d": "M", "q": "Regarding gluteal tendon tears on ultrasound:", "o": ["Gluteus medius tears are more common than gluteus minimus tears", "Gluteus minimus tears are more common than gluteus medius tears", "Ultrasound sensitivity for gluteal tendon tears is below 50%", "Fluid in the bursa excludes a tendon tear"], "a": 0, "why": "Gluteus medius tears are more common than minimus tears and are often accompanied by a bursal abnormality. Ultrasound sensitivity for tears is 79–100%.", "ref": "Jacobson ch6", "kw": ["gluteus medius tear", "gluteus minimus", "US sensitivity 79–100%", "bursal fluid"], "x": ["", "The reverse is true.", "Reported sensitivity is 79–100%.", "Bursal fluid often ACCOMPANIES a tear."]}, {"d": "M", "q": "In the superomedial knee, which articular branch, besides the superior medial genicular nerve, lies close to the anteromedial periosteum and is suitable for conventional RFA?", "o": ["Saphenous nerve", "Medial branch of the nerve to vastus intermedius", "Nerve to vastus lateralis", "Common fibular nerve"], "a": 1, "why": "Of the superomedial branches, only the SMGN and the medial branch of the nerve to vastus intermedius run close to the anteromedial periosteum, so conventional RF can reach them.", "ref": "Peng 2020 ch27", "kw": ["superomedial quadrant", "nerve to vastus intermedius", "SMGN", "periosteal target"], "x": ["The saphenous nerve does not consistently supply the joint and is not periosteal.", "", "The nerve to vastus lateralis is a superolateral structure.", "The common fibular nerve is a structure to AVOID (inferolateral)."]}, {"d": "M", "q": "A recognised pitfall during anterior tibiotalar joint injection is:", "o": ["Injecting into the deltoid ligament", "Injecting into the Achilles tendon", "Injectate collecting in the anterior fat pad instead of the joint", "Injecting the posterior recess by mistake"], "a": 2, "why": "The anterior recess is covered by a fat pad. Confirm intra-articular spread and that the injectate is not pooling in the fat.", "ref": "Peng 2020 ch24", "kw": ["tibiotalar injection", "anterior fat pad", "intra-articular spread", "anterior recess"], "x": ["The deltoid ligament is medial, away from the anterior approach.", "The Achilles tendon is posterior.", "", "An anterior approach does not reach the posterior recess."]}, {"d": "M", "q": "In the randomised trial by Coombes et al. in lateral epicondylalgia, corticosteroid injection compared with no corticosteroid resulted in:", "o": ["Higher rates of complete recovery at 1 year", "No difference at any time point", "Better outcomes at both 6 weeks and 1 year", "Lower rates of complete recovery at 1 year (83% vs 96%)"], "a": 3, "why": "Steroid gave a lower 1-year complete recovery rate. Biological options (needling with leukocyte-rich PRP) showed better 6-month success than needling with bupivacaine (84% vs 68%) in Mishra's RCT.", "ref": "Peng 2020 ch20; Coombes BK et al. JAMA 2013;309:461–9", "kw": ["lateral epicondylalgia", "corticosteroid", "worse 1-year outcome", "PRP"], "x": ["The opposite: steroid gave LOWER 1-year recovery.", "There was a difference at 1 year.", "Long-term outcome was worse with steroid.", ""]}, {"d": "M", "q": "All of the following are true of the piriformis muscle EXCEPT:", "o": ["It inserts into the lesser trochanter", "It originates from the ventral surface of S2–S4", "It leaves the pelvis through the greater sciatic foramen", "The superior gluteal nerve and artery pass above it"], "a": 0, "why": "Piriformis arises from the ventral S2–S4 sacrum, passes through the greater sciatic foramen and inserts into the UPPER BORDER OF THE GREATER TROCHANTER by a round tendon. The lesser trochanter receives iliopsoas.", "ref": "Peng 2020 ch8", "kw": ["piriformis", "S2–S4 origin", "greater trochanter insertion", "greater sciatic foramen"], "x": ["", "True: origin from the ventral S2–S4 sacrum.", "True: it exits through the greater sciatic foramen.", "True: the superior gluteal neurovascular bundle is suprapiriform."]}], "2-1": [{"d": "G", "q": "Recommended practice for sterile ultrasound-guided injections includes all of the following EXCEPT:", "o": ["A sterile transducer cover with sterile gel", "Chlorhexidine skin preparation", "Applying alcohol- or iodine-containing preparations directly to the transducer face", "A sterile drape and sterile gloves"], "a": 2, "why": "Manufacturers warn that alcohol- or iodine-containing products can damage or discolour the transducer. Use a sterile cover with gel, chlorhexidine skin prep, and drape and gloves.", "ref": "Narouze 2e ch26", "kw": ["transducer care", "sterile cover", "chlorhexidine", "iodine/alcohol"], "x": ["Recommended: a sterile cover with sterile gel keeps the field sterile.", "Recommended skin preparation.", "", "Recommended sterile technique."]}, {"d": "G", "q": "In tissue harmonic imaging, the 'harmonic' frequencies are:", "o": ["Integral multiples of the transmitted frequency", "Half the transmitted frequency", "Random frequencies produced by speckle", "The Doppler shift frequencies"], "a": 0, "why": "Tissue generates harmonics (multiples of the transmitted frequency). Listening to them improves resolution and reduces artefact, along with spatial compound imaging.", "ref": "Narouze 2e ch2", "kw": ["tissue harmonic imaging", "integral multiples", "image resolution", "artefact reduction"], "x": ["", "Harmonics are multiples, not fractions (sub-harmonics are a different concept).", "Speckle is interference noise, not harmonic signal.", "The Doppler shift comes from moving reflectors, not from harmonics."]}, {"d": "G", "q": "Before a caudal epidural injection, excess chlorhexidine should be removed or allowed to dry completely in order to:", "o": ["Improve needle visibility", "Avoid gel contamination", "Prevent damage to the transducer", "Avoid carrying the solution into the epidural space, which may cause arachnoiditis"], "a": 3, "why": "Prep solution tracked into the sacral canal can cause arachnoiditis, so remove the excess or let it dry fully before the needle goes in.", "ref": "Peng 2020 ch17", "kw": ["caudal epidural", "chlorhexidine", "arachnoiditis", "let prep dry"], "x": ["Prep solution has no effect on needle visibility.", "Gel contamination is not the concern here.", "Probe protection is about direct contact with alcohol or iodine, not drying time.", ""]}, {"d": "C", "q": "The capsaicin 8% patch acts on which receptor?", "o": ["Voltage-gated sodium channels", "TRPV1", "The α2δ subunit of calcium channels", "NMDA receptors"], "a": 1, "why": "High-concentration capsaicin is a TRPV1 agonist that defunctionalises nociceptive fibres. It is a second-line NeuPSIG treatment for peripheral neuropathic pain.", "ref": "Finnerup NB et al. Lancet Neurol 2015;14:162–73", "kw": ["capsaicin 8%", "TRPV1", "defunctionalisation", "second line"], "x": ["Sodium channel block = lidocaine patch, carbamazepine.", "", "α2δ = gabapentin and pregabalin.", "NMDA antagonism = ketamine."]}, {"d": "C", "q": "In the ICD-11 classification, chronic pain is pain that persists or recurs for longer than:", "o": ["1 month", "6 weeks", "3 months", "6 months"], "a": 2, "why": "ICD-11 defines chronic pain as lasting or recurring for more than 3 months, and separates chronic primary from chronic secondary pain.", "ref": "Treede RD et al. Pain 2019;160:19–27", "kw": ["ICD-11", "chronic pain", "3 months", "primary vs secondary"], "x": ["Too short.", "Too short; this is closer to subacute.", "", "Older definitions sometimes used 6 months; ICD-11 uses 3."]}, {"d": "C", "q": "Which morphine metabolite is neuroexcitatory (myoclonus, hyperalgesia) and accumulates in renal failure?", "o": ["Morphine-3-glucuronide", "Morphine-6-glucuronide", "Normeperidine", "Codeine"], "a": 0, "why": "M3G has no analgesic activity but is neuroexcitatory. M6G is an active analgesic that causes sedation and respiratory depression when it accumulates.", "ref": "Smith MT. Clin Exp Pharmacol Physiol 2000;27:524–8", "kw": ["morphine-3-glucuronide", "neuroexcitation", "renal failure", "opioid metabolites"], "x": ["", "M6G is analgesic; its accumulation causes sedation and respiratory depression.", "Normeperidine is pethidine's neurotoxic metabolite, not morphine's.", "Codeine is a prodrug of morphine, not a metabolite."]}, {"d": "S", "q": "For transforaminal injection, which level is singled out as critical because it lies in the territory of the great segmental medullary artery (of Adamkiewicz)?", "o": ["Right C5–C6", "Left C7", "Right L5", "Left T11–T12"], "a": 3, "why": "The artery of Adamkiewicz most often enters on the left at the lower thoracic levels. Here, digital subtraction angiography is advised to detect vascular uptake.", "ref": "Narouze 2e ch1", "kw": ["artery of Adamkiewicz", "left T11–T12", "transforaminal", "digital subtraction"], "x": ["The cervical radicular arteries are a separate concern.", "Not the territory of the great segmental medullary artery.", "Not the classic level; the artery usually enters lower thoracic, on the left.", ""]}, {"d": "S", "q": "The MOST significant drawback of ultrasound compared with fluoroscopy for transforaminal and nerve root injections is:", "o": ["It cannot show any vessels near the foramen", "No contrast control to detect intravascular or intraforaminal spread", "Radiation exposure to the operator", "The cost of the equipment"], "a": 1, "why": "Ultrasound shows extraforaminal vessels with Doppler, but without contrast it cannot detect intravascular injection or confirm epidural spread.", "ref": "Narouze 2e ch1", "kw": ["transforaminal", "contrast control", "intravascular injection", "fluoroscopy vs US"], "x": ["Doppler does show extraforaminal vessels; that is an advantage of US.", "", "Ultrasound has no radiation.", "Cost favours ultrasound."]}, {"d": "S", "q": "On the long-axis (coronal) scan of the cervical articular pillars, the C2–C3 joint is identified by:", "o": ["The drop-off from the sloping C2 inferior articular process, with the vertebral artery visible cephalad to it", "The absence of an anterior tubercle", "The largest transverse process in the neck", "The C1 posterior arch lying directly caudal to it"], "a": 0, "why": "Above C2–C3, the slope of the C2 inferior articular process creates a characteristic drop-off, with the vertebral artery just above. Count downwards from there to the medial branch levels (C3, C4, C5).", "ref": "Peng 2020 ch13", "kw": ["C2–C3 joint", "C2 IAP drop-off", "vertebral artery", "level counting"], "x": ["", "No anterior tubercle identifies C7.", "Transverse process size is not used to identify C2–C3.", "C1 is cephalad, not caudal, to C2."]}, {"d": "S", "q": "After caudal epidural injection, pain at the hiatus entry site, when present, may last up to:", "o": ["24 hours", "1 week", "6 months", "Permanently in most patients"], "a": 2, "why": "Entry-site pain at the sacral hiatus may persist for up to 6 months. Warn patients about it as part of consent.", "ref": "Peng 2020 ch17", "kw": ["caudal epidural", "entry-site pain", "up to 6 months", "consent"], "x": ["Underestimates.", "Underestimates.", "", "Not permanent in most patients."]}, {"d": "P", "q": "An ultrasound-guided saphenous nerve block in the distal adductor canal is performed:", "o": ["At the apex of the femoral triangle", "At the medial knee joint line", "At the medial malleolus", "2–3 cm proximal to the adductor hiatus, where the femoral artery dives posteriorly to become the popliteal artery"], "a": 3, "why": "Follow the femoral artery caudally until it dives towards the back of the thigh (the adductor hiatus), then move 2–3 cm proximally to the distal canal and block the nerve there.", "ref": "Narouze 2e ch20", "kw": ["saphenous nerve", "distal adductor canal", "adductor hiatus", "femoral → popliteal artery"], "x": ["The femoral triangle apex is the proximal (adductor canal entry) site, not the distal canal.", "At the knee the nerve is subcutaneous and paravenous, a different technique.", "At the ankle, only the terminal sensory branch is left.", ""]}, {"d": "P", "q": "All of the following nerves lie SUBCUTANEOUSLY at the level of the malleoli EXCEPT the:", "o": ["Saphenous nerve", "Posterior tibial nerve", "Superficial peroneal nerve", "Sural nerve"], "a": 1, "why": "The posterior tibial nerve (with the deep peroneal) lies deep: under the flexor retinaculum with the posterior tibial artery behind the medial malleolus. It supplies the sole.", "ref": "Narouze 2e ch20", "kw": ["ankle block", "posterior tibial nerve", "flexor retinaculum", "sole of foot"], "x": ["Subcutaneous, medial ankle.", "", "Subcutaneous, dorsum of foot.", "Subcutaneous, lateral foot."]}, {"d": "P", "q": "The more commonly used ultrasound approach for suprascapular nerve block targets the nerve:", "o": ["In the supraspinous fossa (posterior, distal approach)", "In the supraclavicular region near the upper trunk (anterior, proximal approach)", "At the spinoglenoid notch only", "In the axilla"], "a": 0, "why": "The posterior approach targets the nerve on the floor of the supraspinous fossa under supraspinatus. The anterior (proximal) approach near the upper trunk is used less often.", "ref": "Peng 2020 ch4", "kw": ["suprascapular block", "posterior approach", "supraspinous fossa", "anterior approach"], "x": ["", "This is the less commonly used anterior approach.", "Blocking only at the spinoglenoid notch misses the supraspinatus branch.", "The suprascapular nerve does not pass through the axilla."]}, {"d": "P", "q": "In adhesive capsulitis, pulsed radiofrequency of the suprascapular nerve:", "o": ["Replaces the need for physiotherapy", "Is contraindicated", "Combined with physiotherapy, accelerates recovery", "Is used only as a diagnostic test"], "a": 2, "why": "PRF of the suprascapular nerve together with physiotherapy has been shown to speed recovery from adhesive capsulitis. The nerve carries about 70% of the shoulder's sensory supply.", "ref": "Peng 2020 ch4", "kw": ["pulsed RF", "suprascapular nerve", "adhesive capsulitis", "physiotherapy"], "x": ["The evidence is for PRF COMBINED with physiotherapy.", "Not contraindicated.", "", "PRF is a therapeutic, not diagnostic, intervention."]}, {"d": "P", "q": "The subcostal (T12) nerve differs from the other intercostal nerves because it:", "o": ["Runs in the subcostal groove of the 12th rib along its whole course", "Is purely motor", "Arises from the L1 ventral ramus", "Does not run closely in the groove of its rib, and supplies the lower abdominal wall"], "a": 3, "why": "The subcostal nerve is the anterior ramus of T12. It is not closely related to the 12th rib, so rib-based landmarks are unreliable.", "ref": "Peng 2020 ch5", "kw": ["subcostal nerve", "T12", "not in rib groove", "lower abdominal wall"], "x": ["The opposite: it does NOT follow the rib groove closely.", "It is mixed, with sensory supply to the lower abdominal wall.", "It is the T12 anterior ramus; L1 gives the iliohypogastric and ilioinguinal nerves.", ""]}, {"d": "M", "q": "The 'geyser sign' on shoulder ultrasound describes:", "o": ["Widening of the AC joint after trauma", "Glenohumeral fluid tracking through a massive cuff tear and the AC joint, forming a cyst over the AC joint", "A long head of biceps sheath effusion", "Fluid in the SASD bursa after steroid injection"], "a": 1, "why": "In a chronic massive supraspinatus tear, joint fluid escapes upwards through the AC joint and forms a cyst over it.", "ref": "Jacobson ch3", "kw": ["geyser sign", "massive cuff tear", "AC joint cyst", "glenohumeral fluid"], "x": ["Post-traumatic widening is AC separation.", "", "LHB sheath fluid reflects a joint effusion, not the geyser sign.", "Not the geyser sign."]}, {"d": "M", "q": "The first carpometacarpal joint is a:", "o": ["Saddle joint between the trapezium and the first metacarpal", "Hinge joint between the scaphoid and the first metacarpal", "Ball-and-socket joint between the trapezoid and the first metacarpal", "Plane joint between the capitate and the first metacarpal"], "a": 0, "why": "The thumb CMC is a saddle joint (trapezium–1st metacarpal) that allows flexion/extension, abduction/adduction and opposition. Pain comes mainly from degeneration and instability.", "ref": "Peng 2020 ch21", "kw": ["1st CMC joint", "saddle joint", "trapezium", "osteoarthritis"], "x": ["", "The scaphoid does not articulate with the 1st metacarpal.", "The trapezoid articulates with the 2nd metacarpal.", "The capitate articulates with the 3rd metacarpal."]}, {"d": "M", "q": "When injecting the radiocapitellar joint, the needle depth should not usually exceed:", "o": ["4–5 cm", "3–4 cm", "2.5–3 cm", "1–2 cm"], "a": 3, "why": "The radiocapitellar joint is very superficial; a needle depth of 1–2 cm is enough.", "ref": "Peng 2020 ch20", "kw": ["radiocapitellar joint", "superficial", "1–2 cm", "elbow injection"], "x": ["Far too deep.", "Far too deep.", "Too deep for this superficial joint.", ""]}, {"d": "M", "q": "When injecting steroid around the common extensor tendon for lateral epicondylosis, a needle placed too deep risks entering the:", "o": ["Ulnar nerve", "Brachial artery", "Radial collateral ligament", "Olecranon bursa"], "a": 2, "why": "The radial collateral ligament lies directly deep to the common extensor tendon. Use the lowest possible steroid dose and volume, because steroid can weaken tendon and ligament.", "ref": "Peng 2020 ch20", "kw": ["common extensor tendon", "radial collateral ligament", "needle depth", "steroid weakening"], "x": ["The ulnar nerve is medial, in the cubital tunnel.", "The brachial artery is anterior, in the cubital fossa.", "", "The olecranon bursa is posterior and superficial."]}, {"d": "M", "q": "For radiofrequency of the obturator articular branch to the hip, the bony target and the reason for starting under ultrasound are:", "o": ["The greater trochanter; to avoid the sciatic nerve", "The inferomedial acetabulum; to avoid the femoral neurovascular bundle", "The lesser trochanter; to avoid the profunda femoris", "The ASIS; to avoid the lateral femoral cutaneous nerve"], "a": 1, "why": "The obturator branch target is the inferomedial acetabulum, close to the femoral neurovascular bundle. Starting under ultrasound avoids puncturing it; the final position can be refined with fluoroscopy.", "ref": "Peng 2020 ch27", "kw": ["hip denervation", "obturator articular branch", "inferomedial acetabulum", "femoral neurovascular bundle"], "x": ["The greater trochanter is a lateral, peritrochanteric target.", "", "The lesser trochanter is the iliopsoas insertion, not the obturator articular target.", "The ASIS is unrelated to hip articular innervation targets."]}], "2-2": [{"d": "G", "q": "The amount of ultrasound reflected at a tissue interface depends mainly on:", "o": ["The difference in acoustic impedance between the two tissues", "The transducer frequency alone", "The gain setting", "The depth of the focal zone"], "a": 0, "why": "Reflection depends on the impedance mismatch at the interface: the greater the mismatch, the more is reflected. Acoustic impedance is a tissue's resistance to the passage of sound.", "ref": "Peng 2020 ch1", "kw": ["acoustic impedance", "impedance mismatch", "reflection", "interface"], "x": ["", "Frequency affects attenuation and resolution, not the reflection coefficient.", "Gain amplifies the returning echoes on screen; it does not change reflection.", "Focus changes lateral resolution, not how much sound is reflected."]}, {"d": "G", "q": "Refraction artefact typically produces:", "o": ["Acoustic shadowing deep to the structure", "Posterior acoustic enhancement", "Duplication of a structure (for example, the aorta beneath the rectus muscle)", "Comet-tail artefact"], "a": 2, "why": "Sound changes direction at an interface between tissues with different speeds of sound, so a structure can be displayed twice or displaced.", "ref": "Narouze 2e ch2", "kw": ["refraction", "speed of sound", "duplication artefact", "beam bending"], "x": ["Shadowing comes from strong reflection or absorption (bone, calcium).", "Enhancement comes from low attenuation (fluid).", "", "Comet tail is a reverberation artefact (gas, metal)."]}, {"d": "G", "q": "Spatial compound imaging improves tissue-plane definition, but its drawback is:", "o": ["It abolishes all anisotropy", "Smoothing of the image and more motion blur", "A higher frame rate", "Greater depth of penetration"], "a": 1, "why": "Beams from several angles are combined into one image. Frames are compounded, so the image is smoothed and motion blur is more likely.", "ref": "Jacobson ch1", "kw": ["spatial compound imaging", "multiple beam angles", "smoothing", "motion blur"], "x": ["It reduces angle-dependent artefact but does not abolish anisotropy.", "", "Compounding several frames tends to lower the effective frame rate.", "Penetration depends on frequency, not compounding."]}, {"d": "C", "q": "Most of tramadol's opioid analgesic effect depends on its conversion by:", "o": ["Glucuronidation to morphine-6-glucuronide", "CYP3A4 to N-desmethyltramadol", "Plasma esterases", "CYP2D6 to O-desmethyltramadol (M1)"], "a": 3, "why": "Tramadol is a weak µ agonist plus a serotonin/noradrenaline reuptake inhibitor. Its potent µ agonist is the CYP2D6 metabolite M1, so poor metabolisers get less analgesia (and serotonergic risk remains).", "ref": "Grond S, Sablotzki A. Clin Pharmacokinet 2004;43:879–923", "kw": ["tramadol", "CYP2D6", "O-desmethyltramadol", "poor metabolisers"], "x": ["M6G is a morphine metabolite.", "N-desmethyltramadol is a minor, largely inactive metabolite.", "Esterases metabolise remifentanil, not tramadol.", ""]}, {"d": "C", "q": "In the 2016 revised ACR fibromyalgia criteria, 'generalised pain' means pain in at least how many of the five body regions?", "o": ["Two", "Three", "Four", "Five"], "a": 2, "why": "Generalised pain = pain in at least 4 of 5 regions, with symptoms for at least 3 months and set widespread pain index and symptom severity scores.", "ref": "Wolfe F et al. Semin Arthritis Rheum 2016;46:319–29", "kw": ["fibromyalgia", "ACR 2016", "generalised pain", "4 of 5 regions"], "x": ["Too few regions.", "Too few regions.", "", "Not required; 4 of 5 is enough."]}, {"d": "C", "q": "A Cochrane review of psychological therapies for chronic pain (excluding headache) found that CBT, compared with usual care or waiting list:", "o": ["Cured pain in most patients", "Had small benefits for pain, disability and distress", "Had no effect on any outcome", "Was harmful in most trials"], "a": 1, "why": "CBT gave small benefits for pain, disability and distress at the end of treatment. This supports it as part of multidisciplinary care, not as a stand-alone cure.", "ref": "Williams ACdC et al. Cochrane Database Syst Rev 2020;8:CD007407", "kw": ["CBT", "chronic pain", "small effect sizes", "multidisciplinary care"], "x": ["Overstates the evidence.", "", "Small but consistent benefits were found.", "No evidence of harm."]}, {"d": "S", "q": "Thoracic zygapophysial joints are hard to enter under ultrasound MAINLY because:", "o": ["The inferior articular process almost completely covers the superior articular process of the vertebra below", "The joints lie deeper than the pleura", "The joints are absent from T1 to T10", "The costotransverse joints overlie them"], "a": 0, "why": "The overlapping articular processes leave little acoustic window into the joint, whereas the costotransverse joints are more exposed (except at T12/L1, where the arrangement differs).", "ref": "Narouze 2e ch5", "kw": ["thoracic facet", "overlapping articular processes", "acoustic window", "costotransverse joint"], "x": ["", "The joints are posterior, superficial to the pleura.", "Thoracic facet joints are present at every level.", "The costotransverse joints are lateral and more EXPOSED, not overlying."]}, ganglia", "Middle cervical and first thoracic ganglia", "First and second thoracic ganglia", "Inferior cervical and first thoracic ganglia"], "a": 3, "why": "The cervicothoracic (stellate) ganglion lies from the head of the first rib to the C7 transverse process, close to the vertebral artery and the pleural dome; that is why US blocks are done higher, at C6.", "ref": "Peng 2020 ch3; Narouze 2e ch1", "kw": ["stellate ganglion", "inferior cervical + T1", "C7 / first rib", "pleural dome"], "x": ["The superior and middle ganglia stay separate.", "The middle cervical ganglion lies at C6 and is separate.", "T1 fuses with the inferior cervical, not with T2.", ""]}, {"d": "P", "q": "At the level of the superior nuchal line, the greater occipital nerve ascends:", "o": ["Medial to the occipital artery", "Lateral to the occipital artery", "Deep to sternocleidomastoid", "Together with the lesser occipital nerve"], "a": 0, "why": "The GON pierces trapezius and runs medial to the occipital artery. Blind landmark blocks here risk arterial injection, with 5–10% side effects (dizziness, blurred vision, syncope).", "ref": "Peng 2020 ch2", "kw": ["GON", "occipital artery", "superior nuchal line", "landmark complications"], "x": ["", "The artery is lateral to the nerve.", "SCM relates to the lesser occipital nerve, not the GON.", "The LON is more lateral, from the cervical plexus."]}, {"d": "P", "q": "The lesser occipital nerve is:", "o": ["A branch of the C2 dorsal ramus", "A branch of the facial nerve", "The most cephalad branch of the superficial cervical plexus, beneath sternocleidomastoid", "The superficial medial branch of C3"], "a": 2, "why": "The LON (ventral rami C2–C3) arises from the superficial cervical plexus deep to SCM and supplies the lateral occipital scalp.", "ref": "Peng 2020 ch2", "kw": ["lesser occipital nerve", "superficial cervical plexus", "sternocleidomastoid", "C2–C3 ventral rami"], "x": ["The C2 dorsal ramus medial branch is the GREATER occipital nerve.", "T       t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(timerId);submitMcq()}};
    tick();timerId=setInterval(tick,1000);
  }
  renderMcqQ();if(st.done)renderResults();
}
function submitMcq(){const s=mcqState(mcqKey);s.done=true;mcqSave(mcqKey,s);mcqI=0;renderMcq();document.getElementById("res").scrollIntoView({behavior:"smooth"})}
function mcqExplain(q,a){const ok=a===q.a;
  return `<div class="model"><p><b class="${ok?"s4":"s1"}">${ok?"Correct.":"Not quite."}</b> The answer is <b>${LET[q.a]}</b>. ${q.why}</p>
   ${q.kw?`<p class="kw" aria-label="Key words">${q.kw.map(k=>`<span>${k}</span>`).join("")}</p>`:""}
   ${q.x?`<p class="xhead">Why the other options are wrong</p><ul class="xwrong">${q.x.map((t,i)=>t?`<li class="${i===a?"mine":""}"><b>${LET[i]}.</b> ${t}</li>`:"").join("")}</ul>`:""}
   <p class="refs">Reference: ${q.ref}</p></div>`}
function renderMcqQ(){

    return `<button aria-current="${i===mcqI}" class="${c}">${base+i+1}</button>`}).join("");
  document.querySelectorAll("#qnav button").forEach((b,i)=>b.onclick=()=>{mcqI=i;renderMcqQ()});
  const a=st.ans[mcqI],show=a!==undefined&&reveal(st),answered=Object.keys(st.ans).length;
  const el=document.getElementById("q");

   <div class="opts">${q.o.map((t,i)=>{let c="";if(show){if(i===q.a)c="right";else if(i===a)c="wrong"}else if(i===a)c="picked";
     return `<button class="opt ${c}" data-i="${i}" ${show?"disabled":""}><span class="L">${LET[i]}</span><span>${t}</span></button>`}).join("")}</div>
   ${show?mcqExplain(q,a):""}
   <div class="nav"><button class="btn" id="prev" ${mcqI===0?"disabled":""}>Previous</button>
   ${st.mode==="exam"&&!st.done?`<button class="btn primary" id="submit">Submit (${answered} of 20 answered)</button>`:""}
   <button class="btn" id="next" ${mcqI===qs.length-1?"disabled":""}>Next question</button></div>`;
  el.querySelectorAll("button.opt").forEach(b=>b.onclick=()=>{const s=mcqState(mcqKey);s.ans[mcqI]=+b.dataset.i;
    if(s.mode==="practice"&&Object.keys(s.ans).length===qs.length)s.done=true;mcqSave(mcqKey,s);renderMcqQ();renderMcqList();if(s.done)renderResults()});
  document.getElementById("prev").onclick=()=>{mcqI--;renderMcqQ()};
  document.getElementById("next").onclick=()=>{mcqI++;renderMcqQ()};
  const sb=document.getElementById("submit");if(sb)sb.onclick=submitMcq;
}
function renderResults(){

  qs.forEach((q,i)=>{by[q.d]=by[q.d]||[0,0];by[q.d][1]++;if(st.ans[i]===q.a)by[q.d][0]++});

   <p class="refs">Click a red question number above to read its explanation. Wrong answers from every part are collected under “Review my wrong answers”.</p>`;

      ${mcqExplain(q,a)}</section>`}).join("")
    :`<div class="card soon"><p>No wrong answers yet. Any question you get wrong in a finished part shows up here with its explanation.</p></div>`);

function route(){const h=location.hash,mm=h.match(/^#mcq-(review|\d+-\d+)$/);
  if(!h||h==="#"){location.replace("#mcq-"+mcqKey);return}

const PROCS=[["P01", "Cervical medial branch / TON", 0], ["P02", "Cervical selective nerve root", 0], ["P03", "Thoracic facet joint", 0], ["P04", "Lumbar medial branch / facet", 0], ["P05", "Caudal epidural", 0], ["P06", "Suprascapular nerve", 1], ["P07", "Ilioinguinal / iliohypogastric", 1], ["P08", "Pudendal nerve", 1], ["P09", "Ulnar nerve at cubital tunnel", 1], ["P10", "Lateral femoral cutaneous nerve", 1], ["P11", "Acromioclavicular joint", 2], ["P12", "Glenohumeral joint", 2], ["P13", "Hip joint", 2], ["P14", "Knee joint", 2], ["P15", "Tibiotalar joint", 2], ["P16", "Long head of biceps sheath", 3], ["P17", "Subacromial–subdeltoid bursa", 3], ["P18", "Medial / lateral epicondylosis", 3], ["P19", "Piriformis", 3], ["P20", "Greater trochanteric bursae", 3]];
const PRACT={"P01": {"title": "P01 Cervical medial branch block and third occipital nerve", "html": "<p>Region: Spine · Station time: 15 minutes · Partner viva cases: 2.1 cervicogenic headache, 4.1 and 4.2 cervical facet pain.</p>\n<h2>Exam snapshot</h2>\n<table>\n<thead>\n<tr>\n<th>Item</th>\n<th>What to do</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Position</td>\n<td>Lateral decubitus, side to be blocked up, neck neutral</td>\n</tr>\n<tr>\n<td>Probe</td>\n<td>Linear 8–15 MHz</td>\n</tr>\n<tr>\n<td>Needle</td>\n<td>22 or 25 G, 2.5-inch (63 mm) block needle</td>\n</tr>\n<tr>\n<td>Level check</td>\n<td>Coronal scan from the mastoid (C2 drop-off) or transverse scan up from T1 and C7</td>\n</tr>\n<tr>\n<td>Approach</td>\n<td>Transverse (short-axis) view, in-plane, posterolateral to anterior</td>\n</tr>\n<tr>\n<td>Final tip</td>\n<td>On bone at the centroid of the articular pillar, beneath semispinalis capitis. TON: lateral surface of the C2–C3 joint</td>\n</tr>\n<tr>\n<td>Confirm</td>\n<td>Rotate to coronal: tip mid-pillar between two joints</td>\n</tr>\n<tr>\n<td>Volume</td>\n<td>0.3 mL (C3–C6), 0.6 mL (C7), 0.9 mL (TON) for diagnostic blocks</td>\n</tr>\n</tbody>\n</table>\n<h2>Why the block is done</h2>\n<p>The facet joints are the commonest source of chronic neck pain. A medial branch block anaesthetises the nerves to a joint, so a good response predicts success of radiofrequency ablation. The TON block tests the C2–C3 joint, a common cause of cervicogenic headache.</p>\n<h2>Applied anatomy</h2>\n<ul>\n<li>Each cervical facet joint is supplied by the medial branch above and the one below it.</li>\n<li>The C2–C3 joint is the exception: it is supplied only by the third occipital nerve, the large superficial medial branch of C3.</li>\n<li>The C3–C6 medial branches wrap around the waist (centroid) of the articular pillar, held to the bone by fascia under semispinalis capitis.</li>\n<li>The C7 medial branch runs higher, over the apex of the C7 superior articular process.
