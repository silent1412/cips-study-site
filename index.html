const GEN={"11.1": {"title": "Knee pain, osteoarthritis", "vignette": "A 67-year-old retired cook presents with a 4-year history of pain in both knees, the right much worse. The pain is felt across the front and inner side of the knee and is worst going down stairs, getting up from a low chair and after walking for 20 minutes. She is stiff for about 15 minutes after getting up in the morning or after sitting. The right knee swells after a busy day and sometimes feels as if it will give way. She also has a sore spot just below the inner side of the right knee, and an occasional ache in the right groin. Her BMI is 34; she has hypertension and chronic kidney disease stage 3. Paracetamol helps a little. She is on a 14-month waiting list for knee replacement and asks if anything can help in the meantime.", "clues": "<strong>Clues to underline:</strong> age over 50, use-related pain, morning stiffness under 30 minutes, swelling after activity, obesity, both knees. <strong>Planted distractors:</strong> sore spot below the medial joint line (pes anserine bursitis), groin ache (hip OA referring to the knee), giving way (meniscus or quadriceps weakness), CKD (limits NSAIDs), the planned knee replacement (affects timing of steroid).", "pe": "STD", "answers": ["<p><strong>Most likely:</strong> primary knee osteoarthritis, medial compartment and patellofemoral, with a symptomatic effusion. She meets the ACR clinical criteria: age over 50, stiffness under 30 minutes, with crepitus, bony tenderness or bony enlargement.</p>\n<p><strong>Differential and coexisting diagnoses</strong></p>\n<ul>\n<li>Pes anserine bursitis or tendinopathy</li>\n<li>Degenerative medial meniscal tear</li>\n<li>Hip osteoarthritis with referred knee pain</li>\n<li>Crystal arthritis: CPPD (pseudogout) or gout; inflammatory arthritis</li>\n<li>Spontaneous osteonecrosis of the knee (sudden severe medial pain, night pain)</li>\n<li>Baker's (popliteal) cyst</li>\n<li>Saphenous neuropathy (infrapatellar branch); L3 or L4 radiculopathy</li>\n<li>Septic arthritis (hot, swollen knee: always aspirate)</li>\n</ul>", "<p><strong>Positioning:</strong> standing (alignment, varus or valgus, gait, single-leg stance), then supine with the knee supported; prone for the popliteal fossa.</p>\n<p><strong>Inspection:</strong> varus deformity, quadriceps wasting (measure thigh girth 10 cm above the patella, both sides), swelling, skin changes.</p>\n<p><strong>Neurological examination with tools:</strong> reflex hammer (knee and ankle jerks); Neurotip and light touch in L3–S1 and over the infrapatellar saphenous territory; MRC power of hip and knee muscles.</p>\n<p><strong>Musculoskeletal examination</strong></p>\n<ul>\n<li>Effusion: bulge (sweep) test and patellar tap.</li>\n<li>Range of motion with a goniometer: fixed flexion deformity, flexion range; crepitus.</li>\n<li>Palpation: medial joint line tenderness, osteophytes, warmth; <strong>pes anserine tenderness</strong> about 5 cm below the medial joint line.</li>\n<li>Stability: varus and valgus stress, Lachman and anterior drawer.</li>\n<li>Meniscus: McMurray and Thessaly tests (often positive in OA, low specificity).</li>\n<li>Patellofemoral: patellar grind (Clarke) test.</li>\n<li><strong>Hip:</strong> internal rotation, FADIR and FABER; reproduction of \"knee\" pain with hip internal rotation points to the hip.</li>\n<li>Function: timed up-and-go or 30-second chair stand.</li>\n</ul>\n<div class=\"tip\"><b>Examiner tip:</b>always examine the hip in knee pain, and say why.</div>", "<ul>\n<li><strong>Weight-bearing X-rays:</strong> standing AP, Rosenberg view (posteroanterior at 45° flexion, more sensitive for joint space narrowing), lateral and skyline. Grade with <strong>Kellgren–Lawrence (0–4)</strong>: osteophytes, joint space narrowing, sclerosis, deformity. X-ray severity does not match pain closely.</li>\n<li><strong>Aspiration of the effusion</strong> (done under US at the injection): appearance, cell count, crystals (CPPD rhomboid, positively birefringent; urate needles, negatively birefringent), Gram stain and culture if any suspicion of infection.</li>\n<li><strong>Ultrasound:</strong> effusion and synovitis, osteophytes, meniscal extrusion, Baker's cyst, cartilage thickness, pes anserine bursa.</li>\n<li><strong>MRI:</strong> not needed for OA; only if osteonecrosis, a mechanical lesion or another diagnosis is suspected.</li>\n<li><strong>Bloods:</strong> renal function (CKD, NSAIDs), HbA1c, uric acid if gout is suspected; ESR and CRP if inflammatory arthritis is possible.</li>\n</ul>", "<p><strong>Set-up:</strong> machine on the opposite side, screen in line of sight; patient and operator details entered; transducer cleaned; gloves on. Linear 6–13 MHz probe (curvilinear for deep structures in a large knee), MSK knee preset, depth about 4 cm. Patient supine with the knee flexed 20–30° on a pillow.</p>\n<p><strong>Systematic overview by quadrant:</strong></p>\n<ol>\n<li><strong>Anterior:</strong> quadriceps tendon and suprapatellar recess in long and short axis; measure effusion depth (above about 4 mm is significant) and look for synovial thickening; patellar tendon. Then, in full knee flexion, the femoral trochlear cartilage in a transverse view; measure its thickness and compare with the left.</li>\n<li><strong>Medial:</strong> medial femorotibial joint in the coronal plane: osteophytes, MCL, <strong>medial meniscal extrusion</strong> (more than about 3 mm is abnormal), then the pes anserine tendons and bursa below the joint line.</li>\n<li><strong>Lateral:</strong> lateral joint, iliotibial band, lateral meniscus.</li>\n<li><strong>Posterior (prone):</strong> popliteal fossa; Baker's cyst between the medial gastrocnemius and semimembranosus (the \"comma\" neck); popliteal vessels.</li>\n</ol>\n<p><strong>Doppler:</strong> power Doppler of the synovium in the suprapatellar recess (synovitis); popliteal vessels.</p>\n<p><strong>Dynamic test:</strong> standing (weight-bearing) view of the medial joint to show meniscal extrusion increasing; quadriceps contraction moves fluid into the suprapatellar recess; gentle compression of the parapatellar recesses (\"milking\") shows small effusions.</p>\n<p><strong>Structures to be able to name:</strong> quadriceps tendon, suprapatellar fat pad, prefemoral fat pad, suprapatellar recess, femur, patella, trochlear cartilage, MCL, medial meniscus, pes anserine tendons (sartorius, gracilis, semitendinosus), semimembranosus, medial head of gastrocnemius.</p>", "<p>Following the OARSI 2019 and ACR 2019 guidelines:</p>\n<ul>\n<li><strong>Education and self-management.</strong></li>\n<li><strong>Weight loss:</strong> 5–10% body weight improves pain and function.</li>\n<li><strong>Exercise:</strong> quadriceps and hip strengthening, low-impact aerobic exercise, aquatic exercise, tai chi.</li>\n<li><strong>Topical NSAIDs</strong> first-line for knee OA, and preferred with her CKD (oral NSAIDs should be avoided or used very cautiously).</li>\n<li>Paracetamol (small benefit); duloxetine as an option.</li>\n<li><strong>Aids:</strong> walking stick in the opposite hand, cushioned footwear; medial unloading brace or taping.</li>\n<li>Avoid opioids where possible. Glucosamine and chondroitin are not recommended.</li>\n</ul>", "<p><strong>US-guided intra-articular knee corticosteroid injection via the suprapatellar recess, with aspiration of the effusion first.</strong></p>\n<ul>\n<li>Intra-articular corticosteroid is strongly recommended for knee OA flares; benefit usually lasts 2–8 weeks. It works best with an effusion.</li>\n<li>US guidance improves accuracy (about 91–96% guided against 40–84% blind, Spinner 2014 review) and reduces procedural pain. The superolateral approach has the highest accuracy (about 100%), against about 95% midlateral and 75% medial.</li>\n<li><strong>Timing with surgery:</strong> avoid steroid within about 3 months before knee replacement (higher risk of prosthetic infection).</li>\n<li><strong>Other options:</strong> hyaluronic acid (conditional recommendation, best in milder OA), PRP (growing evidence), <strong>genicular nerve block and radiofrequency ablation</strong> for refractory pain or if unfit for surgery (case 11.2); pes anserine injection if the bursa is the main source.</li>\n</ul>", "<ol>\n<li>Consent; check allergies, anticoagulation, renal function and glucose; note the date of planned surgery.</li>\n<li>Supine, knee flexed 20–30° on a pillow; machine on the opposite side.</li>\n<li>Sterile prep (chlorhexidine), sterile probe cover and gel.</li>\n<li>Linear probe in the transverse plane just above the patella (or rotated about 45° towards the lateral side) to show the suprapatellar recess under the quadriceps tendon, between the suprapatellar and prefemoral fat pads.</li>\n<li><strong>Needle:</strong> 21–22G 38–50 mm (a 22G 90 mm spinal needle in a large thigh), in plane from lateral to medial, passing through the vastus lateralis under the quadriceps tendon, at a flat angle.</li>\n<li><strong>Aspirate first:</strong> remove as much effusion as possible (compress the parapatellar recesses to push fluid up); send fluid for cell count, crystals and culture.</li>\n<li><strong>Injectate:</strong> triamcinolone acetonide 40 mg (or methylprednisolone 40–80 mg) with 3–5 mL of 1% lidocaine; total about 5 mL. Extended-release triamcinolone (32 mg) causes a smaller glucose rise, if available.</li>\n<li>Watch the fluid fill the recess, not the fat pads or the tendon.</li>\n<li>Bend and straighten the knee a few times to spread the drug.</li>\n</ol>", "<ul>\n<li><strong>Common:</strong> post-injection flare (including crystal-induced synovitis), facial flushing, transient raised blood glucose.</li>\n<li><strong>Joint:</strong> septic arthritis (rare); haemarthrosis.</li>\n<li><strong>Local:</strong> subcutaneous fat atrophy and skin depigmentation (lateral approach, if steroid tracks back).</li>\n<li><strong>Repeated injections:</strong> faster cartilage loss; McAlindon 2017 found that triamcinolone every 3 months for 2 years caused more cartilage volume loss with no pain benefit over saline.</li>\n<li><strong>Before arthroplasty:</strong> higher periprosthetic infection risk if given within about 3 months of surgery.</li>\n<li><strong>Other:</strong> vasovagal reaction, allergy.</li>\n</ul>", "<ul>\n<li><strong>Immediately:</strong> pain relief after the local anaesthetic, walking, no signs of bleeding; fluid results (crystals or infection change management).</li>\n<li><strong>Safety-net advice:</strong> a hot, swollen, very painful knee or fever in the next days means urgent review (septic arthritis).</li>\n<li><strong>At 4–6 weeks:</strong> pain scores, function (WOMAC or KOOS), walking distance, effusion, range of motion.</li>\n<li><strong>Repeat:</strong> no more often than every 3 months, and no more than about 3–4 per year; keep at least 3 months clear before her knee replacement.</li>\n<li><strong>Escalate:</strong> genicular nerve block and RF ablation if injections stop helping; keep up weight loss and exercise.</li>\n</ul><div class=\"tip\"><b>Where marks are lost</b><ul>\n<li>Not aspirating and not sending fluid for crystals and culture.</li>\n<li>Forgetting her CKD when listing NSAIDs.</li>\n<li>Not mentioning the 3-month gap before knee replacement.</li>\n<li>Not examining the hip, or not checking the pes anserine bursa.</li>\n</ul></div>"], "refs": ["Hurdle M-FB. Ultrasound-guided knee injections. In: Narouze SN, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer; 2018. Ch. 29, pp. 283–285.", "Nouer Frederico T, Peng P. Ultrasound-guided knee intervention. In: Peng P, et al., eds. <em>Ultrasound for Interventional Pain Management</em>. Springer; 2020. Ch. 23, knee joint pp. 283–286.", "Spinner DA, Danesh H, Baksh WS. Knee. In: Spinner DA, Kirschner JS, Herrera JE, eds. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer; 2014. Ch. 6, pp. 57–58.", "Peng PW, Shankar H. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part V: knee joint. <em>Reg Anesth Pain Med</em> 2014;39:368–380.", "Bannuru RR, et al. OARSI guidelines for the non-surgical management of knee, hip, and polyarticular osteoarthritis. <em>Osteoarthritis Cartilage</em> 2019;27:1578–1589.", "Kolasinski SL, et al. 2019 American College of Rheumatology/Arthritis Foundation guideline for the management of osteoarthritis of the hand, hip, and knee. <em>Arthritis Care Res</em> 2020;72:149–162.", "McAlindon TE, et al. Effect of intra-articular triamcinolone vs saline on knee cartilage volume and pain in patients with knee osteoarthritis: a randomized clinical trial. <em>JAMA</em> 2017;317:1967–1975.", "Jackson DW, Evans NA, Thomas BM. Accuracy of needle placement into the intra-articular space of the knee. <em>J Bone Joint Surg Am</em> 2002;84:1522–1527."]}, "6.1": {"title": "Shoulder pain, AC joint", "vignette": "A 41-year-old man who does competitive powerlifting presents with an 8-month history of right shoulder pain. There was no single injury. The pain is on the top of the shoulder, and he can point to it with one finger. It is worst during bench press and dips, and when he reaches across his body to fasten the car seatbelt. He wakes when he lies on the right side. He also notices a dull ache at the front of the shoulder after heavy sessions. He has cut down his training weights, used ibuprofen gel, and had four physiotherapy sessions, with little change. He is otherwise well and wants to compete again in 3 months. There is no neck pain and no numbness in the arm.", "clues": "<strong>Clues to underline:</strong> heavy pressing sports, one-finger point to the top of the shoulder, pain with cross-body reach, night pain lying on that side, no trauma. <strong>Planted distractors:</strong> anterior shoulder ache (think biceps or subacromial), the time pressure of competing in 3 months (tempts you to skip diagnosis and go straight to steroid).", "pe": "STD", "answers": ["<p><strong>Most likely:</strong> AC joint pain from distal clavicular osteolysis, a stress-related resorption of the distal clavicle seen in weightlifters, or early AC joint osteoarthritis.</p>\n<p><strong>Differential diagnosis</strong></p>\n<ul>\n<li>AC joint osteoarthritis</li>\n<li>Low-grade AC joint sprain (Rockwood type I–II) from repetitive load</li>\n<li>Subacromial impingement and bursitis (often coexists, as inferior AC osteophytes narrow the subacromial space)</li>\n<li>Long head of biceps tendinopathy or SLAP lesion (bench press, O'Brien test)</li>\n<li>Pectoralis major tendinopathy at the humeral insertion</li>\n<li>Glenohumeral instability (posterior, from pressing)</li>\n<li>C4 or C5 radiculopathy; suprascapular neuropathy</li>\n<li>Less common: inflammatory arthritis, septic arthritis, tumour of the distal clavicle</li>\n</ul>", "<p><strong>Positioning:</strong> standing for inspection from front and behind, then sitting with both shoulders exposed.</p>\n<p><strong>Inspection:</strong> step or swelling over the AC joint compared with the left, muscle bulk, scapular position.</p>\n<p><strong>Neurological examination with tools:</strong> reflex hammer (biceps C5, brachioradialis C6, triceps C7); Neurotip over C4 (top of the shoulder, the cape area) and C5; light touch; MRC power of deltoid, cuff and biceps. Cervical range of motion and Spurling test.</p>\n<p><strong>Musculoskeletal examination</strong></p>\n<ul>\n<li>Palpation: point tenderness over the AC joint (the most sensitive single sign), compared with the other side.</li>\n<li>Active and passive range of motion; pain at the end of elevation (above 160°) is typical of AC pain, while a mid-range arc points to subacromial pain.</li>\n<li>AC tests: cross-body adduction (Scarf) test, O'Brien test (pain on top of the shoulder, not deep inside), AC resisted extension test, Paxinos sign (thumb pressure under the acromion pushes the clavicle up).</li>\n<li>Exclude the neighbours: Neer and Hawkins (subacromial), Speed and Yergason (biceps), apprehension and relocation, cuff strength tests.</li>\n</ul>\n<div class=\"tip\"><b>Examiner tip:</b>say where the O'Brien pain is. Pain on top means AC; pain deep inside means labrum.</div>", "<ul>\n<li><strong>Plain X-ray:</strong> AP, axillary and a Zanca view (10–15° cephalic tilt, about half the usual exposure). Look for distal clavicle resorption, loss of subchondral bone line, cysts, joint narrowing, osteophytes and joint widening.</li>\n<li><strong>Ultrasound:</strong> joint capsule bulging, effusion, osteophytes, cortical irregularity of the distal clavicle, and Doppler signal (synovitis). Compare with the other side. Also checks the cuff and the subacromial bursa.</li>\n<li><strong>MRI:</strong> the most sensitive test for osteolysis (bone marrow oedema in the distal clavicle) and to assess the cuff before surgery.</li>\n<li><strong>Diagnostic US-guided AC joint injection</strong> of local anaesthetic: the reference standard for AC joint pain. Relief of at least 50% with a negative cross-body test afterwards confirms it.</li>\n<li>Bloods only if inflammatory or septic arthritis is suspected (ESR, CRP, white count).</li>\n</ul>", "<p><strong>Set-up:</strong> machine on the opposite side, screen in line of sight; patient and operator details entered; transducer cleaned; gloves on. Linear high-frequency probe (10–18 MHz), MSK superficial preset, depth about 2 cm, focus at the joint. Patient seated with the arm hanging by the side, which opens the joint.</p>\n<p><strong>Regional overview:</strong> a short shoulder sweep first (biceps in the groove, subscapularis, supraspinatus and the SASD bursa), so the AC joint is not looked at in isolation.</p>\n<p><strong>Focus on the AC joint:</strong> probe in the coronal plane over the top of the shoulder. Follow the clavicle laterally until the joint gap appears as a V between two bright bone surfaces. Look at:</p>\n<ul>\n<li>the capsule and superior AC ligament (bulging above the bone line suggests effusion or synovitis);</li>\n<li>the bone surfaces (irregular, eroded distal clavicle in osteolysis; osteophytes in OA);</li>\n<li>joint width, measured and compared with the left side.</li>\n</ul>\n<p><strong>Doppler:</strong> colour or power Doppler over the capsule for synovitis.</p>\n<p><strong>Dynamic test:</strong> watch the joint during cross-body adduction (painful compression, capsular bulging) and with downward traction on the arm (joint widening suggests instability).</p>\n<p><strong>Also look for:</strong> a \"geyser sign\", a cyst above the AC joint that may signal a full-thickness cuff tear beneath.</p>\n<p><strong>Structures to be able to name:</strong> acromion, distal clavicle, AC joint space, AC capsule and superior AC ligament, fibrocartilage disc (in younger patients), deltoid, trapezius, supraspinatus, SASD bursa, coracoacromial ligament.</p>", "<ul>\n<li><strong>Load modification:</strong> narrow-grip bench press, stop dips and deep flyes, avoid lowering the bar below chest level; keep training legs and lower body.</li>\n<li><strong>Analgesia:</strong> topical NSAIDs, short courses of oral NSAIDs; ice after training.</li>\n<li><strong>Physiotherapy:</strong> scapular stabilisation, posterior capsule stretching, rotator cuff strengthening.</li>\n<li><strong>Taping</strong> to offload the joint during training.</li>\n<li>Most cases of osteolysis settle with 2–3 months of activity change, but symptoms often return when full loading resumes.</li>\n</ul>", "<p><strong>US-guided AC joint injection: local anaesthetic first as a diagnostic block, with corticosteroid for treatment.</strong></p>\n<ul>\n<li>Accuracy of US-guided AC injection is about 95–100%, against about 40–50% for palpation-guided injection (Peck 2010; Sabeti-Aschraf 2011). The joint is small and its line is often not where it is palpated.</li>\n<li>Later options: PRP or prolotherapy (limited evidence); if the injection gives clear but short relief, arthroscopic distal clavicle excision.</li>\n</ul>", "<ol>\n<li>Consent; check allergies and bleeding risk; explain the diagnostic purpose.</li>\n<li>Patient seated, arm hanging by the side (gentle downward traction opens the joint); machine opposite.</li>\n<li>Sterile skin prep (chlorhexidine), sterile probe cover and gel.</li>\n<li>Linear 10–18 MHz probe in the coronal plane, with the joint V centred on the screen.</li>\n<li><strong>Needle:</strong> 25G (or 27G) 38 mm.</li>\n<li><strong>Approach:</strong> out-of-plane from the anterior (or posterior) side at the middle of the probe, aiming to see the tip as a bright dot entering the gap; or in-plane from lateral to medial with a gel stand-off, because the joint is so superficial.</li>\n<li><strong>Target:</strong> just beneath the AC capsule, in the joint. The joint lies less than 1 cm deep; a deeper tip will deposit drug in the subacromial bursa or supraspinatus.</li>\n<li><strong>Injectate:</strong> total about 1–1.5 mL, as the joint holds very little. For example 0.5 mL triamcinolone 40 mg/mL (20 mg) with 0.5–1 mL 1% lidocaine. Watch the capsule lift.</li>\n<li>Avoid depositing steroid in the subcutaneous tissue: the skin here is thin.</li>\n<li>Repeat the cross-body adduction test and point tenderness after 5–10 minutes and record the result.</li>\n</ol>", "<ul>\n<li><strong>Common:</strong> post-injection flare; transient raised glucose; facial flushing.</li>\n<li><strong>Local:</strong> subcutaneous fat atrophy and skin depigmentation (thin skin over the joint); misplaced injection into the subacromial bursa or supraspinatus, which gives a false-positive diagnostic result.</li>\n<li><strong>Rare:</strong> septic arthritis, haematoma, vasovagal reaction, allergy.</li>\n<li><strong>Repeated steroid:</strong> cartilage and ligament weakening.</li>\n</ul>", "<ul>\n<li><strong>Immediately:</strong> percentage pain relief, point tenderness and the cross-body test after the local anaesthetic. At least 50% relief supports the AC joint as the pain generator; no relief means rethink the diagnosis.</li>\n<li><strong>At 2–6 weeks:</strong> pain during pressing, night pain, range of motion, a function score (QuickDASH or SPADI).</li>\n<li><strong>Return to sport:</strong> graded return with modified technique; avoid maximal pressing for about 2 weeks after steroid.</li>\n<li><strong>Escalate:</strong> if relief is clear but short-lived, refer for distal clavicle excision; limit steroid injections to about 3 per year.</li>\n</ul><div class=\"tip\"><b>Where marks are lost</b><ul>\n<li>Not checking whether the O'Brien test hurts on top or deep inside.</li>\n<li>Calling the injection only \"therapeutic\": it is the diagnostic reference standard, so re-examine afterwards.</li>\n<li>Injecting too deep, or too much volume for a joint that holds about 1 mL.</li>\n<li>Missing the Zanca view and MRI for osteolysis.</li>\n</ul></div>"], "refs": ["Schaefer MP, Fox K. Ultrasound-guided shoulder joint and bursa injections. In: Narouze SN, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer; 2018. Ch. 26, AC joint pp. 258–260.", "McDonald JK, Peng P. Shoulder. In: Peng P, et al., eds. <em>Ultrasound for Interventional Pain Management</em>. Springer; 2020. Ch. 19, AC joint pp. 223–224 and 229–230.", "Baxi N, Spinner DA. Shoulder. In: Spinner DA, Kirschner JS, Herrera JE, eds. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer; 2014. Ch. 2, pp. 9–11.", "Peng PWH, Cheng P. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part III: shoulder. <em>Reg Anesth Pain Med</em> 2011;36:592–605.", "Peck E, Lai JK, Pawlina W, Smith J. Accuracy of ultrasound-guided versus palpation-guided acromioclavicular joint injections: a cadaveric study. <em>PM R</em> 2010;2:817–821.", "Sabeti-Aschraf M, et al. Ultrasound guidance improves the accuracy of the acromioclavicular joint infiltration: a prospective randomized study. <em>Knee Surg Sports Traumatol Arthrosc</em> 2011;19:292–295."]}, "6.4": {"title": "Shoulder pain, frozen shoulder", "vignette": "A 54-year-old female schoolteacher presents with a 4-month history of left shoulder pain. Two months before it started, she broke her left wrist and wore a sling for 5 weeks. The pain came on gradually, is felt deep in the shoulder and spreads down the outer arm to the elbow. It is severe at night, and she cannot lie on either side. Over the last 6 weeks she has found it increasingly hard to fasten her bra, reach her back pocket or write on the top of the whiteboard. She has type 2 diabetes and takes metformin. Her family doctor's X-ray of the shoulder was reported as normal. Paracetamol and ibuprofen help little. A physiotherapist tried stretching, which made the pain much worse.", "clues": "<strong>Clues to underline:</strong> age 40–60, female, diabetes, period of immobilisation, severe night pain, progressive loss of movement (behind the back, then overhead), normal X-ray, aggressive stretching made it worse. <strong>Planted distractors:</strong> the recent wrist fracture (think CRPS), pain radiating to the elbow (think C5 radiculopathy or a cuff tear).", "pe": "STD", "answers": ["<p><strong>Most likely:</strong> adhesive capsulitis, secondary to immobilisation, with diabetes as a risk factor; currently in the painful freezing phase (stage 1–2).</p>\n<p><strong>Differential diagnosis</strong></p>\n<ul>\n<li>Glenohumeral osteoarthritis (normal X-ray argues against)</li>\n<li>Locked posterior dislocation (always rule out with an axillary view)</li>\n<li>Calcific tendinitis, or a large rotator cuff tear with secondary stiffness</li>\n<li>Subacromial impingement with pain-limited movement (passive range would be preserved)</li>\n<li>CRPS type I after the wrist fracture (shoulder–hand syndrome)</li>\n<li>Inflammatory arthritis, septic arthritis</li>\n<li>C5 radiculopathy</li>\n<li>Tumour: proximal humerus metastasis, apical lung tumour (night pain is a red flag)</li>\n</ul>", "<p><strong>Positioning:</strong> standing for inspection and active movement, then supine for passive range (the scapula is fixed, so glenohumeral motion is measured accurately).</p>\n<p><strong>Inspection:</strong> muscle wasting, scapular position, swelling; look at the left hand for CRPS signs (colour, sweating, swelling, skin and nail changes).</p>\n<p><strong>Neurological examination with tools:</strong> reflex hammer (biceps, brachioradialis, triceps); Neurotip and light touch in C5–T1 dermatomes and the axillary nerve patch; MRC power (often limited by pain, so note it); cervical range and Spurling test.</p>\n<p><strong>Musculoskeletal examination</strong></p>\n<ul>\n<li>Active and passive range in all planes with a goniometer, compared with the right side.</li>\n<li><strong>Capsular pattern:</strong> passive external rotation lost most, then abduction, then internal rotation. Loss of passive external rotation of 50% or more with the arm by the side is the key sign.</li>\n<li>Hard, painful end-feel; scapula moving early (shrug sign).</li>\n<li>Cuff strength tests within the available range (normal strength argues against a large tear).</li>\n<li>Impingement tests are positive but not specific in frozen shoulder.</li>\n<li>Hand: temperature and swelling compared with the right; allodynia with cotton wool (CRPS).</li>\n</ul>\n<div class=\"tip\"><b>Examiner tip:</b>measure external rotation with the elbow at the side and say \"capsular pattern\". Examine the hand to deal with the CRPS distractor.</div>", "<ul>\n<li><strong>X-ray:</strong> AP and <strong>axillary view</strong>, to exclude glenohumeral OA, calcific deposits and a locked posterior dislocation. In frozen shoulder it is normal.</li>\n<li><strong>Ultrasound:</strong> coracohumeral ligament (CHL) thickened compared with the other side; soft tissue thickening and Doppler hyperaemia in the rotator interval; limited sliding of the supraspinatus under the acromion during abduction; excludes a cuff tear and calcific tendinitis.</li>\n<li><strong>MRI or MR arthrogram:</strong> only if the picture is unclear. Signs: CHL thickening, obliterated fat in the rotator interval (subcoracoid triangle), thickened axillary recess capsule (above about 4 mm), small joint volume.</li>\n<li><strong>Bloods:</strong> HbA1c (control matters for steroid and for prognosis); TSH; lipids; ESR and CRP if inflammatory arthritis or infection is possible.</li>\n<li><strong>Staging:</strong> freezing (painful), frozen (stiff), thawing (recovery). Natural history 1–3 years; a minority keep some stiffness.</li>\n</ul>", "<p><strong>Set-up:</strong> machine opposite, screen in line of sight; patient and operator details entered; transducer cleaned; gloves on. Linear 6–15 MHz probe; a curvilinear 2–6 MHz probe may be needed for the posterior joint in a large shoulder. Patient seated on a stool.</p>\n<p><strong>Systematic overview:</strong></p>\n<ol>\n<li>Long head of biceps in the groove (fluid in the sheath reflects joint effusion).</li>\n<li><strong>Rotator interval:</strong> probe oblique between the coracoid and the greater tuberosity. Measure CHL thickness and compare with the right; look for hypoechoic soft tissue around the biceps.</li>\n<li>Subscapularis in long axis with passive external rotation.</li>\n<li>Supraspinatus in the modified Crass position (she may not reach it; use neutral if not).</li>\n<li>Posterior joint: infraspinatus, posterior labrum and capsule, effusion.</li>\n<li>Axillary recess (probe in the axilla with the arm slightly abducted): capsule thickness.</li>\n</ol>\n<p><strong>Doppler:</strong> power Doppler in the rotator interval; hyperaemia supports early, inflammatory frozen shoulder.</p>\n<p><strong>Dynamic test:</strong> probe in the coronal plane at the acromion during passive abduction; restricted sliding of the supraspinatus under the acromion. Passive external rotation while watching the subscapularis shows the limited glide.</p>\n<p><strong>Structures to be able to name:</strong> coracoid, coracohumeral ligament, rotator interval, long head of biceps, subscapularis, supraspinatus, humeral head and cartilage, deltoid, infraspinatus, posterior labrum, glenoid, axillary recess.</p>", "<ul>\n<li><strong>Education:</strong> self-limiting but slow (often 1–3 years); reassure, and set expectations.</li>\n<li><strong>Analgesia:</strong> paracetamol, NSAIDs if tolerated, short-term night analgesia; a short course of oral prednisolone gives short-term relief but less than an injection, and raises glucose.</li>\n<li><strong>Physiotherapy:</strong> gentle range-of-motion exercises within pain limits in the freezing phase; more forceful stretching only once pain settles (frozen phase). Heat before exercise.</li>\n<li><strong>Treat risk factors:</strong> glucose control.</li>\n<li><strong>TENS</strong> for pain relief (weak evidence).</li>\n</ul>", "<p><strong>US-guided glenohumeral joint corticosteroid injection, posterior approach, with or without hydrodilatation (capsular distension).</strong></p>\n<ul>\n<li>Intra-articular steroid gives the best early pain relief of the available treatments, especially in the first months (Challoumas 2020).</li>\n<li>US guidance gives about 92–99% accuracy, against 27–72% blind (Spinner 2014 review); Rutten 2009 reported 94% first-attempt success with US.</li>\n<li>Hydrodilatation adds short-term benefit in some studies; no approach (posterior, rotator interval or subacromial) has been shown to be clearly better.</li>\n<li>Adjunct: suprascapular nerve block for pain, so she can do physiotherapy.</li>\n<li>Later: manipulation under anaesthesia or arthroscopic capsular release if stiffness persists beyond 6–12 months of good treatment.</li>\n</ul>", "<ol>\n<li>Consent; check allergies, anticoagulation and blood glucose (HbA1c).</li>\n<li>Patient seated (or lateral decubitus, affected side up), hand on the opposite shoulder to open the posterior joint; machine opposite.</li>\n<li>Sterile skin prep (chlorhexidine), sterile probe cover and gel.</li>\n<li>Probe in the transverse plane just below and parallel to the scapular spine. Identify the humeral head, the triangular hyperechoic posterior labrum, the glenoid and the infraspinatus over them.</li>\n<li>Local anaesthetic skin wheal.</li>\n<li><strong>Needle:</strong> 22G 90 mm spinal needle (or 22G 50 mm in a slim shoulder), in plane from lateral to medial.</li>\n<li><strong>Target:</strong> between the humeral head cartilage and the posterior labrum, deep to the capsule. Avoid the cartilage and the labrum.</li>\n<li><strong>Test injection:</strong> fluid should spread medially and lift the posterior capsule. If there is resistance, the tip may be in cartilage: withdraw slightly or rotate the bevel.</li>\n<li><strong>Injectate:</strong> triamcinolone 40 mg or methylprednisolone 40 mg with 4–5 mL of 1% lidocaine or 0.5% ropivacaine.</li>\n<li><strong>Hydrodilatation (optional):</strong> continue with saline in 5 mL steps up to about 20–30 mL, watching the capsule distend; stop if the patient cannot tolerate it, or when the capsule ruptures (a sudden loss of resistance).</li>\n<li>Do not go too far medially, towards the spinoglenoid notch, where the suprascapular nerve and vessels run.</li>\n<li>Afterwards: gentle range of motion straight away; supervised physiotherapy from about 1 week.</li>\n</ol>", "<ul>\n<li><strong>Common:</strong> post-injection pain flare; raised blood glucose for 2–5 days (advise extra monitoring); facial flushing.</li>\n<li><strong>Joint:</strong> septic arthritis (rare), cartilage injury from the needle, chondrotoxicity of high-dose local anaesthetic (use the lowest effective concentration).</li>\n<li><strong>Hydrodilatation:</strong> pain during distension, capsular rupture with fluid in the muscles (usually harmless).</li>\n<li><strong>Neurovascular:</strong> injury to the suprascapular nerve or vessels if the needle goes too medial; vasovagal reaction.</li>\n<li><strong>Other:</strong> allergy, local anaesthetic toxicity, skin atrophy if injected superficially.</li>\n</ul>", "<ul>\n<li><strong>Immediately:</strong> pain relief and passive range (external rotation) after the local anaesthetic; neurological check; blood glucose plan.</li>\n<li><strong>At 2–6 weeks:</strong> night pain, pain scores, passive external rotation and abduction measured with a goniometer, function score (SPADI or Oxford Shoulder Score).</li>\n<li><strong>Rehabilitation:</strong> progress stretching as pain allows; home programme.</li>\n<li><strong>Repeat:</strong> up to 3 injections, at least 6 weeks apart, if each helped.</li>\n<li><strong>Escalate:</strong> refer for capsular release or manipulation if stiffness remains after 6–12 months; re-image if the course is unusual (red flags, progressive weakness).</li>\n</ul><div class=\"tip\"><b>Where marks are lost</b><ul>\n<li>Not measuring passive external rotation, or not naming the capsular pattern.</li>\n<li>Not asking for an axillary view to exclude a locked posterior dislocation.</li>\n<li>Missing the diabetes link: glucose before and after steroid.</li>\n<li>No mention of hydrodilatation or the suprascapular nerve block as options.</li>\n</ul></div>"], "refs": ["Schaefer MP, Fox K. Ultrasound-guided shoulder joint and bursa injections. In: Narouze SN, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer; 2018. Ch. 26, glenohumeral joint pp. 259–262.", "McDonald JK, Peng P. Shoulder. In: Peng P, et al., eds. <em>Ultrasound for Interventional Pain Management</em>. Springer; 2020. Ch. 19, rotator interval approach pp. 225–226, posterior approach p. 227.", "Baxi N, Spinner DA. Shoulder. In: Spinner DA, Kirschner JS, Herrera JE, eds. <em>Atlas of Ultrasound Guided Musculoskeletal Injections</em>. Springer; 2014. Ch. 2, pp. 11–13.", "Peng PWH, Cheng P. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part III: shoulder. <em>Reg Anesth Pain Med</em> 2011;36:592–605.", "Challoumas D, et al. Comparison of treatments for frozen shoulder: a systematic review and meta-analysis. <em>JAMA Netw Open</em> 2020;3:e2029581.", "Rutten MJCM, et al. Glenohumeral joint injection: a comparative study of ultrasound and fluoroscopically guided techniques before MR arthrography. <em>Eur Radiol</em> 2009;19:722–730.", "Buchbinder R, Green S, Youd JM, Johnston RV. Arthrographic distension for adhesive capsulitis (frozen shoulder). <em>Cochrane Database Syst Rev</em> 2008;(1):CD007005."]}, "9.1": {"title": "Lumbar facet pain", "vignette": "A 63-year-old retired bus driver presents with an 18-month history of low back pain across both sides of the lower back, worse on the right. The pain is worst after standing for a long time, walking downhill, and getting up from a chair; it eases when he sits or lies down. He is stiff for about 20 minutes in the morning. The pain spreads into both buttocks and sometimes to the back of the right thigh, but never below the knee. There is no numbness or weakness, and no bladder or bowel change. He had a coronary stent 2 years ago and takes aspirin. His BMI is 28. Twelve weeks of physiotherapy, paracetamol and a course of naproxen gave little benefit, and he stopped the naproxen because of indigestion.", "clues": "<strong>Clues to underline:</strong> age over 60, axial pain, worse with standing, extension and getting up, eased by sitting, morning stiffness under 30 minutes, referral to buttock and thigh but not below the knee, no neurological symptoms. <strong>Planted distractors:</strong> thigh referral (think radiculopathy), walking-related pain at his age (think neurogenic claudication), aspirin (do you stop it?).", "pe": "STD", "answers": ["<p><strong>Most likely:</strong> lumbar facet joint pain from facet arthropathy at the lower lumbar levels; referral to the buttock and thigh above the knee is typical somatic referred pain.</p>\n<p><strong>Differential diagnosis</strong></p>\n<ul>\n<li>Discogenic pain (worse sitting and bending forward)</li>\n<li>Sacroiliac joint pain (pain below L5, over the sulcus)</li>\n<li>Lumbar spinal stenosis with neurogenic claudication</li>\n<li>Degenerative spondylolisthesis with instability</li>\n<li>Myofascial pain (quadratus lumborum, gluteal muscles)</li>\n<li>Hip osteoarthritis referring to the buttock and thigh</li>\n<li>Osteoporotic vertebral fracture</li>\n<li>Red flags at his age: malignancy (metastasis, myeloma), infection, abdominal aortic aneurysm</li>\n</ul>", "<p><strong>Positioning:</strong> standing (posture, gait, heel and toe walking, range of motion), then supine (neurological and hip examination), then prone (palpation, SIJ, facet loading).</p>\n<p><strong>Neurological examination with tools:</strong></p>\n<ul>\n<li>Reflex hammer: knee (L3–L4) and ankle (S1) reflexes, plantar responses.</li>\n<li>Neurotip and light touch in L2–S1 dermatomes; monofilament and 128 Hz tuning fork at the feet (to exclude neuropathy).</li>\n<li>MRC power: hip flexion (L2), knee extension (L3), ankle dorsiflexion (L4), great toe extension (L5), plantarflexion (S1).</li>\n<li>Neural tension: straight leg raise, slump test, femoral stretch test (all should be negative).</li>\n</ul>\n<p><strong>Musculoskeletal examination</strong></p>\n<ul>\n<li>Lumbar range: flexion (Schober test) and extension; pain on extension and on returning from flexion.</li>\n<li>Extension–rotation (Kemp) test; paraspinal tenderness over the facets.</li>\n<li>No single test is diagnostic. Revel's criteria (older age, relief lying down, no worse with cough, flexion, rising from flexion, hyperextension or extension–rotation) have limited predictive value.</li>\n<li>Sacroiliac provocation tests (distraction, compression, thigh thrust, Gaenslen, sacral thrust): 3 or more positive suggests SIJ pain.</li>\n<li>Hip: range (internal rotation), FABER and FADIR, to exclude hip OA.</li>\n<li>Abdomen: palpate for an aortic aneurysm; peripheral pulses (vascular claudication).</li>\n</ul>\n<div class=\"tip\"><b>Examiner tip:</b>say that there is no reliable clinical test for facet pain. The diagnosis is made with controlled blocks.</div>", "<ul>\n<li><strong>X-ray:</strong> AP and lateral, with flexion–extension views if instability is suspected: facet arthropathy, disc height, spondylolisthesis, fractures.</li>\n<li><strong>MRI:</strong> to exclude other causes and red flags, and to assess stenosis; facet effusion and bone marrow oedema around the joint support active facet pain. Imaging changes are common in people without pain, so they cannot confirm the diagnosis.</li>\n<li><strong>SPECT-CT:</strong> increased uptake in a facet joint may predict a better response to blocks.</li>\n<li><strong>Bloods</strong> only with red flags: FBC, ESR, CRP, PSA, protein electrophoresis.</li>\n<li><strong>Diagnostic medial branch blocks:</strong> the reference standard. The 2020 multisociety consensus suggests at least 50% relief as the threshold; dual comparative blocks (short- and long-acting local anaesthetic) reduce false positives, which can occur in about 25–40% of single blocks.</li>\n</ul>", "<p><strong>Set-up:</strong> machine on the opposite side of the table, screen in line of sight; patient and operator details entered; transducer cleaned; gloves on. <strong>Curvilinear 2–6 MHz probe</strong>, abdominal or spine preset, depth 6–8 cm, focus at the transverse process. Patient prone with a pillow under the abdomen to reduce the lordosis.</p>\n<p><strong>Regional overview and level counting:</strong></p>\n<ol>\n<li><strong>Paramedian sagittal scan from the sacrum:</strong> the flat bright sacrum, the L5–S1 gap, then the laminae as a \"sawtooth\" upwards. Mark each level on the skin.</li>\n<li><strong>Paramedian sagittal transverse process view:</strong> the \"trident\" of transverse process shadows with psoas between them; count from the sacrum.</li>\n<li><strong>Transverse interlaminar view at each level:</strong> spinous process, lamina, facet joint, superior articular process (SAP), transverse process (TP), the posterior dura and anterior complex in the interlaminar window.</li>\n</ol>\n<p><strong>Focus:</strong> the junction of the SAP and the cephalad edge of the TP at L3, L4 and L5 (the medial branch targets), and the junction of the S1 SAP with the sacral ala (L5 dorsal ramus).</p>\n<p><strong>Measurement:</strong> skin-to-target depth for needle planning; compare both sides' facets (joint gap, effusion, hypertrophy).</p>\n<p><strong>Doppler:</strong> colour Doppler near the target and the intervertebral foramen (lumbar segmental arteries).</p>\n<p><strong>Dynamic test:</strong> gentle flexion of the trunk (or hips over the pillow) opens the interlaminar and facet windows; scan while the patient breathes to separate muscle from bone.</p>\n<p><strong>Structures to be able to name:</strong> spinous process, lamina, facet joint, SAP, inferior articular process, TP, intertransverse ligament, psoas, erector spinae and multifidus, ligamentum flavum–posterior dura complex, intrathecal space, anterior complex, sacrum, sacral ala, iliac crest.</p>", "<ul>\n<li><strong>Education and reassurance;</strong> stay active.</li>\n<li><strong>Exercise therapy:</strong> core stabilisation, flexion-biased programme, aerobic conditioning; weight management.</li>\n<li><strong>Medication:</strong> paracetamol (limited benefit); topical NSAIDs; oral NSAIDs only with gastroprotection and cardiac caution (he has a stent); duloxetine for chronic low back pain. Avoid long-term opioids.</li>\n<li><strong>Psychological input:</strong> CBT within a multidisciplinary programme if pain is affecting function and mood.</li>\n<li><strong>Adjuncts with weak evidence:</strong> TENS, manual therapy, acupuncture.</li>\n</ul>", "<p><strong>US-guided diagnostic lumbar medial branch blocks</strong> at L3 and L4 medial branches and the L5 dorsal ramus (to cover the L4–L5 and L5–S1 joints), right side first or both sides; <strong>then radiofrequency ablation</strong> of the same nerves if the blocks are positive.</p>\n<ul>\n<li>Each facet joint is supplied by the medial branch at its own level and the level above, so two nerves per joint are blocked.</li>\n<li>Medial branch blocks predict RF outcome better than intra-articular facet injections; intra-articular steroid has limited long-term benefit.</li>\n<li>US accuracy: Greher 2004 found 89% of needles at the target on CT; Shim 2006 found about 95% correct on fluoroscopy. Accuracy falls in obesity (Rauch 2009). US cannot detect intravascular spread, so fluoroscopy with contrast remains the reference standard, and RF ablation is normally done under fluoroscopy.</li>\n</ul>", "<ol>\n<li>Consent; explain the pain diary. Aspirin can continue for medial branch blocks (low bleeding risk, ASRA guidance).</li>\n<li>Prone with a pillow under the abdomen; machine opposite.</li>\n<li>Count and mark the levels with the sagittal scans (see Q4).</li>\n<li>Sterile prep (chlorhexidine), sterile probe cover and gel.</li>\n<li><strong>L3 and L4 medial branches:</strong> transverse view at the level; the target is the junction of the SAP with the cephalad edge of the TP. Use the cephalad edge: the bright line between transverse processes is the intertransverse ligament, and a needle that passes it heads for the foramen.</li>\n<li><strong>Needle:</strong> 22G 80–100 mm echogenic needle, in plane from lateral to medial, until the tip touches bone at the SAP–TP junction.</li>\n<li><strong>Confirm</strong> in the paramedian sagittal view that the tip sits on the cephalad edge of the TP, not between transverse processes.</li>\n<li><strong>L5 dorsal ramus:</strong> transverse view at L5–S1; out of plane, caudal to cephalad, to the junction of the S1 SAP and the sacral ala; confirm the tip has not passed into the L5–S1 foramen.</li>\n<li><strong>Injectate:</strong> 0.5 mL local anaesthetic per nerve (for example 2% lidocaine for the first block, 0.5% bupivacaine for the comparative block). No steroid for a diagnostic block. Use small volumes, which keeps the block specific.</li>\n<li>Watch for a small hypoechoic spread at the tip; no visible spread may mean intravascular injection.</li>\n<li>Record baseline pain, then pain during his usual provoking activities.</li>\n</ol>", "<ul>\n<li><strong>False results:</strong> intravascular uptake (false negative); spread to the foramen or a large volume (false positive); placebo response.</li>\n<li><strong>Neural:</strong> spread to the ventral ramus with temporary leg numbness or weakness (warn about walking and driving); nerve root injury if the needle enters the foramen.</li>\n<li><strong>Other:</strong> vasovagal reaction, bleeding or haematoma, infection, dural puncture with post-dural puncture headache (rare), local anaesthetic toxicity (rare with these volumes).</li>\n<li><strong>After RF ablation:</strong> neuritis and dysaesthesia, multifidus denervation, rarely burns.</li>\n</ul>", "<ul>\n<li><strong>Pain diary:</strong> pain scores every 30–60 minutes for 6–8 hours, while he does activities that normally hurt (standing, walking downhill, getting up). Relief should match the expected duration of the local anaesthetic.</li>\n<li><strong>Threshold:</strong> at least 50% relief of his index pain (some use 80% with dual comparative blocks) counts as positive.</li>\n<li><strong>Neurological check</strong> before discharge; no driving if the leg is numb.</li>\n<li><strong>If positive:</strong> repeat a comparative block, or go to RF ablation (expected relief 6–12 months, can be repeated). <strong>If negative:</strong> reconsider SIJ or discogenic pain.</li>\n<li>Continue the exercise programme alongside.</li>\n</ul><div class=\"tip\"><b>Where marks are lost</b><ul>\n<li>Blocking only one nerve per joint. Each joint needs two: L4–L5 joint needs L3 and L4 medial branches; L5–S1 joint needs L4 medial branch and L5 dorsal ramus.</li>\n<li>Not counting levels systematically from the sacrum.</li>\n<li>Using steroid or large volumes in a diagnostic block.</li>\n<li>Not admitting the limit of US: it cannot exclude intravascular injection.</li>\n<li>Forgetting red flags in a 63-year-old (aneurysm, malignancy).</li>\n</ul></div>"], "refs": ["Irwin DM, Gofeld M. Ultrasound-guided lumbar facet nerve block and intra-articular injection. In: Narouze SN, ed. <em>Atlas of Ultrasound-Guided Procedures in Interventional Pain Management</em>, 2nd ed. Springer; 2018. Ch. 10, pp. 117–123.", "Greher M, Peng P. Lumbar medial branches and L5 dorsal ramus. In: Peng P, et al., eds. <em>Ultrasound for Interventional Pain Management</em>. Springer; 2020. Ch. 14, pp. 169–180.", "Narouze S, Peng PWH. Ultrasound-guided interventional procedures in pain medicine: a review of anatomy, sonoanatomy, and procedures. Part II: axial structures. <em>Reg Anesth Pain Med</em> 2010;35:386–396.", "Greher M, et al. Ultrasound-guided lumbar facet nerve block: accuracy of a new technique confirmed by computed tomography. <em>Anesthesiology</em> 2004;101:1195–1200.", "Shim JK, et al. Ultrasound-guided lumbar medial-branch block: a clinical study with fluoroscopy control. <em>Reg Anesth Pain Med</em> 2006;31:451–454.", "Rauch S, et al. Ultrasound-guided lumbar medial branch block in obese patients: a fluoroscopically confirmed clinical feasibility study. <em>Reg Anesth Pain Med</em> 2009;34:340–342.", "Cohen SP, et al. Consensus practice guidelines on interventions for lumbar facet joint pain from a multispecialty, international working group. <em>Reg Anesth Pain Med</em> 2020;45:424–467."]}};

let current="6.2", step=0, timerId=null;

    return `<li class="grp">${ti+1}. ${t}</li>`+rows.map(c=>{const ready=!!CASES[c[0]];

  ul.querySelectorAll("button").forEach(b=>b.onclick=()=>{location.hash="case-"+b.dataset.id.replace(".","-")});
  const n=Object.keys(CASES).length;document.getElementById("progress").textContent=n+" of "+CASE_LIST.length+" cases ready";
}
function state(n){return store.get("cips-viva-"+n,{answers:{},scores:{},pe:{},us:[]})}
function save(n,s){store.set("cips-viva-"+n,s)}

    <div class="row">${Object.keys(CASES).map(k=>`<button class="btn" onclick="location.hash='case-${k.replace(".","-")}'">Try case ${k}: ${CASES[k].title}</button>`).join("")}</div></div>`;return;
  }
  const s=state(current);
  main.innerHTML=`<div class="case-head"><span class="eyebrow">Case ${current} · ${TOPICS[+current.split(".")[0]-1]}</span><h2>${c.title}</h2></div>
  <div class="card vignette"><p style="margin-top:0">${c.vignette}</p>
   <div class="row"><button class="btn" id="tbtn">Start 5-minute reading time</button><span class="timer" id="timer">5:00</span>

  let left=300;

      t.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(timerId);t.textContent="Time"}},1000)};

}

function bandUS(n){return n<=3?1:n<=6?2:n<=9?3:4}
function renderStep(){
  const c=CASES[current], s=state(current);
  document.getElementById("steps").innerHTML=QUESTIONS.map((q,i)=>`<button aria-current="${i===step}" class="${s.scores[i]?"done":""}" title="${esc(q)}">Q${i+1}</button>`).join("");
  document.querySelectorAll("#steps button").forEach((b,i)=>b.onclick=()=>{step=i;renderStep()});
  const q=document.getElementById("q");
  let scoring="";
  if(step===1){
    const rows=[["positioning","Positioning"],["neuro","Neurological exam"],["msk","MSK exam"]];
    scoring=`<label class="small">Rate your examination: each row scores 1–4, summed</label>`+rows.map(([k,lab])=>`<div style="margin:8px 0"><b>${lab}</b><div class="score">${c.pe[k].map((t,i)=>`<button data-pe="${k}" data-v="${i+1}" aria-pressed="${s.pe[k]===i+1}"><b>${i+1}</b>${t}</button>`).join("")}</div></div>`).join("")+
    `<p>Total: <span class="band" id="petotal"></span></p>`;
  } else if(step===3){
    scoring=`<label class="small">Tick each step you did and said aloud</label><ul class="check">${US_CHECK.map((t,i)=>`<li><label><input type="checkbox" id="us${i}" ${s.us.includes(i)?"checked":""}>${t}</label></li>`).join("")}</ul>
    <p><span class="band" id="uscount"></span> → score <span class="band" id="usband"></span> <span class="refs">(0–3 = 1, 4–6 = 2, 7–9 = 3, 10–12 = 4)</span></p>`;
  } else {
    scoring=`<label class="small">Rate your answer against the model</label><div class="score">${SCALE.map(([v,t])=>`<button data-v="${v}" aria-pressed="${s.scores[step]===v}"><b>${v}</b>${t}</button>`).join("")}</div>`;
  }
  q.innerHTML=`<span class="eyebrow">Question ${step+1} of 9</span><h3>${QUESTIONS[step]}</h3>
   <label class="small" for="ans">Your answer (type it as you would say it)</label>
   <textarea id="ans">${esc(s.answers[step]||"")}</textarea>
   <div class="row" style="margin-top:10px"><button class="btn primary" id="rev">Reveal model answer</button></div>
   <div class="model" id="model" hidden>${c.answers[step]}${scoring}</div>
   <div class="nav"><button class="btn" id="prev" ${step===0?"disabled":""}>Previous</button><button class="btn" id="next">${step===8?"Finish":"Next question"}</button></div>`;
  document.getElementById("ans").oninput=e=>{const st=state(current);st.answers[step]=e.target.value;save(current,st)};
  document.getElementById("rev").onclick=e=>{const m=document.getElementById("model");m.hidden=!m.hidden;e.target.textContent=m.hidden?"Reveal model answer":"Hide model answer"};
  if(s.scores[step]){document.getElementById("model").hidden=false;document.getElementById("rev").textContent="Hide model answer"}
  document.getElementById("prev").onclick=()=>{step--;renderStep()};
  document.getElementById("next").onclick=()=>{if(step<8){step++;renderStep()}else document.getElementById("sum").scrollIntoView({behavior:"smooth"})};
  q.querySelectorAll(".score button[data-v]:not([data-pe])").forEach(b=>b.onclick=()=>{const st=state(current);st.scores[step]=+b.dataset.v;save(current,st);renderStep()});
  q.querySelectorAll("button[data-pe]").forEach(b=>b.onclick=()=>{const st=state(current);st.pe[b.dataset.pe]=+b.dataset.v;
    if(Object.keys(st.pe).length===3)st.scores[1]=Object.values(st.pe).reduce((a,b)=>a+b,0);save(current,st);renderStep()});
  if(step===1){const t=Object.values(s.pe);document.getElementById("petotal").textContent=t.length===3?t.reduce((a,b)=>a+b,0)+" / 12":"rate all three rows"}
  if(step===3){const upd=()=>{const st=state(current);st.us=US_CHECK.map((_,i)=>i).filter(i=>document.getElementById("us"+i).checked);
      st.scores[3]=bandUS(st.us.length);save(current,st);document.getElementById("uscount").textContent=st.us.length+" of 12";document.getElementById("usband").textContent=st.scores[3];renderSummary()};
    US_CHECK.forEach((_,i)=>document.getElementById("us"+i).onchange=upd);
    document.getElementById("uscount").textContent=s.us.length+" of 12";document.getElementById("usband").textContent=bandUS(s.us.length);}
  renderSummary();
}
function renderSummary(){

const MCQ={"1-1": [{"d": "G", "q": "Increasing the frequency of the ultrasound transducer will:", "o": ["Increase the depth of penetration and improve axial resolution.", "Decrease the depth of penetration and decrease axial resolution.", "Increase the depth of penetration and decrease axial resolution.", "Decrease the depth of penetration and improve axial resolution."], "a": 3, "why": "Higher frequency gives a shorter wavelength: better axial resolution, but more attenuation and less penetration.", "ref": "Peng 2020 ch1; Jacobson ch1", "kw": ["frequency", "wavelength", "axial resolution", "attenuation", "penetration"], "x": ["Penetration falls, not rises, as frequency increases (more attenuation).", "Half right: penetration falls, but axial resolution improves.", "This is what happens when you LOWER the frequency (e.g. curvilinear probe for deep targets).", ""]}, {"d": "G", "q": "A normal tendon that appears hypoechoic when the ultrasound beam is not perpendicular to its fibres is an example of:", "o": ["Anisotropy", "Reverberation artefact", "Posterior acoustic enhancement", "Mirror-image artefact"], "a": 0, "why": "Anisotropy: fibrillar tissue (tendon, ligament) looks falsely hypoechoic when the beam is not perpendicular, and can mimic tendinosis or tear.", "ref": "Jacobson ch1, ch3", "kw": ["anisotropy", "fibrillar tissue", "beam angle", "heel-toe", "tendon"], "x": ["", "Reverberation = repeated, equally spaced parallel echoes between two strong reflectors (e.g. a needle).", "Posterior enhancement = a bright area deep to fluid, not a dark tendon.", "Mirror image = a duplicate structure displayed deep to a strong curved reflector (e.g. pleura)."]}, {"d": "G", "q": "Posterior acoustic enhancement is MOST typically seen deep to:", "o": ["Cortical bone", "A calcific deposit in a tendon", "A simple fluid-filled ganglion cyst", "Air in the soft tissues"], "a": 2, "why": "Increased through-transmission occurs deep to fluid (and some solid tumours); bone, calcium and air cause shadowing.", "ref": "Jacobson ch1", "kw": ["through-transmission", "fluid", "cyst", "low attenuation"], "x": ["Bone reflects almost all sound and casts a posterior shadow.", "Calcific deposits cast a shadow.", "", "Gas casts a 'dirty' shadow with reverberation."]}, {"d": "C", "q": "According to the NeuPSIG recommendations, which of the following is a FIRST-line drug for neuropathic pain?", "o": ["Tramadol", "Lidocaine 5% patch", "Botulinum toxin type A", "Duloxetine"], "a": 3, "why": "First line: SNRIs (duloxetine, venlafaxine), TCAs, gabapentin, pregabalin. Lidocaine patch and tramadol are second line; botulinum toxin A is third line.", "ref": "Finnerup NB et al. Lancet Neurol 2015;14:162–73", "kw": ["NeuPSIG", "first line", "SNRI", "TCA", "gabapentinoid"], "x": ["Tramadol is second line.", "Lidocaine 5% patch is second line (peripheral, localised pain).", "Botulinum toxin A is third line (specialist use).", ""]}, {"d": "C", "q": "The Budapest CLINICAL diagnostic criteria for complex regional pain syndrome require, in addition to continuing disproportionate pain:", "o": ["At least one symptom in all four categories and at least one sign in two or more categories", "At least one symptom in three of the four categories and at least one sign in two or more categories", "At least one symptom in two categories and at least one sign in three or more categories", "At least one sign in all four categories, symptoms not required"], "a": 1, "why": "Clinical criteria: at least 1 symptom in 3 of 4 categories and at least 1 sign in 2 or more categories. Option A describes the stricter research criteria.", "ref": "Harden RN et al. Pain 2010;150:268–74", "kw": ["Budapest", "CRPS", "clinical criteria", "3 of 4 symptoms", "2 of 4 signs"], "x": ["Symptoms in all four categories = the stricter RESEARCH criteria.", "", "The numbers are reversed.", "Symptoms are required; signs alone are not enough."]}, {"d": "C", "q": "Which of the following is a “yellow flag” for chronicity in a patient with low back pain?", "o": ["Unexplained weight loss", "Saddle anaesthesia", "Fear-avoidance beliefs", "Fever with a history of intravenous drug use"], "a": 2, "why": "Yellow flags are psychosocial predictors of chronicity (fear-avoidance, catastrophising, low mood). The other options are red flags for serious pathology.", "ref": "Kendall, Linton & Main 1997 (NZ yellow flags guide); NICE NG59", "kw": ["yellow flags", "psychosocial", "fear-avoidance", "chronicity"], "x": ["Red flag for malignancy.", "Red flag for cauda equina syndrome.", "", "Red flag for spinal infection (discitis, epidural abscess)."]}, {"d": "S", "q": "The L4–L5 zygapophysial (facet) joint receives its nerve supply from the medial branches of the dorsal rami of:", "o": ["L4 and L5", "L3 and L4", "L4 only", "L5 and the L5 dorsal ramus at the sacral ala"], "a": 1, "why": "Each lumbar facet joint has dual innervation from the medial branches at the same level and the level above, so L4–L5 = L3 and L4 medial branches.", "ref": "Peng 2020 ch14; Narouze 2e lumbar facet chapter", "kw": ["dual innervation", "medial branch", "same level + level above", "L4–L5 facet"], "x": ["One level too low: L4 and L5 nerves are wrong for L4–L5 (the L5–S1 joint uses the L4 medial branch + L5 dorsal ramus).", "", "Ignores dual innervation; a single-nerve block is incomplete.", "These supply the L5–S1 joint region, not L4–L5."]}, {"d": "S", "q": "On a short-axis ultrasound scan of the lateral neck for selective nerve root block, a transverse process with a prominent posterior tubercle and a rudimentary or absent anterior tubercle identifies:", "o": ["C7", "C6", "C5", "C4"], "a": 0, "why": "Only C3–C6 regularly show both anterior and posterior tubercles; C7 has only a posterior tubercle. The vertebral artery is seen anterior to the C7 transverse process.", "ref": "Narouze 2e ch5, ch8; Peng 2020 ch12", "kw": ["C7", "posterior tubercle only", "vertebral artery", "level counting"], "x": ["", "C6 has the most prominent anterior tubercle (Chassaignac's).", "C5 shows both anterior and posterior tubercles ('U' shape).", "C4 shows both anterior and posterior tubercles."]}, {"d": "S", "q": "The third occipital nerve is the:", "o": ["Deep medial branch of the C3 dorsal ramus that wraps around the waist of the C3 articular pillar", "Medial branch of the C2 dorsal ramus", "Lateral branch of the C3 dorsal ramus", "Superficial medial branch of the C3 dorsal ramus that crosses the C2–C3 zygapophysial joint"], "a": 3, "why": "The superficial medial branch of C3 is large (the TON) and curves around the C2–C3 joint, supplying it. The deep medial branch supplies C3–C4.", "ref": "Narouze 2e ch6", "kw": ["third occipital nerve", "superficial medial branch", "C3 dorsal ramus", "C2–C3 joint", "headache"], "x": ["The deep medial branch of C3 supplies the C3–C4 joint, not C2–C3.", "The medial branch of the C2 dorsal ramus is the greater occipital nerve.", "Lateral branches supply the paraspinal muscles; the TON is a medial branch.", ""]}, {"d": "S", "q": "In the transverse interlaminar view of the lumbar spine, the “anterior complex” includes all of the following EXCEPT:", "o": ["Posterior longitudinal ligament", "Anterior dura", "Ligamentum flavum", "Posterior cortex of the vertebral body"], "a": 2, "why": "The anterior complex = posterior vertebral body cortex + PLL + anterior dura (indistinguishable on US). Ligamentum flavum is part of the posterior complex.", "ref": "Peng 2020 ch14; Narouze 2e neuraxial chapter", "kw": ["anterior complex", "posterior longitudinal ligament", "anterior dura", "vertebral body"], "x": ["PLL is part of the anterior complex.", "Anterior dura is part of the anterior complex.", "", "Posterior vertebral body cortex is part of the anterior complex."]}, {"d": "P", "q": "At the suprascapular notch, the suprascapular artery MOST commonly:", "o": ["Passes superficial to the superior transverse scapular ligament", "Passes beneath the superior transverse scapular ligament with the nerve", "Lies on the floor of the notch, deep to the nerve", "Is absent and replaced by a branch of the posterior circumflex humeral artery"], "a": 0, "why": "The suprascapular artery and vein usually run above the ligament and the nerve below it. Rarely the artery passes through the notch with the nerve.", "ref": "Narouze 2e ch25; Peng 2020 ch4", "kw": ["suprascapular notch", "transverse scapular ligament", "artery above", "nerve below"], "x": ["", "Artery under the ligament with the nerve is an uncommon variant.", "The nerve, not the artery, lies under the ligament in the notch.", "The artery (from the thyrocervical trunk) is normally present."]}, {"d": "P", "q": "Near the anterior superior iliac spine, the ilioinguinal and iliohypogastric nerves are MOST consistently found between:", "o": ["External oblique and internal oblique", "Internal oblique and transversus abdominis", "Transversus abdominis and transversalis fascia", "Subcutaneous tissue and the external oblique aponeurosis"], "a": 1, "why": "Lateral and superior to the ASIS the II and IH nerves lie in the plane between internal oblique and transversus abdominis in about 90% of cases.", "ref": "Peng 2020 ch6", "kw": ["ilioinguinal", "iliohypogastric", "ASIS", "internal oblique", "transversus abdominis"], "x": ["The nerves reach the EO–IO plane only more medially, after piercing internal oblique.", "", "Deep to transversus = transversalis fascia, risking peritoneum and bowel.", "Only distal cutaneous branches reach the subcutaneous plane."]}, {"d": "P", "q": "For the proximal ultrasound-guided greater occipital nerve block at the level of C2, the nerve lies between:", "o": ["Trapezius and splenius capitis", "Rectus capitis posterior major and minor", "Obliquus capitis superior and inferior", "Obliquus capitis inferior (deep) and semispinalis capitis (superficial)"], "a": 3, "why": "The GON ascends on the dorsal surface of obliquus capitis inferior and is sandwiched between it and semispinalis capitis before piercing the latter.", "ref": "Narouze 2e occipital nerve chapter; Peng 2020 ch2", "kw": ["greater occipital nerve", "C2 level", "obliquus capitis inferior", "semispinalis capitis", "proximal approach"], "x": ["Trapezius/splenius is where the nerve lies distally, near the superior nuchal line.", "RCP major and minor form the medial suboccipital region, not the GON plane.", "OCS and OCI bound the suboccipital triangle (vertebral artery, suboccipital nerve).", ""]}, {"d": "P", "q": "At the level of the ischial spine, the pudendal nerve lies:", "o": ["Superficial to the sacrotuberous ligament", "Deep to the sacrospinous ligament, inside the pelvis", "Between the sacrotuberous and sacrospinous ligaments", "Within the belly of the piriformis muscle"], "a": 2, "why": "The pudendal nerve and internal pudendal artery run in the interligamentous plane between the sacrospinous and sacrotuberous ligaments, then into Alcock's canal.", "ref": "Narouze 2e pudendal chapter; Peng 2020 ch9", "kw": ["pudendal nerve", "ischial spine", "interligamentous plane", "sacrotuberous", "sacrospinous"], "x": ["Superficial to the sacrotuberous ligament lies gluteus maximus, not the nerve.", "The nerve is posterior to the sacrospinous ligament here, not inside the pelvis.", "", "Passing through piriformis is a sciatic nerve variant."]}, {"d": "P", "q": "During ultrasound-guided cervical sympathetic trunk (stellate ganglion) block at C6, the injectate should be placed:", "o": ["Inside the carotid sheath, between the common carotid artery and internal jugular vein", "Deep to the prevertebral fascia, on the surface of the longus colli", "Between the anterior and middle scalene muscles", "On the posterior tubercle of the C6 transverse process"], "a": 1, "why": "The cervical sympathetic chain lies deep to the prevertebral fascia, anterior to longus colli; injecting here avoids the carotid sheath and the nerve root.", "ref": "Peng 2020 ch3; Narouze 2e stellate chapter", "kw": ["cervical sympathetic trunk", "C6", "prevertebral fascia", "longus colli"], "x": ["The carotid sheath risks intravascular injection and vagal block.", "", "The interscalene groove = brachial plexus block.", "The posterior tubercle is the landmark for the C6 nerve root (SNRB), not the sympathetic chain."]}, {"d": "M", "q": "The subacromial-subdeltoid bursa is located:", "o": ["Between the subscapularis tendon and the glenoid neck", "Around the long head of biceps tendon within the bicipital groove", "Anterior to the subscapularis, not communicating with the glenohumeral joint", "Between the rotator cuff and the overlying deltoid muscle and acromion"], "a": 3, "why": "The SASD bursa lies between the rotator cuff and the overlying deltoid and acromion. Option C describes the subcoracoid bursa; option A the subscapular recess.", "ref": "Jacobson ch3", "kw": ["SASD bursa", "deltoid", "rotator cuff", "peribursal fat"], "x": ["This describes the subscapular recess of the GH joint.", "This describes the LHB tendon sheath (communicates with the GH joint).", "This describes the subcoracoid bursa.", ""]}, {"d": "M", "q": "Before injecting the long head of biceps tendon sheath, colour Doppler is used to identify which vessel, routinely seen near the needle path?", "o": ["Posterior circumflex humeral artery", "Suprascapular artery", "Anterior circumflex humeral artery and its branches", "Thoracoacromial artery"], "a": 2, "why": "Branches of the anterior circumflex humeral artery are routinely seen beside the long head of biceps and may lie in the needle path; check with colour Doppler.", "ref": "Jacobson ch3, ch9", "kw": ["long head of biceps", "bicipital groove", "anterior circumflex humeral artery", "colour Doppler"], "x": ["The posterior circumflex humeral artery runs posteriorly with the axillary nerve (quadrilateral space).", "The suprascapular artery is at the scapular notch.", "", "The thoracoacromial artery is near the coracoid, not the groove."]}, {"d": "M", "q": "The gluteus minimus tendon inserts on which facet of the greater trochanter?", "o": ["Anterior facet", "Lateral facet", "Superoposterior facet", "Posterior facet"], "a": 0, "why": "Gluteus minimus: anterior facet. Gluteus medius: lateral and superoposterior facets. The sub-gluteus maximus bursa covers the posterior facet.", "ref": "Jacobson ch6", "kw": ["greater trochanter facets", "gluteus minimus", "anterior facet"], "x": ["", "The lateral facet is the main gluteus medius insertion.", "The superoposterior facet is the gluteus medius insertion.", "The posterior facet has no tendon insertion; the sub-gluteus maximus bursa covers it."]}, {"d": "M", "q": "For ultrasound-guided hip joint injection, the needle target is:", "o": ["The lateral facet of the greater trochanter", "The anterior femoral head–neck junction, under the joint capsule", "The anterior acetabular labrum", "The lesser trochanter"], "a": 1, "why": "Target the anterior femoral head–neck junction (anterior synovial recess), then confirm spread under the capsule with saline hydrolocation or Doppler.", "ref": "Peng 2020 ch22; Peng RAPM Part 4 (Hip)", "kw": ["hip joint", "femoral head–neck junction", "anterior recess", "capsule"], "x": ["The lateral facet of the greater trochanter is a peritrochanteric (bursa/tendon) target.", "", "Needling the labrum injures it; it is not the injection target.", "The lesser trochanter is the iliopsoas insertion, outside the joint."]}, {"d": "M", "q": "In the sagittal plane above the patella, the suprapatellar recess of the knee lies between:", "o": ["The quadriceps (suprapatellar) fat pad and the prefemoral fat pad", "The infrapatellar (Hoffa) fat pad and the patellar tendon", "The prefemoral fat pad and the femoral cortex", "The quadriceps tendon and the skin"], "a": 0, "why": "The quadriceps fat pad lies anterior to the suprapatellar recess and the prefemoral fat pad lies between the recess and the femur.", "ref": "Jacobson ch7; Peng 2020 ch23", "kw": ["suprapatellar recess", "quadriceps fat pad", "prefemoral fat pad", "effusion"], "x": ["", "These are infrapatellar structures, not suprapatellar.", "There is no recess between the prefemoral fat and the femur.", "The recess lies deep to the quadriceps tendon, not between the tendon and the skin."]}], "1-2": [{"d": "G", "q": "The average speed of sound assumed by ultrasound machines for human soft tissue is:", "o": ["330 m/s", "1080 m/s", "1540 m/s", "4000 m/s"], "a": 2, "why": "Machines assume an average of 1540 m/s for soft tissue. Sound travels at about 330 m/s in air and up to about 4000 m/s in bone.", "ref": "Peng 2020 ch1", "kw": ["speed of sound", "1540 m/s", "soft tissue", "range equation"], "x": ["330 m/s is the speed of sound in air.", "Not a tissue reference value.", "", "About 4000 m/s is the speed in bone."]}, {"d": "G", "q": "With an out-of-plane needle approach, the needle is MOST typically seen on the screen as:", "o": ["A continuous hyperechoic line showing both shaft and tip", "A hyperechoic dot, and the tip cannot be told apart from the shaft unless it is tracked", "An anechoic line with posterior acoustic enhancement", "An acoustic shadow with no hyperechoic signal"], "a": 1, "why": "Out of plane, the needle crosses the beam at a right angle, so only a cross-section (a bright dot) is seen. Any part of the shaft can look like the tip, so the tip is tracked by tilting the probe or by hydrolocation.", "ref": "Peng 2020 ch1", "kw": ["out-of-plane", "short axis", "hyperechoic dot", "tip tracking", "hydrolocation"], "x": ["A full-length line with the tip visible is the in-plane image.", "", "The needle is hyperechoic, and enhancement occurs deep to fluid.", "A needle gives a bright reflection, often with reverberation, not just a shadow."]}, {"d": "G", "q": "Compared with conventional colour Doppler, power Doppler:", "o": ["Shows the direction of flow in red and blue", "Is less sensitive to slow flow", "Is unaffected by transducer movement", "Is more sensitive to slow flow in small vessels but does not show flow direction"], "a": 3, "why": "Power Doppler shows small vessels and slow flow better, assigns one colour regardless of direction, and is very prone to flash artefact from probe movement.", "ref": "Jacobson ch1", "kw": ["power Doppler", "slow flow", "no direction", "flash artefact"], "x": ["Showing direction in red and blue is conventional colour Doppler.", "The opposite is true: power Doppler is more sensitive.", "Power Doppler is very sensitive to probe movement (flash artefact).", ""]}, {"d": "C", "q": "Which corticosteroid preparation is non-particulate and is therefore recommended for cervical selective nerve root (transforaminal) injection?", "o": ["Dexamethasone sodium phosphate", "Triamcinolone acetonide", "Methylprednisolone acetate", "Betamethasone sodium phosphate/acetate suspension"], "a": 0, "why": "Spinal cord and brainstem infarcts after cervical transforaminal injection are thought to come from embolised steroid particles after intra-arterial injection, so non-particulate dexamethasone is used.", "ref": "Narouze 2e ch8; Peng 2020 ch12", "kw": ["non-particulate", "dexamethasone", "embolic infarction", "transforaminal"], "x": ["", "Triamcinolone acetonide is a particulate suspension.", "Methylprednisolone acetate is a particulate suspension.", "The acetate component of this betamethasone preparation is particulate."]}, {"d": "C", "q": "On the DN4 questionnaire, a score of at least how many points out of 10 suggests neuropathic pain?", "o": ["2", "3", "4", "6"], "a": 2, "why": "DN4 (7 interview items and 3 examination items): a score of 4/10 or more indicates likely neuropathic pain.", "ref": "Bouhassira D et al. Pain 2005;114:29–36", "kw": ["DN4", "10 items", "cut-off ≥4", "neuropathic screening"], "x": ["Too low a cut-off; poor specificity.", "Too low a cut-off; poor specificity.", "", "Too high a cut-off; misses true neuropathic pain."]}, {"d": "C", "q": "Spurling's test for cervical radiculopathy is positive when:", "o": ["Arm pain is relieved by placing the hand on top of the head", "Radicular arm pain is reproduced by neck extension and rotation or lateral flexion towards the painful side with axial compression", "Flexing the neck causes an electric sensation down the spine and limbs", "Resisted wrist extension causes pain at the lateral epicondyle"], "a": 1, "why": "Spurling's manoeuvre narrows the foramen on the affected side. Option A is the shoulder abduction relief sign, C is Lhermitte's sign and D is Cozen's test.", "ref": "Spurling RG, Scoville WB. Surg Gynecol Obstet 1944;78:350–8; Peng 2020 ch12", "kw": ["Spurling", "foraminal compression", "radicular pain", "extension + rotation"], "x": ["Shoulder abduction relief (Bakody) sign, which relieves rather than provokes pain.", "", "Lhermitte's sign (myelopathy, multiple sclerosis).", "Cozen's test (lateral epicondylosis)."]}, {"d": "S", "q": "In the transverse ultrasound view at the sacral hiatus, the caudal epidural space is the hypoechoic layer between:", "o": ["The skin and the sacrococcygeal ligament", "The erector spinae aponeurosis and the median sacral crest", "The sacral cornua and the coccyx", "The sacrococcygeal ligament (superficial) and the posterior surface of the sacrum (deep)"], "a": 3, "why": "The hiatus (failed fusion of the S4–S5 laminae) lies between the two cornua and is roofed by the sacrococcygeal ligament. The epidural space is the hypoechoic area between that ligament and the bony floor.", "ref": "Peng 2020 ch17; Narouze 2e ch12", "kw": ["sacral hiatus", "sacral cornua", "sacrococcygeal ligament", "caudal epidural space"], "x": ["Superficial to the ligament is subcutaneous tissue, not the epidural space.", "There is no erector aponeurosis plane at the hiatus.", "The cornua are the bony side walls of the hiatus, not the space itself.", ""]}, {"d": "S", "q": "The L5 dorsal ramus is blocked where it runs at the junction of:", "o": ["The sacral ala and the superior articular process of S1", "The superior articular process and transverse process of L5", "The lateral margin of the S1 posterior sacral foramen", "The inferior border of the L5 lamina"], "a": 0, "why": "Unlike L1–L4 medial branches (SAP–TP junction), the L5 dorsal ramus itself runs in the groove between the sacral ala and the S1 SAP. Option B is the target for the L4 medial branch.", "ref": "Peng 2020 ch14", "kw": ["L5 dorsal ramus", "sacral ala", "S1 SAP", "groove"], "x": ["", "The SAP–TP junction of L5 is the target for the L4 medial branch.", "The S1 foramen margin is the target for the S1 lateral branch (SIJ).", "The lamina is not a medial branch target."]}, {"d": "S", "q": "Radicular arteries running close to the cervical spinal nerve may arise from all of the following EXCEPT the:", "o": ["Vertebral artery", "Ascending cervical artery", "Superior thyroid artery", "Deep cervical artery"], "a": 2, "why": "Radicular arteries come from the vertebral, ascending cervical and deep cervical arteries. Branches of the ascending and deep cervical arteries may join the anterior spinal artery, so colour Doppler is used before needling.", "ref": "Narouze 2e ch8; Peng 2020 ch12", "kw": ["radicular artery", "vertebral artery", "ascending cervical artery", "deep cervical artery", "Doppler"], "x": ["The vertebral artery is a recognised source.", "The ascending cervical artery is a recognised source and may feed the anterior spinal artery.", "", "The deep cervical artery is a recognised source and may feed the anterior spinal artery."]}, {"d": "S", "q": "The posterior sacral network, which supplies the dorsal aspect of the sacroiliac joint, arises mainly from the:", "o": ["Medial branches of the L4 and L5 dorsal rami", "Lateral branches of the S1–S3 dorsal rami", "Ventral rami of S2–S4", "Superior cluneal nerves (L1–L3)"], "a": 1, "why": "The dorsal SIJ is supplied by the posterior sacral network from S1–S3 (occasionally L5 and S4) lateral branches, which are the targets of sacral lateral branch blocks and RF.", "ref": "Peng 2
