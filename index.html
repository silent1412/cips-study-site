function dashData(){
  /* Part 1 */
  const dom={};Object.keys(MCQ_DOMAINS).forEach(d=>dom[d]={n:0,ok:0,total:0});
  let mAns=0,mOk=0,mTotal=0;const mParts=[];
  for(const k in MCQ){const st=mcqState(k),show=reveal(st);let a=0,o=0;
    MCQ[k].forEach((q,i)=>{dom[q.d].total++;mTotal++;
      if(show&&st.ans[i]!==undefined){a++;dom[q.d].n++;if(st.ans[i]===q.a){o++;dom[q.d].ok++}}});
    mAns+=a;mOk+=o;mParts.push({k,a,o,n:MCQ[k].length,done:st.done})}
  /* Part 2A */
  const procs=PROCS.filter(p=>PRACT[p[0]]).map(p=>{
    const items=[...PRACT[p[0]].html.matchAll(/<input type='checkbox'[^>]*>\s*(.*?)<\/label>/g)].map(m=>m[1].replace(/<[^>]+>/g,""));
    const s=pracState(p[0]);const n=items.filter((_,i)=>s[i]).length;
    return {id:p[0],name:p[1],region:p[2],items,ticks:s,n,t:items.length,started:items.some((_,i)=>s[i])}});
  const pStarted=procs.filter(p=>p.started);
  const regions=REGIONS.map((r,ri)=>{const ps=pStarted.filter(p=>p.region===ri);
    return {r,ready:procs.filter(p=>p.region===ri).length,started:ps.length,perf:ps.length?ps.reduce((a,p)=>a+p.n/p.t,0)/ps.length:null}});
  const missed=[];pStarted.forEach(p=>p.items.forEach((t,i)=>{if(!p.ticks[i])missed.push({id:p.id,t})}));
  /* Part 2B */
  const cases=Object.keys(CASES).map(id=>{const s=state(id);const sc={};
    for(const i in s.scores){const v=+s.scores[i];if(!v)continue;sc[i]=+i===1?Math.min(4,v/3):v}
    const vals=Object.values(sc);const info=CASE_LIST.find(c=>c[0]===id);
    return {id,title:(info&&info[1])||CASES[id].title,topic:+id.split(".")[0],sc,n:vals.length,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}});
  const vStarted=cases.filter(c=>c.n);
  const byQ=QUESTIONS.map((q,i)=>{const v=vStarted.map(c=>c.sc[i]).filter(x=>x!=null);return {q,i,n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  const byTopic=TOPICS.map((t,ti)=>{const cs=vStarted.filter(c=>c.topic===ti+1);const v=cs.map(c=>c.avg);
    return {t,ti,ready:cases.filter(c=>c.topic===ti+1).length,n:cs.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  /* parts */
  const p1={perf:mAns?mOk/mAns:null,cov:mTotal?mAns/mTotal:0};
  const p2a={perf:pStarted.length?pStarted.reduce((a,p)=>a+p.n/p.t,0)/pStarted.length:null,cov:procs.length?pStarted.length/procs.length:0};
  const vAll=vStarted.flatMap(c=>Object.values(c.sc));
  const p2b={perf:vAll.length?vAll.reduce((a,b)=>a+b,0)/vAll.length/4:null,cov:cases.length?vStarted.length/cases.length:0};
  const mastery=0.2*(p1.perf||0)*p1.cov+0.6*(p2a.perf||0)*p2a.cov+0.2*(p2b.perf||0)*p2b.cov;
  return {dom,mAns,mOk,mTotal,mParts,procs,pStarted,regions,missed,cases,vStarted,byQ,byTopic,p1,p2a,p2b,mastery};
}

function focusList(D){
  const f=[];
  /* weight: Part 2A carries 60%, so its gaps rank first */
  D.pStarted.filter(p=>p.n/p.t<0.75).forEach(p=>f.push({w:3+(1-p.n/p.t),part:"2A",txt:`Rework ${p.id} ${p.name}: ${p.n} of ${p.t} self-check steps`,h:"#proc-"+p.id}));
  D.procs.filter(p=>!p.started).forEach(p=>f.push({w:2.5,part:"2A",txt:`Not practised yet: ${p.id} ${p.name}`,h:"#proc-"+p.id}));
  Object.entries(D.dom).forEach(([d,v])=>{if(v.n>=3&&v.ok/v.n<0.7)f.push({w:2+(0.7-v.ok/v.n)*3,part:"1",txt:`${MCQ_DOMAINS[d]}: ${v.ok}/${v.n} correct (${pct(v.ok/v.n)}%). Review your wrong answers`,h:"#mcq-review"})});
  D.mParts.filter(p=>!p.a).slice(0,2).forEach(p=>f.push({w:1.5,part:"1",txt:`MCQ Set ${p.k.split("-")[0]}, Part ${p.k.split("-")[1]} not started`,h:"#mcq-"+p.k}));
  D.byQ.filter(q=>q.n&&q.avg<3).forEach(q=>f.push({w:2+(3-q.avg),part:"2B",txt:`Viva Q${q.i+1} ${QSHORT[q.i].toLowerCase()} averages ${q.avg.toFixed(1)} of 4`,h:"#case-"+(D.vStarted[0]||{id:"6.2"}).id.replace(".","-")}));
  D.vStarted.filter(c=>c.avg<3).forEach(c=>f.push({w:1.8+(3-c.avg),part:"2B",txt:`Repeat viva case ${c.id} ${c.title}: average ${c.avg.toFixed(1)} of 4`,h:"#case-"+c.id.replace(".","-")}));
  D.cases.filter(c=>!c.n).slice(0,2).forEach(c=>f.push({w:1.2,part:"2B",txt:`Viva case not tried: ${c.id} ${c.title}`,h:"#case-"+c.id.replace(".","-")}));
  return f.sort((a,b)=>b.w-a.w).slice(0,8);
}

function bar(label,val,sub,href,cov){
  const w=val==null?0:Math.max(2,pct(val));
  const inner=`<span class="bl">${label}</span><span class="bt"><span class="bf ${cov?"":tone(val)}" style="width:${w}%"></span>${cov?"":`<span class="pass" title="Pass line 75% (score 3 of 4)"></span>`}</span><span class="bv">${val==null?"–":pct(val)+"%"}</span><span class="bs">${sub}</span>`;
  return href?`<a class="brow" href="${href}">${inner}</a>`:`<div class="brow">${inner}</div>`;
}

function renderDash(){
  if(typeof timerId!=="undefined")clearInterval(timerId);
  const D=dashData(),main=document.getElementById("main"),ul=document.getElementById("topics");
  document.getElementById("sub").textContent=(typeof SYNC!=="undefined"&&SYNC.on)?"Your progress · saved to your account":"Your progress · saved in this browser";
  ul.innerHTML=DASH_SECS.map((s,i)=>`<li><button data-s="${s[0]}"><span class="n">${i+1}</span><span>${s[1]}</span><span></span></button></li>`).join("");
  ul.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.s)?.scrollIntoView({behavior:"smooth",block:"start"});
    ul.querySelectorAll("button").forEach(x=>x.setAttribute("aria-current",String(x===b)))});
  const tile=(lab,big,cls,sub)=>`<div class="tile"><span class="tl">${lab}</span><b class="${cls}">${big}</b><span class="ts">${sub}</span></div>`;
  const F=focusList(D);
  const act=store.get("cips-activity",{});
  const today=new Date();today.setHours(0,0,0,0);
  const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const start=new Date(today);start.setDate(start.getDate()-83-((today.getDay()+6)%7)+6);
  const days=[];for(let d=new Date(start);d<=today;d.setDate(d.getDate()+1))days.push({k:dkey(d),n:act[dkey(d)]||0,dt:new Date(d)});
  let streak=0;for(let d=new Date(today);act[dkey(d)];d.setDate(d.getDate()-1))streak++;
  const active7=days.slice(-7).filter(d=>d.n).length,activeAll=Object.keys(act).length;
  const lvl=n=>n===0?0:n<5?1:n<15?2:n<40?3:4;
  const empty=!D.mAns&&!D.pStarted.length&&!D.vStarted.length;

  main.innerHTML=`<div class="case-head"><span class="eyebrow">Dashboard</span><h2>Your CIPS progress</h2>
  <p class="refs" style="margin:0">Weighted like the exam: Part 2A 60%, Part 1 20%, Part 2B 20%. Figures are self-assessed study aids, not a prediction of your exam result.</p></div>
  ${empty?`<div class="card tip" style="margin-bottom:16px">Nothing tracked yet. Answer an MCQ part, tick a practical self-check or score a viva case, and this page fills in automatically.</div>`:""}

  <section id="d-overview" class="dsec"><div class="tiles">
   ${tile("Mastery of available material",pct(D.mastery)+"%",tone(D.mastery||null),"performance × coverage, exam-weighted")}
   ${tile("Part 1 MCQ",D.p1.perf==null?"–":pct(D.p1.perf)+"%",tone(D.p1.perf),`${D.mOk}/${D.mAns} correct · ${D.mAns} of ${D.mTotal} answered`)}
   ${tile("Part 2A Practical",D.p2a.perf==null?"–":pct(D.p2a.perf)+"%",tone(D.p2a.perf),`self-check · ${D.pStarted.length} of ${D.procs.length} procedures practised`)}
   ${tile("Part 2B Viva",D.p2b.perf==null?"–":(D.p2b.perf*4).toFixed(1)+" / 4",tone(D.p2b.perf),`${D.vStarted.length} of ${D.cases.length} cases tried`)}
  </div>
  <div class="card" style="margin-top:12px"><h3 class="dh">Coverage</h3>
   ${bar("Part 1 MCQ",D.p1.cov,`${D.mAns} of ${D.mTotal} questions`,"#mcq-"+mcqKey,1)}
   ${bar("Part 2A Practical",D.p2a.cov,`${D.pStarted.length} of ${D.procs.length} chapters`,"#practical",1)}
   ${bar("Part 2B Viva",D.p2b.cov,`${D.vStarted.length} of ${D.cases.length} cases`,"#case-"+current.replace(".","-"),1)}
   <p class="refs" style="margin:8px 0 0">Share of the material ready on the site that you have worked through. On the score bars below, the marker is 75%, the equivalent of a score of 3 ("acceptable, basic competence").</p></div></section>

  <section id="d-focus" class="dsec card"><h3 class="dh">Focus next</h3>
   ${F.length?`<ol class="focus">${F.map(x=>`<li><span class="ptag p${x.part}">Part ${x.part}</span><a href="${x.h}">${x.txt}</a></li>`).join("")}</ol>`:`<p class="refs">No weak spots flagged yet. Keep practising: items appear here when a domain falls below 70%, a procedure below 6 of 8 steps, or a viva score below 3.</p>`}</section>

  <section id="d-mcq" class="dsec card"><h3 class="dh">Part 1 · accuracy by syllabus domain</h3>
   ${Object.entries(D.dom).map(([d,v])=>bar(MCQ_DOMAINS[d],v.n?v.ok/v.n:null,`${v.ok}/${v.n} answered · ${v.total} in bank`)).join("")}
   <div class="minis">${D.mParts.map(p=>`<a class="mini ${p.a?tone(p.o/Math.max(1,p.a)):""}" href="#mcq-${p.k}"><b>${p.k.replace("-",".")}</b>${p.a?`${p.o}/${p.a}`:"–"}</a>`).join("")}</div>
   <p class="refs" style="margin:6px 0 0">Practice-mode answers count straight away; exam-mode answers count once you submit. <a href="#mcq-review">Review wrong answers</a></p></section>

  <section id="d-prac" class="dsec card"><h3 class="dh">Part 2A · self-check by region</h3>
   ${D.regions.map(r=>bar(r.r,r.perf,`${r.started} of ${r.ready} practised`)).join("")}
   <div class="ptable">${D.procs.map(p=>`<a class="pcell ${p.started?tone(p.n/p.t):"none"}" href="#proc-${p.id}" title="${p.name}"><b>${p.id}</b><span>${p.started?p.n+"/"+p.t:"not yet"}</span></a>`).join("")}</div>
   ${D.missed.length?`<h4 class="dh4">Steps you have not yet ticked</h4><ul class="missed">${D.missed.slice(0,10).map(m=>`<li><a href="#proc-${m.id}">${m.id}</a> ${m.t}</li>`).join("")}</ul>${D.missed.length>10?`<p class="refs">and ${D.missed.length-10} more.</p>`:""}`:""}</section>

  <section id="d-viva" class="dsec card"><h3 class="dh">Part 2B · average score by question</h3>
   ${D.byQ.map(q=>bar("Q"+(q.i+1)+" "+QSHORT[q.i],q.avg==null?null:q.avg/4,q.n?`${q.avg.toFixed(1)} / 4 · ${q.n} case${q.n>1?"s":""}`:"not scored")).join("")}
   <h4 class="dh4">By topic</h4>
   <div class="ptable">${D.byTopic.filter(t=>t.ready).map(t=>`<div class="pcell ${t.n?tone(t.avg/4):"none"}" title="${t.t}"><b>${t.ti+1}</b><span>${t.t}</span><span>${t.n?t.avg.toFixed(1)+" / 4":t.ready+" ready"}</span></div>`).join("")}</div>
   <p class="refs" style="margin:6px 0 0">Q2 (physical examination) is scored out of 12 in the case and shown here divided by 3.</p></section>

  <section id="d-activity" class="dsec card"><h3 class="dh">Study activity · last 12 weeks</h3>
   <div class="row" style="gap:22px;margin-bottom:10px"><span><b class="big">${streak}</b> day streak</span><span><b class="big">${active7}</b> of last 7 days</span><span><b class="big">${activeAll}</b> study days in all</span></div>
   <div class="heat">${days.map(d=>`<span class="hc l${lvl(d.n)}" title="${d.dt.toDateString()}: ${d.n} saves"></span>`).join("")}</div>
   <p class="refs" style="margin:8px 0 0">One square per day, Monday at the top. Darker means more answers and ticks saved that day. Activity counts from the day this dashboard was added.</p></section>

  <section id="d-data" class="dsec card"><h3 class="dh">Backup and reset</h3>
   <p class="refs" style="margin:0 0 10px">${typeof SYNC!=="undefined"&&SYNC.on?"<b>You are signed in.</b> Your progress is saved privately to your Claude account and follows you to any device where you sign in. The backup code below is optional. ":"Progress is saved in this browser only. Open the kit while signed in to your Claude account to save it to your account instead. "}To move progress by hand, show your backup code, copy it, then paste it here on the other device and press Restore.</p>
   <div class="row"><button class="btn" id="dexp">Show backup code</button><button class="btn" id="dimp">Restore from pasted code</button><button class="btn danger" id="dreset">Reset all progress</button><span class="refs" id="dmsg"></span></div>
   <textarea id="dbox" class="dbox" spellcheck="false" placeholder="Your backup code appears here. To restore, paste a backup code here and press Restore."></textarea></section>`;

  const msg=t=>{document.getElementById("dmsg").textContent=t};
  const box=document.getElementById("dbox");
  document.getElementById("dexp").onclick=()=>{try{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("cips-"))o[k]=localStorage.getItem(k)}
    box.value=JSON.stringify(o);box.focus();box.select();
    try{document.execCommand("copy")?msg("Backup code shown and copied. Save it somewhere safe."):msg("Select the code and copy it.")}catch(e){msg("Select the code and copy it.")}}catch(e){msg("Storage is not available here.")}};
  document.getElementById("dimp").onclick=()=>{try{const o=JSON.parse(box.value.trim());let n=0;for(const k in o)if(k.startsWith("cips-")&&typeof o[k]==="string"){localStorage.setItem(k,o[k]);n++}
    if(!n){msg("No CIPS progress found in that code.");return}msg(n+" items restored.");setTimeout(renderDash,700)}catch(e){msg("Paste a full backup code first.")}};
  let armed=false;document.getElementById("dreset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Click again to erase everything";setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent="Reset all progress"},4000);return}
    try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("cips-"))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(err){}renderDash()};
}

const routeDashPrev=route;
route=function(){
  if(location.hash==="#dashboard"){setMode("dash");renderDash();window.scrollTo(0,0);return}
  routeDashPrev();
};

/* Sign-in sync: when the viewer is signed in to Claude and the page has db + user,
   progress (all cips-* keys) is saved privately to their account under data/users/<id>/,
   and merged across devices (newest change per item wins). Otherwise it stays in this browser. */
const SYNC={on:false,uid:null,name:"",db:null,pending:{},timer:null,busy:false};
(function(){
  const raw=store.set.bind(store);
  store.set=function(k,v){raw(k,v);
    if(typeof k==="string"&&k.startsWith("cips-")&&k!=="cips-meta"){
      const m=store.get("cips-meta",{}),now=Date.now();m[k]=now;if(localStorage.getItem("cips-activity")!==null)m["cips-activity"]=now;raw("cips-meta",m);
      if(SYNC.on){syncQueue(k);syncQueue("cips-activity")}}};
  const aside=document.querySelector("aside"),h1=aside&&aside.querySelector("h1");
  if(h1&&!document.getElementById("acct"))h1.insertAdjacentHTML("afterend",'<div class="acct" id="acct"><span class="dot"></span><span id="acctTxt">Saved on this device</span></div>');
})();
function syncGroup(k){return k.startsWith("cips-mcq-")?"mcq":k.startsWith("cips-prac-")?"prac":k.startsWith("cips-viva-")?"viva":"misc"}
function syncStatus(t,state){const el=document.getElementById("acct");if(!el)return;el.className="acct "+(state||"");document.getElementById("acctTxt").textContent=t;el.title=state==="on"?"Your progress is saved privately to your Claude account and follows you to any device where you are signed in.":"Progress is saved in this browser only. Open the kit while signed in to your Claude account to save it to your account."}
function syncQueue(k){const g=syncGroup(k);SYNC.pending[g]=true;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncFlush,1500)}
async function syncFlush(){
  if(SYNC.busy){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncFlush,1000);return}
  SYNC.busy=true;const groups=Object.keys(SYNC.pending);SYNC.pending={};
  const meta=store.get("cips-meta",{});
  try{
    for(const g of groups){const items={};
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
        if(k.startsWith("cips-")&&k!=="cips-meta"&&syncGroup(k)===g)items[k]={v:localStorage.getItem(k),t:meta[k]||0}}
      await SYNC.db.doc("data/users/"+SYNC.uid+"/"+g).set({items,updated:Date.now()})}
    syncStatus("Saved to your account","on");
  }catch(e){
    if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){SYNC.on=false;syncStatus("Saved on this device","")}
    else{groups.forEach(g=>SYNC.pending[g]=true);syncStatus("Offline · will retry","warn");clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncFlush,15000)}
  }
  SYNC.busy=false;
}
async function syncStart(){
  if(!window.claude||!window.claude.use)return;
  let user=null,db=null;
  try{[user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")])}catch(e){}
  if(!user||!db)return;
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid)return;
  SYNC.db=db;SYNC.uid=uid;
  try{const me=await user.me();SYNC.name=(me&&me.name)||""}catch(e){}
  syncStatus("Connecting to your account…","warn");
  const meta=store.get("cips-meta",{});let changed=false;const push={};
  try{
    const snaps=await Promise.race([
      Promise.all(["mcq","prac","viva","misc"].map(g=>db.doc("data/users/"+uid+"/"+g).get())),
      new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    const cloud={};snaps.forEach(s=>{const d=s.exists&&s.data();if(d&&d.items)Object.assign(cloud,d.items)});
    for(const k in cloud){const c=cloud[k];if(!k.startsWith("cips-")||typeof c.v!=="string")continue;
      if((c.t||0)>(meta[k]||0)){try{localStorage.setItem(k,c.v)}catch(e){}meta[k]=c.t;changed=true}}
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
      if(k.startsWith("cips-")&&k!=="cips-meta"&&(!cloud[k]||(meta[k]||0)>(cloud[k].t||0)))push[syncGroup(k)]=true}
    try{localStorage.setItem("cips-meta",JSON.stringify(meta))}catch(e){}
  }catch(e){syncStatus("Account not reachable · saved on this device","warn");return}
  SYNC.on=true;
  syncStatus(SYNC.name?"Signed in as "+SYNC.name:"Signed in · saved to your account","on");
  if(Object.keys(push).length){Object.assign(SYNC.pending,push);syncFlush().then(()=>syncStatus(SYNC.name?"Signed in as "+SYNC.name:"Signed in · saved to your account","on"))}
  if(changed){try{route()}catch(e){}}
}
syncStart();
/*DASH-END*/
window.addEventListener("hashchange",route);route();
</script>
